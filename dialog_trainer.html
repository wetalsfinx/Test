<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>585GOLD | Тренировка диалога</title>
    
    <!-- 🔥 ПОДКЛЮЧЕНИЕ FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .main-container { max-width: 900px; margin: 0 auto; }
        
        .employee-view {
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 {
            color: #c41e3a;
            margin: 0 0 8px 0;
            font-size: 32px;
            font-weight: 800;
        }
        .header p { color: #6b7280; font-size: 16px; margin: 0; }
        
        .register-form {
            background: #f9fafb;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
        }
        .register-form input, .register-form select {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .register-form input:focus, .register-form select:focus {
            outline: none;
            border-color: #c41e3a;
            box-shadow: 0 0 0 4px rgba(196,30,58,0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 18px 32px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background: #c41e3a;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover { background: #a0162e; transform: translateY(-2px); }
        .btn-primary:disabled { background: #d1d5db; cursor: not-allowed; transform: none; }
        
        .game-container {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            margin-top: 16px;
        }
        
        .progress-indicator { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            padding: 20px 24px 0 24px; 
        }
        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background: #e5e7eb; 
            transition: 0.3s; 
        }
        .dot.active { background: #c41e3a; transform: scale(1.2); }
        .dot.done { background: #10b981; }
        .dot.failed { background: #ef4444; }
        
        .chat-area { 
            padding: 24px; 
            background: #f9fafb; 
        }
        .client-message {
            background: white;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 16px;
            color: #1f2937;
            border-left: 4px solid #c41e3a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .applied-rules {
            background: #fff1f2;
            border-radius: 16px;
            padding: 16px 20px;
            margin: 0 24px 24px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            border: 1px solid #fecdd3;
        }
        .applied-rules > span:first-child {
            font-weight: 600;
            color: #9f1239;
            font-size: 14px;
            width: 100%;
            margin-bottom: 4px;
        }
        .applied-rule { 
            background: white; 
            color: #c41e3a; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 600;
            border: 1px solid #fecdd3;
        }
        
        .choices-area { 
            padding: 0 24px 24px 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .choice-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            text-align: left;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            line-height: 1.5;
            color: #374151;
            font-family: 'Inter', sans-serif;
        }
        .choice-btn:hover {
            border-color: #c41e3a;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(196,30,58,0.1);
        }
        .choice-btn.selected {
            border-color: #c41e3a;
            background: #fff1f2;
            box-shadow: 0 4px 16px rgba(196,30,58,0.15);
        }
        .choice-btn.correct {
            border-color: #10b981;
            background: #d1fae5;
        }
        .choice-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
            opacity: 0.7;
        }
        
        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #c41e3a;
            color: white;
            font-weight: 700;
            margin-right: 12px;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .next-area { 
            padding: 0 24px 24px 24px; 
        }
        .next-btn {
            width: 100%;
            padding: 18px 32px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background: #d97706;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .next-btn:hover { background: #b45309; transform: translateY(-2px); }
        .next-btn:disabled { background: #d1d5db; cursor: not-allowed; transform: none; }
        
        .result-card { 
            padding: 28px; 
            margin: 0 24px 24px 24px; 
            border-radius: 20px; 
            border: 2px solid #e5e7eb;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card.success { background: #d1fae5; border-color: #10b981; }
        .result-card.loss { background: #fee2e2; border-color: #ef4444; }
        
        .result-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
        }
        .result-card.success h2 { color: #065f46; }
        .result-card.loss h2 { color: #991b1b; }
        
        .rec-section { 
            margin-top: 16px; 
            text-align: left; 
        }
        .rec-section h4 { 
            color: #991b1b; 
            font-size: 15px; 
            margin-bottom: 12px; 
            text-align: center; 
            font-weight: 700;
        }
        .rec-item { 
            background: white; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 10px; 
            border-left: 4px solid #ef4444; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .rec-item .rec-rule { 
            font-weight: 600; 
            font-size: 14px; 
            color: #1f2937; 
            margin-bottom: 6px;
        }
        .rec-item .rec-tip { 
            font-size: 13px; 
            color: #6b7280; 
            line-height: 1.5;
        }
        .rec-perfect { 
            text-align: center; 
            padding: 16px; 
            background: white; 
            border-radius: 12px; 
            color: #065f46; 
            margin-top: 12px; 
            font-weight: 600;
        }
        
        .restart-btn {
            background: #c41e3a;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 18px 32px;
            font-size: 16px;
            margin: 0 24px 24px 24px;
            width: calc(100% - 48px);
            cursor: pointer;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .restart-btn:hover { background: #a0162e; transform: translateY(-2px); }
        
        .current-user {
            background: #fff1f2;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 16px;
            color: #c41e3a;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid #fecdd3;
        }
        .save-status { 
            font-size: 14px; 
            font-weight: 600; 
            margin-top: 10px; 
            text-align: center; 
        }
        
        @media (max-width: 600px) {
            body { padding: 12px; }
            .employee-view { padding: 20px; }
            .header h1 { font-size: 24px; }
            .choice-btn { font-size: 14px; padding: 16px; }
            .next-btn, .btn-primary, .restart-btn { padding: 16px 20px; font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="employee-view">
        <div class="header">
            <h1>🎯 585GOLD | Тренировка диалога</h1>
            <p>Пройди диалог с клиентом, применяя стандарты продаж</p>
        </div>
        
        <div class="register-form" id="registerForm">
            <input type="text" id="userName" placeholder="Введите имя и фамилию" autocomplete="off">
            <select id="userCity">
                <option value="">Выберите город</option>
                <option value="Уфа">Уфа</option>
                <option value="Екатеринбург">Екатеринбург</option>
                <option value="Санкт-Петербург, Московский, 2">Санкт-Петербург, Московский, 2</option>
                <option value="Санкт-Петербург, Новаторов, 112">Санкт-Петербург, Новаторов, 112</option>
                <option value="Калининград">Калининград</option>
                <option value="Нижний Тагил">Нижний Тагил</option>
            </select>
            <button class="btn-primary" id="startGameBtn">🚀 Начать диалог</button>
        </div>
        
        <div id="currentUserDisplay" class="current-user" style="display: none;"></div>
        
        <div id="gameContainer" style="display: none;">
            <div class="game-container">
                <div class="progress-indicator" id="progressDots"></div>
                <div class="chat-area" id="chatArea"></div>
                <div class="applied-rules">
                    <span>🏆 Применённые правила:</span>
                    <span id="emptyRulesMsg" style="color: #9f1239; font-size: 13px;">(пока ни одного)</span>
                    <div id="appliedRulesList" style="display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 4px;"></div>
                </div>
                <div class="choices-area" id="choicesArea"></div>
                <div class="next-area" id="nextArea">
                    <button class="next-btn" id="nextBtn" disabled>Далее ➡️</button>
                </div>
                <div class="result-card" id="resultCard" style="display: none;"></div>
                <div id="saveStatus" class="save-status"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== 🔥 ИНИЦИАЛИЗАЦИЯ FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyACk392rDmGmYxaC1uqQqMsRvjOaYKgpTc",
        authDomain: "gold-8105a.firebaseapp.com",
        databaseURL: "https://gold-8105a-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "gold-8105a",
        storageBucket: "gold-8105a.firebasestorage.app",
        messagingSenderId: "195469188947",
        appId: "1:195469188947:web:af9671f88b0e70eceecba6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ========== 🔄 АВТОМАТИЧЕСКАЯ ДОЗАГРУЗКА НЕСОХРАНЁННЫХ РЕЗУЛЬТАТОВ ==========
    window.addEventListener('load', async () => {
        const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
        if (backup.length > 0) {
            console.log(`🔄 Найдено ${backup.length} несохранённых результатов диалога. Отправляем в Firebase...`);
            for (let result of backup) {
                try {
                    const newRef = db.ref('results/dialog').push();
                    await newRef.set(result);
                    console.log('✅ Отправлено из бэкапа:', result.user_name);
                } catch(e) {
                    console.error('❌ Ошибка дозагрузки из бэкапа:', e.message);
                }
            }
            localStorage.removeItem('dialog_backup');
            console.log('✅ Все локальные результаты диалога отправлены в Firebase!');
        }
    });

    const ALL_RULES = [
        { id: "initiative", name: "Проявляй инициативу", rec: "Через 20-30 секунд подойди и спроси: «Какое изделие выбираете? Для себя или в подарок?»" },
        { id: "askBeforeShow", name: "Задавай вопросы ДО показа", rec: "Сначала спроси «для какого случая?», «кто получатель?». Только потом показывай украшения." },
        { id: "emotionalHPW", name: "Презентуй с эмоцией (ХПВ)", rec: "Привязывай украшение к событию: «Это кольцо будет напоминать о вашей годовщине...»" },
        { id: "fittingOffer", name: "Предлагай примерку через «Давайте»", rec: "Всегда предлагай примерку фразой «Давайте примерим»." },
        { id: "alternative", name: "Не отпускай без альтернативы", rec: "Если нет размера — сразу покажи похожие варианты и каталог заказов." },
        { id: "warmClosing", name: "Завершай с теплотой", rec: "«Спасибо, что зашли! Если будете выбирать подарки — заходите...»" }
    ];

    const QUESTIONS = [
        { client: "Клиент зашёл, молча смотрит на витрину с кольцами около 25 секунд. Что делаете?", ruleId: "initiative", correct: 1, choices: ["«Добрый день! Выбираете что-то конкретное или просто смотрите?»", "«Добрый день. У нас сегодня скидка 30% на бриллианты. Какое изделие выбираете? Для себя или в подарок?»", "«Здравствуйте! Если нужна помощь — обращайтесь» (и отхожу)"] },
        { client: "Клиент: «Хочу подарить жене кольцо, бюджет до 40 000 ₽». Что делаете?", ruleId: "askBeforeShow", correct: 1, choices: ["«Отлично! Давайте посмотрим вот эту коллекцию — она как раз в вашем бюджете»", "«А для какого случая? Что ей нравится?»", "«40 тысяч — хороший бюджет. Покажу несколько вариантов в нейтральном стиле, а вы выберете»"] },
        { client: "Клиент: «Годовщина 10 лет. Жена любит винтажный стиль». Показываете кольцо. Что говорите?", ruleId: "emotionalHPW", correct: 2, choices: ["«Это кольцо из нашей винтажной коллекции. Очень качественная огранка, хорошая цена»", "«Такие кольца сейчас хорошо покупают — это тренд сезона»", "«Это кольцо будет напоминать о вашей годовщине каждый раз, когда вы на него посмотрите. Оно создано для таких моментов»"] },
        { client: "Клиент заинтересовался: «Да, это близко. Можно посмотреть?»", ruleId: "fittingOffer", correct: 1, choices: ["«Хотите, чтобы я показала это кольцо поближе?»", "«Давайте посмотрим на него вблизи — так вы сразу увидите, как оно прекрасно. Давайте примерим?»", "«У нас есть зеркало вон там — можете померить, если захотите»"] },
        { client: "Клиент посмотрел кольцо, улыбается: «Красиво… но размера 16,5 нет в наличии». Что делаете?", ruleId: "alternative", correct: 0, choices: ["«Давайте покажу похожие кольца, которые есть в наличии, а также каталог на заказ — сможем заказать точно под размер»", "«Как жаль! Давайте посмотрим, что ещё есть в этой витрине»", "«Можем заказать с доставкой через 2-3 недели. Внесёте предоплату?»"] },
        { client: "Клиент выбрал похожую модель, оформил заказ. Прощается. Что говорите?", ruleId: "warmClosing", correct: 2, choices: ["«Спасибо за покупку! Хорошего дня»", "«Будем рады видеть вас снова. У нас обновления коллекции каждую неделю»", "«Спасибо, что зашли к нам! Если будете выбирать подарки — заходите, вместе найдём что-то особенное»"] }
    ];

    // ========== 🔥 ФУНКЦИЯ СОХРАНЕНИЯ В FIREBASE ==========
    async function saveToFirebase(resultData) {
        try {
            const localBackup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            if (!localBackup.some(r => r.id === resultData.id)) {
                localBackup.push(resultData);
                localStorage.setItem('dialog_backup', JSON.stringify(localBackup));
            }
        } catch(e) { console.error('Не удалось сохранить локально:', e); }

        try {
            const newRef = db.ref('results/dialog').push();
            await newRef.set(resultData);
            
            const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            const filtered = backup.filter(r => r.id !== resultData.id);
            localStorage.setItem('dialog_backup', JSON.stringify(filtered));
            
            return true;
        } catch (error) {
            console.error('❌ Ошибка сохранения в Firebase:', error);
            return false;
        }
    }

    // ========== СОСТОЯНИЕ ==========
    let currentQuestionIndex = 0;
    let currentAnswers = [];
    let appliedRules = [];
    let currentUserName = null;
    let currentUserCity = null;
    let gameActive = false;
    let selectedChoiceIndex = null;
    let questionResults = [];

    // ========== ЛОГИКА ==========
    function nextStep() {
        if (!gameActive || selectedChoiceIndex === null) return;
        
        const isCorrect = selectedChoiceIndex === QUESTIONS[currentQuestionIndex].correct;
        const ruleId = QUESTIONS[currentQuestionIndex].ruleId;
        
        currentAnswers.push({ 
            question: currentQuestionIndex, 
            selected: selectedChoiceIndex, 
            correct: isCorrect, 
            ruleId: ruleId
        });
        
        questionResults[currentQuestionIndex] = isCorrect;
        
        if (isCorrect) {
            const r = ALL_RULES.find(x => x.id === ruleId);
            if (r && !appliedRules.includes(r.name)) appliedRules.push(r.name);
        }
        
        currentQuestionIndex++;
        
        if (currentQuestionIndex >= QUESTIONS.length) {
            finishGame();
        } else {
            selectedChoiceIndex = null;
            renderQuestion();
        }
    }

    async function finishGame() {
        gameActive = false;
        const success = appliedRules.length === 6;
        document.getElementById("choicesArea").innerHTML = "";
        document.getElementById("nextArea").style.display = "none";
        const resultDiv = document.getElementById("resultCard");
        resultDiv.style.display = "block";
        resultDiv.className = `result-card ${success ? "success" : "loss"}`;
        
        let html = '';
        if (success) {
            html = `<h2>🏆 ПОБЕДА!</h2><p style="text-align:center; font-size:18px;">Вы применили все 6 правил!</p><div class="rec-perfect"><strong>ИДЕАЛЬНО!</strong></div>`;
        } else {
            const missingRules = ALL_RULES.filter(r => !appliedRules.includes(r.name));
            html = `<h2>😞 ДИАЛОГ НЕ ПРОЙДЕН</h2><p style="text-align:center; font-size:18px;">Применено правил: ${appliedRules.length} из 6</p>`;
            if (missingRules.length > 0) {
                html += `<div class="rec-section"><h4>📚 НЕ ПРИМЕНЕНЫ</h4>`;
                missingRules.forEach(rule => {
                    html += `<div class="rec-item"><div class="rec-rule">❌ ${rule.name}</div><div class="rec-tip">📌 ${rule.rec}</div></div>`;
                });
                html += `</div>`;
            }
        }
        resultDiv.innerHTML = html;
        await saveResult(success);
        
        const existingBtn = resultDiv.parentNode.querySelector('.restart-btn');
        if (!existingBtn) {
            const btn = document.createElement("button");
            btn.className = "restart-btn";
            btn.innerText = "🔄 Пройти заново";
            btn.onclick = () => resetGame();
            resultDiv.parentNode.appendChild(btn);
        }
    }

    async function saveResult(success) {
        const resultData = {
            id: Date.now(), type: 'trainer', user_name: currentUserName, city: currentUserCity,
            score: appliedRules.length, total: ALL_RULES.length,
            percent: Math.round((appliedRules.length / ALL_RULES.length) * 100),
            passed: success, rules_applied: appliedRules, rules_count: appliedRules.length,
            answers: currentAnswers, date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        const statusDiv = document.getElementById('saveStatus');
        if (statusDiv) { statusDiv.innerHTML = '⏳ Сохранение...'; statusDiv.style.color = '#d97706'; }
        
        const saved = await saveToFirebase(resultData);
        
        if (statusDiv) {
            if (saved) { statusDiv.innerHTML = '✅ Результат мгновенно сохранён!'; statusDiv.style.color = '#10b981'; }
            else { statusDiv.innerHTML = '⚠️ Сохранено локально, будет отправлено при следующем запуске.'; statusDiv.style.color = '#ef4444'; }
        }
    }

    function renderQuestion() {
        const q = QUESTIONS[currentQuestionIndex];
        document.getElementById("chatArea").innerHTML = `<div class="client-message">${q.client}</div>`;
        updateProgress();
        
        const rulesDiv = document.getElementById("appliedRulesList");
        if (appliedRules.length) {
            document.getElementById("emptyRulesMsg").style.display = "none";
            rulesDiv.innerHTML = appliedRules.map(r => `<span class="applied-rule">✅ ${r}</span>`).join('');
        } else {
            document.getElementById("emptyRulesMsg").style.display = "inline";
            rulesDiv.innerHTML = "";
        }
        
        const choicesDiv = document.getElementById("choicesArea");
        choicesDiv.innerHTML = "";
        selectedChoiceIndex = null;
        document.getElementById("nextBtn").disabled = true;
        
        q.choices.forEach((c, idx) => {
            const letter = String.fromCharCode(65 + idx); // A, B, C
            const btn = document.createElement("div");
            btn.className = "choice-btn";
            btn.innerHTML = `<span class="option-label">${letter}</span> <span>${c}</span>`;
            btn.onclick = () => {
                document.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                selectedChoiceIndex = idx;
                document.getElementById("nextBtn").disabled = false;
            };
            choicesDiv.appendChild(btn);
        });
    }

    function updateProgress() {
        const dotsContainer = document.getElementById('progressDots');
        dotsContainer.innerHTML = '';
        for (let i = 0; i < QUESTIONS.length; i++) {
            const dot = document.createElement('span');
            dot.className = 'dot';
            if (i < currentQuestionIndex) dot.classList.add(questionResults[i] ? 'done' : 'failed');
            else if (i === currentQuestionIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function startGame(name, city) {
        currentUserName = name; 
        currentUserCity = city; 
        currentQuestionIndex = 0;
        appliedRules = []; 
        currentAnswers = []; 
        questionResults = []; 
        gameActive = true;
        
        document.getElementById("gameContainer").style.display = "block";
        document.getElementById("currentUserDisplay").innerHTML = `👤 ${name} (${city})`;
        document.getElementById("currentUserDisplay").style.display = "inline-block";
        document.getElementById("registerForm").style.display = "none";
        document.getElementById("resultCard").style.display = "none";
        document.getElementById("nextArea").style.display = "block";
        document.getElementById("saveStatus").innerHTML = '';
        
        const oldBtn = document.querySelector('.restart-btn');
        if (oldBtn) oldBtn.remove();
        
        renderQuestion();
    }

    function resetGame() { startGame(currentUserName, currentUserCity); }

    document.getElementById("startGameBtn").onclick = () => {
        const name = document.getElementById("userName").value.trim();
        const city = document.getElementById("userCity").value;
        if (!name) return alert("Введите имя");
        if (!city) return alert("Выберите город");
        startGame(name, city);
    };
    
    document.getElementById("nextBtn").onclick = nextStep;
    
    document.getElementById("userName").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("startGameBtn").click();
    });
</script>
</body>
</html>
