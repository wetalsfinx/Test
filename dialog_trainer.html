<script>
    // 🔥 Firestore (новый канал, без блокировок)
    const firebaseConfig = {
        apiKey: "AIzaSyACk392rDmGmYxaC1uqQqMsRvjOaYKgpTc",
        authDomain: "gold-8105a.firebaseapp.com",
        projectId: "gold-8105a",
        storageBucket: "gold-8105a.firebasestorage.app",
        messagingSenderId: "195469188947",
        appId: "1:195469188947:web:af9671f88b0e70eceecba6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔥 АВТОДОЗАГРУЗКА ИЗ ЛОКАЛЬНОГО ХРАНИЛИЩА (в Firestore)
    window.addEventListener('load', async () => {
        const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
        if (backup.length > 0) {
            console.log(`🔄 Найдено ${backup.length} несохранённых результатов. Отправляем в Firestore...`);
            for (let result of backup) {
                try {
                    await Promise.race([
                        db.collection('results').doc('dialog').collection('items').add(result),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000))
                    ]);
                    console.log('✅ Отправлено:', result.user_name);
                } catch(e) {
                    console.error('❌ Ошибка дозагрузки:', e.message);
                }
            }
            localStorage.removeItem('dialog_backup');
        }
    });

    // ⚠️ Названия правил ТОЧНО совпадают с дашбордом (TRAINER_RULES)
    const ALL_RULES = [
        { id: "initiative", name: "Проявляй инициативу", icon: "🏃", label: "Инициатива", rec: "Не ждите, пока клиент сам позовёт. Через 20-30 секунд подойдите и спросите: «Какое изделие выбираете? Для себя или в подарок?»" },
        { id: "askBeforeShow", name: "Задавай вопросы ДО показа", icon: "❓", label: "Вопросы до показа", rec: "Сначала спросите «для какого случая?», «кто получатель?», «какие предпочтения?». Только потом показывайте украшения." },
        { id: "emotionalHPW", name: "Презентуй с эмоцией", icon: "✨", label: "Эмоциональная презентация", rec: "Свойство → чем полезно → что это даёт именно этому клиенту: «Узор сделан вручную — это настоящий винтаж, который вы любите, он не выйдет из моды»." },
        { id: "fittingOffer", name: "Предлагай примерку", icon: "💍", label: "Примерка", rec: "Всегда предлагайте примерку фразой «Давайте примерим». Украшение на себе продаёт лучше любых слов: клиент видит себя с ним — и решение приходит само." },
        { id: "valueUp", name: "Показывай вариант лучше", icon: "💎", label: "Вариант лучше", rec: "Когда клиент выбрал — покажите рядом похожий вариант примерно на 20% дороже и объясните разницу: «Тот же стиль, но с бриллиантом — на свету играет иначе. Сравните». Не самый дорогой в магазине и не «есть подороже, но вам не надо»." },
        { id: "alternative", name: "Не отпускай без альтернативы", icon: "🔄", label: "Альтернатива", rec: "Если нет размера или модели — сразу покажите похожие варианты и каталог заказов." },
        { id: "finance", name: "Называй Сплит до цены", icon: "💳", label: "Сплит до цены", rec: "Сначала платёж, потом полная цена: «Для такого выбора есть Сплит — 4 платежа по 7 000 ₽ без переплат, оформим за 2 минуты. Полная стоимость — 28 000». Не голую цену и не «если дорого — есть рассрочка»." },
        { id: "objection", name: "Отрабатывай «дорого»", icon: "🛡️", label: "Возражение «дорого»", rec: "Не спорьте и не давайте скидку. Согласитесь с чувством и уточните, с чем сравнивает клиент: «Понимаю. Смущает сама сумма сразу или хочется сравнить с другим вариантом?» Затем — Сплит или аргумент по весу и качеству." },

    const STORIES = [{"id": "couple", "title": "Годовщина", "who": "Пара, около 40 лет", "avatar": "👫", "sale": "Кольцо с бриллиантом из винтажной коллекции", "steps": [{"rule": "initiative", "ev": [["n", "Пара лет сорока зашла в магазин. Мужчина уже полминуты молча рассматривает витрину с кольцами, жена стоит рядом."]], "opts": [["«Добрый день! Сегодня скидка 30% на бриллианты. Какое изделие выбираете — для себя или в подарок?»", 1, 15, "Добрый день! В подарок — у нас годовщина. Скидка очень кстати."], ["«Добрый день! Подсказать вам что-нибудь по кольцам? Здесь вся наша новая коллекция»", 0, -10, "Нет, спасибо, мы пока сами посмотрим… Хотя ладно — у нас годовщина, ищем подарок."], ["«Добрый день! Сегодня скидка 30% на бриллианты. Смотрите спокойно, я рядом — если что, сразу зовите»", 0, -10, "Угу, спасибо. …Девушка! Подойдите всё-таки, у нас годовщина, нужен подарок."], ["«Добрый день! Вам кольцо для себя? У нас как раз сейчас хорошие скидки на очень многое»", 0, -10, "Для себя? Нет, у нас годовщина. А на что именно скидки?"]]}, {"rule": "askBeforeShow", "ev": [["c", "Хочу подарить жене кольцо. Бюджет — до 40 000."]], "opts": [["«Отлично! Вот эта коллекция как раз в вашем бюджете — давайте покажу самые красивые»", 0, -15, "(жена) Хм… они все какие-то одинаковые. Я вообще-то люблю винтаж."], ["«Поздравляю вас! Расскажите, что вам по душе — классика или что-то необычное? Что носите каждый день?»", 1, 15, "(жена) Спасибо! 10 лет вместе. Я люблю винтаж — такие кольца, со старинным узором."], ["«Хороший бюджет! Покажу вам три самых популярных кольца — на них точно не ошибётесь, их у нас берут чаще всего»", 0, -10, "(жена) Популярные — это как у всех? Я люблю винтаж, если что."], ["«А какой размер у вашей супруги? Тогда я сразу подберу из того, что есть в наличии»", 0, -10, "(жена) Семнадцатый… Только мне не любое нужно — я люблю винтаж."]]}, {"rule": "emotionalHPW", "ev": [["n", "Вы показываете кольцо из винтажной коллекции с ажурным узором."], ["c", "(муж) Ну… красивое. А чем оно лучше других?"]], "opts": [["«Огранка ручной работы, золото 585 пробы, вес 3,2 грамма — очень качественное изделие: таких в сети всего несколько, и каждое обязательно проходит проверку в пробирной палате»", 0, -10, "Ну, качественное — это хорошо… Я в этом не разбираюсь, если честно."], ["«Это хит сезона — винтажные модели сейчас покупают чаще всего, супруге точно понравится»", 0, -10, "(жена) Хит сезона? Я как раз не люблю то, что у всех."], ["«Посмотрите, какая огранка! И цена очень хорошая за такое качество, поверьте»", 0, -15, "Цена — да… Я пока не очень понимаю, за что именно платим."], ["«Узор здесь сделан вручную, как в старинных украшениях, — это настоящий винтаж, который вы любите. Такое кольцо не выйдет из моды и будет радовать вас долгие годы»", 1, 15, "(жена улыбается) Да… Это прямо про нас."]]}, {"rule": "fittingOffer", "ev": [["c", "(жена) Красивое… А можно посмотреть поближе?"]], "opts": [["«Конечно! Хотите его примерить? Зеркало у нас вон там, у окна — там самый лучший дневной свет для украшений»", 0, -10, "Да нет, наверное, я и так вижу…"], ["«Давайте примерим — и сразу в зеркало, так увидите, как оно смотрится именно на вас»", 1, 15, "(примеряет) Ой… Саша, смотри!"], ["«Конечно, вот, возьмите в руки — посмотрите поближе, оно лёгкое и очень удобное»", 0, -10, "(вертит в руках) Ну да, лёгкое…"], ["«Можно и примерить, если хотите, — я помогу подобрать размер»", 0, -10, "Можно… если только быстро."]]}, {"rule": "valueUp", "ev": [["n", "Кольцо сидит хорошо. Рядом на витрине — похожая винтажная модель с бриллиантом, примерно на 20% дороже."], ["c", "(муж) Ну что, это и берём?"]], "opts": [["«Да, берите — отличный выбор, лучше этого вы у нас точно не найдёте, проверено»", 0, -10, "Ну… ладно. Хотя жена что-то задумалась."], ["«Покажу ещё одно рядом — тот же винтаж, но с бриллиантом: примерно на 20% дороже и на свету играет иначе. Давайте сравним»", 1, 15, "(жена примеряет второе) Ой… Саша, вот это — оно."], ["«Есть ещё кольцо подороже — хотите посмотреть или уже это оформляем?»", 0, -10, "Подороже? Нет, давайте это."], ["«Для сравнения покажу самое эффектное — с крупным бриллиантом, за 90 000, оно у нас одно такое в сети, посмотрите, как оно смотрится на руке»", 0, -15, "90? Мы же сказали — до 40."]], "alt": [{"rule": "fittingOffer", "ev": [["n", "Жена держит кольцо в руках. Рядом на витрине — похожая винтажная модель с бриллиантом, примерно на 20% дороже."], ["c", "(муж) Ну что, это и берём?"]]}]}, {"rule": "alternative", "ev": [["n", "Кольцо, которое больше всего понравилось жене, оказалось велико, а 17-го размера этой модели в наличии нет."], ["c", "(жена) Ну вот… Велико. А меньше нет?"]], "opts": [["«Как жаль! Это был последний размер — но заходите, вдруг ещё привезут»", 0, -20, "Жаль… Ну что ж."], ["«Его можно уменьшить в ювелирной мастерской — это недолго и недорого, а модель останется именно та, что понравилась»", 0, -10, "В мастерской? Не знаю… Не хочется возиться."], ["«Давайте покажу похожие кольца в вашем размере, а это — закажем по каталогу точно под вас»", 1, 15, "О, вот это тоже очень красивое! Саша, давай его?"], ["«Давайте примерим на средний палец — велико на этот, зато там будет как раз»", 0, -15, "На средний? Нет, я хочу носить его как обручальное…"]]}, {"rule": "finance", "ev": [["n", "Кольцо в её размере стоит 46 000 — чуть выше бюджета."], ["c", "(муж) А по цене сколько выходит?"]], "opts": [["«46 000 рублей»", 0, -10, "Сколько?! Мы же говорили — до 40…"], ["«Для такого выбора есть Сплит — 4 платежа по 11 500 ₽ без переплат, оформим за 2 минуты. Полная стоимость — 46 000»", 1, 15, "4 платежа… Хм, так даже удобнее."], ["«46 000 — немного выше вашего бюджета, к сожалению, но кольцо того стоит, поверьте мне, я бы сама такое взяла себе, честно»", 0, -10, "Выше бюджета… Ну, не знаю."], ["«46 000. Но если для вас дорого — у нас есть рассрочка, можно оформить, если захотите»", 0, -10, "Дорого — не дорого… Сами решим."]], "alt": [{"rule": "alternative", "ev": [["n", "Жена сама нашла на витрине другое винтажное кольцо в своём размере — 46 000, чуть выше бюджета."], ["c", "(муж) А по цене сколько выходит?"]]}]}, {"rule": "objection", "ev": [["c", "(муж) Платежами удобно, да… Но всё равно 46 — я рассчитывал до 40."]], "opts": [["«Да это же не дорого — это бриллиант и ручная работа, такие кольца стоят и по сто тысяч!»", 0, -15, "Вот только не надо меня учить, что дорого, а что нет."], ["«Давайте я сделаю вам скидку 5% — так будет ближе к вашему бюджету, и все довольны: и кольцо ваше, и в бюджет почти уложились»", 0, -10, "Скидка… значит, цена изначально завышена?"], ["«Понимаю, вы планировали до 40. Разница — 6 000, а кольцо — именно то, о котором она мечтала. И в Сплит это 4 платежа по 11 500 ₽ без переплат»", 1, 15, "(жена) Саша, ну правда… (муж) Ладно. Если платежами — нормально."], ["«Тогда давайте вернёмся к кольцам до 40 000 — там тоже есть неплохие варианты, посмотрим ещё раз спокойно и подберём что-то не хуже этого по красоте»", 0, -10, "(жена) Но мне это понравилось…"]], "alt": [{"rule": "finance", "ev": [["c", "(муж) Да, 46 — для нас дороговато."]]}]}, {"rule": "closeDeal", "ev": [["n", "Жена примеряет выбранное кольцо и не может отвести взгляд от зеркала."], ["c", "(жена) Саша…"]], "opts": [["«Ну что, берёте?»", 0, -10, "(муж) Сейчас, подумаем минутку…"], ["«Подумайте спокойно, не торопитесь — я никуда не ухожу, можете посоветоваться»", 0, -10, "Да… давай подумаем, Саш."], ["«Оно вам очень идёт — прекрасный подарок на годовщину. Давайте оформим!»", 1, 15, "(муж) Оформляем!"], ["«Может, посмотрите ещё что-нибудь для сравнения? У нас в соседней витрине есть похожие модели, и выбор там большой»", 0, -10, "Ещё смотреть? Ой, мы запутаемся."]]}, {"rule": "crossSell", "ev": [["c", "(муж) Всё, решено — берём."]], "opts": [["«Отличный выбор, поздравляю! Что-нибудь ещё посмотрите или уже оформляем? Вам удобнее картой или наличными?»", 0, -5, "Оформляем, картой."], ["«Давайте подберём к кольцу серьги из этой же коллекции — получится законченный образ к ваше о посмотреть."], ["n", "Прошло 2–3 минуты. Она задержалась у витрины с серьгами."]], "opts": [["Жду дальше — она сама сказала, что смотрит; второй подход будет навязчивым", 0, -15, "(уже у двери оборачивается) А… вон те серьги сколько стоят?"], ["«Можно показать вам эти серьги поближе? Если хотите, конечно»", 0, -10, "Можно… наверное."], ["«Вы уже определились с выбором? Могу подсказать цену на любую пару и рассказать про все наши акции»", 0, -10, "Нет, ещё не определилась. Ну… вон те сколько?"], ["«Вижу, вам приглянулись серьги — давайте покажу их ближе, на свету они играют иначе»", 1, 15, "Ой, давайте! Вот эти, с камушками."]]}, {"rule": "askBeforeShow", "ev": [["c", "А какие у вас ещё есть серьги? Покажите что-нибудь."]], "opts": [["«На какую сумму рассчитываете? Подберу лучшее в этих пределах»", 0, -15, "Ну… не знаю. Я же просто посмотреть пришла."], ["«Для какого случая выбираете — на каждый день или к празднику? Какой стиль вам ближе?»", 1, 15, "На каждый день, на работу. Что-то аккуратное, но чтобы блестело."], ["«Давайте покажу вам всё, что есть: пусеты, конго, длинные — а вы выберете сами, что нравится»", 0, -10, "Ой, сколько всего… Я теряюсь."], ["«Сейчас хит — пусеты с фианитами, их все берут; покажу самые популярные»", 0, -10, "Как у всех? Ну… не знаю."]]}, {"rule": "emotionalHPW", "ev": [["n", "Вы показываете аккуратные пусеты с бриллиантами."], ["c", "Миленькие. А они не слишком простые?"]], "opts": [["«Бриллиант 0,1 карата, золото 585 пробы, надёжный английский замок»", 0, -10, "Ну… это всё хорошо, но всё-таки простые."], ["«Нет, что вы, это классика — такие сейчас все носят, вы не ошибётесь»", 0, -10, "Все носят — это как раз то, чего я не хочу."], ["«Это бриллианты: 57 граней ловят свет, и каждый раз, когда вы повернёте голову, они вспыхнут — аккуратно, но заметно. Как вы и хотели»", 1, 15, "(подходит к зеркалу) Ой… и правда вспыхивают!"], ["«Если кажутся простыми — давайте посмотрим что-то подороже: там камни заметно крупнее, огранка сложнее, и смо начит, цена завышена была?"], ["«Тогда возьмите без бриллианта — разницы почти не видно»", 0, -10, "Не видно? Зачем тогда показывали…"]], "alt": [{"rule": "finance", "ev": [["c", "Да, 18 — всё-таки дороговато для меня."]]}]}, {"rule": "closeDeal", "ev": [["n", "Мама держит кулон на ладони и улыбается."], ["c", "Ей бы понравилось…"]], "opts": [["«Ну что, берёте?»", 0, -10, "Сейчас… дайте подумать."], ["«Можете посоветоваться с дочкой и прийти позже — я его отложу для вас до завтрашнего вечера, никто не заберёт»", 0, -10, "Ой, и правда, спрошу у неё. Отложите."], ["«Уверена, понравится — это подарок, который она будет носить годами. Давайте оформим!»", 1, 15, "Давайте! Оформляем."], ["«Посмотрите ещё варианты для сравнения?»", 0, -10, "Нет, я запутаюсь."]]}, {"rule": "crossSell", "ev": [["c", "Всё, решено — этот кулон с цепочкой и берём."]], "opts": [["«Отличный выбор! Может, ещё что-нибудь посмотрите для дочки?»", 0, -10, "Нет, думаю, этого хватит."], ["«Серьги к кулону не нужны будут? Есть похожие»", 0, -10, "Да нет, наверное…"], ["«Давайте подберём к кулону маленькие пусеты в том же стиле — получится готовый комплект к её восемнадцатилетию»", 1, 15, "Ой, комплект — это же отличная идея! Покажите."], ["«Есть ещё серьги в этом же стиле, но они немного дороже вашего бюджета — показать на всякий случай, просто посмотреть?»", 0, -10, "Если дороже — то не надо."]], "alt": [{"rule": "closeDeal", "ev": [["n", "Мама немного подумала и ещё раз посмотрела на кулон."], ["c", "Ладно, решено — этот кулон с цепочкой и берём."]]}]}, {"rule": "careOffer", "ev": [["c", "Всё, оформляем!"]], "opts": [["«Подарочный пакет вам нужен? Он бесплатный»", 0, -5, "Да, давайте."], ["«Футляр будете брать? Он оплачивается отдельно, но многие его берут — и для подарка удобно, и для хранения дома тоже»", 0, -10, "Ну… нет, пакета хватит."], ["«Давайте подберём красивый футляр — подарок сразу будет готов к вручению, и средство для блеска, чтобы всё сияло»", 1, 15, "Ой, точно! Сразу готовый подарок — native", "ev": [["n", "Мужчина всё-таки вернулся к цепи, которую держал в руках."], ["c", "Ну и сколько эта?"]]}]}, {"rule": "objection", "ev": [["c", "Но в интернете такая же на пять тысяч дешевле."]], "opts": [["«В интернете часто продают подделки — у нас гарантия и клеймо, поэтому и цена другая»", 0, -10, "Опять про подделки…"], ["«Понимаю, хочется не переплатить. А там такая же по весу и плетению? Давайте сравним — у этой 14 граммов»", 1, 15, "Там 11 граммов… Ладно, тогда это другое дело."], ["«Хорошо, давайте я сделаю вам скидку пять тысяч — будет как в интернете, и не надо ждать доставку несколько дней»", 0, -10, "Значит, можно было и дешевле? Интересно."], ["«Ну, тогда покупайте в интернете — это ваше право»", 0, -20, "Так и сделаю."]]}, {"rule": "closeDeal", "ev": [["n", "Мужчина надел цепь и смотрит в зеркало, как она лежит под воротником."]], "opts": [["«Ну что, берёте или всё-таки в интернете закажете?»", 0, -10, "Подумаю ещё."], ["«Подумайте спокойно, сравните ещё раз с интернетом — я никуда не денусь, приходите, когда решите»", 0, -10, "Ладно, сравню."], ["«Показать ещё пару моделей для сравнения?»", 0, -10, "Нет, я уже насмотрелся."], ["«Сидит отлично — и под рубашкой её не видно, как вы и хотели. Давайте оформим!»", 1, 15, "Давайте."]]}, {"rule": "crossSell", "ev": [["c", "Ладно, убедили. Беру."]], "opts": [["«Отличный выбор! Что-нибудь ещё посмотрите или сразу оформляем? Картой или наличными?»", 0, -5, "Картой. Больше ничего."], ["«Браслет к ней не нужен будет? У нас есть похожие»", 0, -10, "Не, не нужен."], ["«Давайте подберём к цепи браслет того же плетения — будут смотреться как комплект, и на руке, и на шее»", 1, 15, "Комплект… А покажите. Мне такое нравится."], ["«Есть ещё браслет в комплект к ней, но он, честно говоря, дороже самой цепи — показать на всякий случай?»", 0, -10, "Если дороже — не надо."]], "alt": [{"rule": "closeDeal", "ev": [["n", "Мужчина ещё раз сравнил цены в телефоне и убрал его в карман."], ["c", "Ладно. Беру."]]}]}, {"rule": "careOffer", "ev": [["c", "Всё, оформляем."]], "opts": [["«Футляр нужен будет? Или так, в пакетик положить?»", 0, -10, "Не, не надо."], ["«Давайте подберём футляр и средство для ухода — цепь, которую носят каждый день, быстрее теряет блеск, а так будет как новая»", 1, 15, "Логично. Давайте."], ["«Средство для чистки будете брать? Оно недорогое, многие мужчины берут»", 0, -10, "Нет, спасибо."], ["«Отлично, поздравляю с покупкой! Оплата картой или наличными? И фирменный пакет вам нужен, или так понесёте в руках? Он у нас бесплатный»", 0, -5, "Картой. Без пакета."]]}, {"rule": "warmClosing", "ev": [["c", "Ну… признаю, у вас удобнее, чем в интернете."]], "opts": [["«Вот видите, а вы сомневались! Я же сразу говорила, что у нас не хуже»", 0, -10, "Ну, не перегибайте."], ["«Спасибо, что выбрали нас! Носите с удовольствием — понадобится подарок или что-то новое, заходите, подберём вместе»", 1, 10, "Зайду. Спасибо, правда помогли."], ["«Спасибо за покупку! Чек и гарантийный талон в пакете, хорошего дня»", 0, -5, "Спасибо."], ["«Приходите ещё — в интернете ведь не примеришь и не посоветуешься, а у нас всегда можно и примерить, и посоветоваться, мы всегда рады видеть»", 0, -5, "Ага. До свидания."]]}]}];

    async function saveToFirebase(resultData) {
        // Сохраняем локально как резервную копию
        try {
            const localBackup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            if (!localBackup.some(r => r.id === resultData.id)) {
                localBackup.push(resultData);
                localStorage.setItem('dialog_backup', JSON.stringify(localBackup));
            }
        } catch(e) { console.error('Не удалось сохранить локально:', e); }
        
        // Отправляем в Firestore (с таймаутом 6 секунд)
        try {
            await Promise.race([
                db.collection('results').doc('dialog').collection('items').add(resultData),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000))
            ]);
            // Успешно — удаляем из резервной копии
            const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            localStorage.setItem('dialog_backup', JSON.stringify(backup.filter(r => r.id !== resultData.id)));
            return true;
        } catch (error) {
            console.error('❌ Ошибка сохранения в Firestore:', error);
            return false;
        }
    }

    const regScreen = document.getElementById('regScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    function getRule(id) { return ALL_RULES.find(r => r.id === id); }
    // ===================== ЖИВОЙ ДИАЛОГ =====================
    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    let story = null, stepIdx = 0, mood = 50, currentAnswers = [], appliedRules = [], left = false, busy = false;
    let currentUser = { name: '', city: '' };
    const chat = () => document.getElementById('chat');
    const moodEmoji = m => m >= 80 ? '😍' : m >= 60 ? '😊' : m >= 40 ? '🙂' : m >= 25 ? '😐' : '😒';
    function setMood(d) {
        mood = Math.max(0, Math.min(100, mood + d));
        document.getElementById('moodFill').style.width = mood + '%';
        document.getElementById('moodFill').className = mood >= 60 ? 'good' : mood >= 35 ? 'mid' : 'bad';
        document.getElementById('moodEmo').textContent = moodEmoji(mood);
        if (d) { const t = document.createElement('span'); t.className = 'mood-pop ' + (d > 0 ? 'up' : 'down'); t.textContent = (d > 0 ? '+' : '') + d; document.querySelector('.mood').appendChild(t); setTimeout(() => t.remove(), 1200); }
    }
    function bubble(kind, text) {
        const el = document.createElement('div');
        el.className = 'msg ' + kind;
        el.innerHTML = kind === 'n' ? `<span>${esc(text)}</span>` : esc(text);
        chat().appendChild(el); el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    async function typing(ms) {
        const el = document.createElement('div'); el.className = 'msg c typing'; el.innerHTML = '<i></i><i></i><i></i>';
        chat().appendChild(el); el.scrollIntoView({ behavior: 'smooth', block: 'end' }); await sleep(ms); el.remove();
    }
    async function playEvents(evs) {
        for (const [k, t] of evs) { if (k === 'c') await typing(700 + Math.min(900, t.length * 12)); else await sleep(350); bubble(k, t); }
    }
    function startChat() {
        story = STORIES[Math.floor(Math.random() * STORIES.length)];
        stepIdx = 0; mood = 50; currentAnswers = []; appliedRules = []; left = false;
        document.getElementById('clAv').textContent = story.avatar;
        document.getElementById('clWho').textContent = story.who;
        chat().innerHTML = ''; setMood(0); nextTurn();
    }
    async function nextTurn() {
        const st = story.steps[stepIdx];
        document.getElementById('clStage').textContent = `Шаг ${stepIdx + 1} из ${story.steps.length} · ${getRule(st.rule).label}`;
        document.getElementById('replies').innerHTML = '';
        const alt = (st.alt || []).find(x => !appliedRules.includes(getRule(x.rule).name));
        st._ev = alt ? alt.ev : st.ev; // реплики клиента подстраиваются под предыдущие ответы
        await playEvents(st._ev);
        const order = shuffle(st.opts.map((_, i) => i));
        const box = document.getElementById('replies');
        box.innerHTML = '<div class="replies-h">💬 Ваш ответ:</div>' + order.map((oi, k) => `<button class="reply" data-k="${k}">${esc(st.opts[oi][0])}</button>`).join('');
        box.querySelectorAll('.reply').forEach(b => b.onclick = () => choose(order, +b.dataset.k));
        box.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    async function choose(order, k) {
        if (busy) return; busy = true;
        const st = story.steps[stepIdx], o = st.opts[order[k]], rule = getRule(st.rule);
        document.getElementById('replies').innerHTML = '';
        bubble('s', o[0]);
        currentAnswers.push({ question: stepIdx, story: story.id, ruleId: st.rule, client: (st._ev || st.ev).filter(e => e[0] === 'c').map(e => e[1]).join(' ') || (st._ev || st.ev).map(e => e[1]).join(' '),
            choices: order.map(i => st.opts[i][0]), selected: k, correctIdx: order.findIndex(i => st.opts[i][1]), correct: !!o[1] });
        if (o[1] && !appliedRules.includes(rule.name)) appliedRules.push(rule.name);
        await typing(800 + Math.min(900, o[3].length * 12));
        bubble('c', o[3]); setMood(o[2]);
        await sleep(700);
        busy = false;
        if (mood <= 10) { left = true; await sleep(300); bubble('n', 'Клиент вежливо попрощался и ушёл. Диалог окончен.'); await sleep(1200); return finishGame(); }
        stepIdx++;
        if (stepIdx >= story.steps.length) { await sleep(400); return finishGame(); }
        nextTurn();
    }

    async function finishGame() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        const n = appliedRules.length, percent = Math.round(n / ALL_RULES.length * 100);
        const outcome = left ? ['🚪', 'Клиент ушёл', 'Настроение клиента упало, и он ушёл без покупки.', 'fail']
            : n === ALL_RULES.length ? ['🛍️', 'Покупка и восторг!', `Клиент купил: ${story.sale} — и обещал вернуться.`, 'success']
            : mood >= 45 ? ['🛍️', 'Покупка состоялась', `Клиент купил: ${story.sale}. Но мог уйти ещё довольнее.`, 'success']
            : ['😐', 'Без покупки', 'Клиент поблагодарил и сказал, что подумает.', 'fail'];
        let html = `<div class="result-card ${outcome[3]}"><div class="result-icon">${outcome[0]}</div><h2>${outcome[1]}</h2><p>${outcome[2]}</p>
            <div class="result-stats"><div class="stat-box"><div class="stat-value">${moodEmoji(mood)} ${mood}</div><div class="stat-label">Настроение клиента</div></div>
            <div class="stat-box"><div class="stat-value">${n}/${ALL_RULES.length}</div><div class="stat-label">Правил применено</div></div></div>`;
        html += `<div class="rec-section"><h3>🔍 Разбор диалога</h3>`;
        story.steps.forEach((st, i) => {
            const a = currentAnswers.find(x => x.question === i), rule = getRule(st.rule), best = st.opts.find(x => x[1])[0];
            html += `<div class="rec-item ${a ? (a.correct ? 'ok' : 'no') : 'skip'}"><div class="rec-item-header"><div class="rec-item-icon">${rule.icon}</div><div class="rec-q">${a ? (a.correct ? '✅' : '❌') : '⏹️'} ${rule.name}</div></div>`
                + (a ? `<div class="rec-you">Вы: ${esc(a.choices[a.selected])}</div>` : `<div class="rec-you">До этого шага диалог не дошёл</div>`)
                + (a && a.correct ? '' : `<div class="rec-tip"><strong>💡 Лучше так:</strong> ${esc(best)}<br><span>${esc(rule.rec)}</span></div>`) + `</div>`;
        });
        html += `</div><div class="save-status" id="saveStatus"><span class="spinner"></span>Сохраняю результат...</div>
            <button class="restart-btn" onclick="location.reload()">🔄 Другой клиент</button></div>`;
        resultScreen.innerHTML = html;

        const resultData = {
            id: Date.now(), type: 'trainer', format: 'chat', story: story.id, mood, left,
            user_name: currentUser.name, city: currentUser.city,
            score: n, total: ALL_RULES.length, percent, passed: n === ALL_RULES.length,
            rules_applied: appliedRules, rules_count: n,
            answers: currentAnswers, date: new Date().toISOString(), timestamp: new Date().toLocaleString('ru-RU')
        };
        const saved = await saveToFirebase(resultData);
        const statusDiv = document.getElementById('saveStatus');
        if (statusDiv) {
            if (saved) { statusDiv.innerHTML = '✅ Результат сохранён в облаке!'; statusDiv.style.color = '#10b981'; statusDiv.style.background = 'rgba(16,185,129,0.1)'; }
            else { statusDiv.innerHTML = '⚠️ Сохранено локально, отправится при следующем запуске.'; statusDiv.style.color = '#d97706'; statusDiv.style.background = 'rgba(217,119,6,0.1)'; }
        }
    }

    document.getElementById('startGameBtn').onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите город'); return; }

        currentUser = { name, city };
        regScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        startChat();
    };
    document.getElementById('userName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('startGameBtn').click();
    });
</script>
