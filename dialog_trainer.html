        { ruleId: "warmClosing", correct: 2, client: "Клиент выбрал похожую модель, оформил заказ. Прощается. Что говорите?", choices: ["«Спасибо за покупку! Хорошего дня»", "«Будем рады видеть вас снова. У нас обновления коллекции каждую неделю»", "«Спасибо, что зашли к нам! Если будете выбирать подарки — заходите, вместе найдём что-то особенное»"] }
    ];

    async function saveToFirebase(resultData) {
        try {
            const localBackup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            if (!localBackup.some(r => r.id === resultData.id)) {
                localBackup.push(resultData);
                localStorage.setItem('dialog_backup', JSON.stringify(localBackup));
            }
        } catch(e) { console.error('Не удалось сохранить локально:', e); }
        try {
            const newRef = db.ref('results/dialog').push();
            await newRef.set(resultData);
            const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            localStorage.setItem('dialog_backup', JSON.stringify(backup.filter(r => r.id !== resultData.id)));
            return true;
        } catch (error) {
            console.error('❌ Ошибка сохранения в Firebase:', error);
            return false;
        }
    }

    let currentIndex = 0, currentAnswers = [], appliedRules = [], questionResults = [];
    let currentUser = { name: '', city: '' };
    let selectedChoice = null;

    const regScreen = document.getElementById('regScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const nextBtn = document.getElementById('nextBtn');

    function getRule(id) { return ALL_RULES.find(r => r.id === id); }

    function updateProgress() {
        const progress = (currentIndex / QUESTIONS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
    }

    function renderApplied() {
        const list = document.getElementById('appliedRulesList');
        if (appliedRules.length) {
            list.innerHTML = appliedRules.map(n => {
                const r = ALL_RULES.find(x => x.name === n);
                return `<span class="applied-rule">${r ? r.icon : '✅'} ${n}</span>`;
            }).join('');
        } else {
            list.innerHTML = '<span class="applied-empty">(пока ни одного)</span>';
        }
    }

    function renderQuestion() {
        const q = QUESTIONS[currentIndex];
        const rule = getRule(q.ruleId);
        
        document.getElementById('questionContainer').innerHTML = `
            <div class="question-wrapper">
                <div class="question-icon">${rule.icon}</div>
                <div class="question-content">
                    <div class="question-label">${rule.label}</div>
                    <div class="question-text">${q.client}</div>
                </div>
            </div>
        `;
        
        document.getElementById('qNum').innerText = currentIndex + 1;
        document.getElementById('qTotal').innerText = QUESTIONS.length;
        updateProgress();
        renderApplied();

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        selectedChoice = null;
        nextBtn.disabled = true;

        q.choices.forEach((opt, idx) => {
            const optionDiv = document.createElement('div');
            optionDiv.className = 'option';
            const letter = String.fromCharCode(65 + idx);
            optionDiv.innerHTML = `<span class="option-letter">${letter}</span><span class="option-text">${opt}</span>`;
            optionDiv.addEventListener('click', () => {
                document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                optionDiv.classList.add('selected');
                selectedChoice = idx;
                nextBtn.disabled = false;
            });
            optionsContainer.appendChild(optionDiv);
        });
    }

    function nextStep() {
        if (selectedChoice === null) return;
        const q = QUESTIONS[currentIndex];
        const isCorrect = selectedChoice === q.correct;
        const rule = getRule(q.ruleId);

        currentAnswers.push({ question: currentIndex, selected: selectedChoice, correct: isCorrect, ruleId: q.ruleId });
        questionResults[currentIndex] = isCorrect;

        if (isCorrect && !appliedRules.includes(rule.name)) appliedRules.push(rule.name);

        currentIndex++;
        if (currentIndex >= QUESTIONS.length) {
            finishGame();
        } else {
            renderQuestion();
        }
    }

    async function finishGame() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        const success = appliedRules.length === ALL_RULES.length;
        const percent = Math.round((appliedRules.length / ALL_RULES.length) * 100);

        let html = `
            <div class="result-card ${success ? 'success' : 'fail'}">
                <div class="result-icon">${success ? '🏆' : '📚'}</div>
                <h2>${success ? 'ПОБЕДА!' : 'Диалог не пройден'}</h2>
                <p>${success ? 'Вы применили все 6 правил — клиент в восторге!' : 'Применено правил: ' + appliedRules.length + ' из 6. Разберём ошибки?'}</p>
                <div class="result-stats">
                    <div class="stat-box"><div class="stat-value">${percent}%</div><div class="stat-label">Результат</div></div>
                    <div class="stat-box"><div class="stat-value">${appliedRules.length}/6</div><div class="stat-label">Правил применено</div></div>
                </div>
        `;

        if (success) {
            html += `<div class="rec-perfect">🎉 ИДЕАЛЬНО! Все 6 правил в диалоге!</div>`;
        } else {
            const missing = ALL_RULES.filter(r => !appliedRules.includes(r.name));
            html += `<div class="rec-section"><h3>📚 Какие правила не применены</h3>`;
            missing.forEach(rule => {
                html += `
                    <div class="rec-item">
                        <div class="rec-item-header">
                            <div class="rec-item-icon">${rule.icon}</div>
                            <div class="rec-q">❌ ${rule.name}</div>
                        </div>
                        <div class="rec-tip"><strong>💡 Как надо:</strong> ${rule.rec}</div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        html += `
                <div class="save-status" id="saveStatus"><span class="spinner"></span>Сохраняю результат...</div>
                <button class="restart-btn" onclick="location.reload()">🔄 Пройти заново</button>
            </div>
        `;
        resultScreen.innerHTML = html;

        const resultData = {
            id: Date.now(), type: 'trainer', user_name: currentUser.name, city: currentUser.city,
            score: appliedRules.length, total: ALL_RULES.length, percent: percent, passed: success,
            rules_applied: appliedRules, rules_count: appliedRules.length,
            answers: currentAnswers, date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };

        const saved = await saveToFirebase(resultData);
        const statusDiv = document.getElementById('saveStatus');
        if (statusDiv) {
            if (saved) {
                statusDiv.innerHTML = '✅ Результат сохранён в облаке!';
                statusDiv.style.color = '#10b981';
                statusDiv.style.background = 'rgba(16,185,129,0.1)';
            } else {
                statusDiv.innerHTML = '⚠️ Сохранено локально, отправится при следующем запуске.';
                statusDiv.style.color = '#d97706';
                statusDiv.style.background = 'rgba(217,119,6,0.1)';
            }
        }
    }

    document.getElementById('startGameBtn').onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите город'); return; }

        currentUser = { name, city };
        currentIndex = 0;
        currentAnswers = [];
        appliedRules = [];
        questionResults = [];
        selectedChoice = null;

        regScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        renderQuestion();
    };
    nextBtn.onclick = nextStep;
    document.getElementById('userName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('startGameBtn').click();
    });
</script>
</body>
</html>
