<script>
    // 🔥 Firestore (новый канал, без блокировок)
    const firebaseConfig = {
        apiKey: "AIzaSyACk392rDmGmYxaC1uqQqMsRvjOaYKgpTc",
        authDomain: "gold-8105a.firebaseapp.com",
        projectId: "gold-8105a",
        storageBucket: "gold-8105a.firebasestorage.app",
        messagingSenderId: "195469188947",
        appId: "1:195469188947:web:af9671f88b0e70eceecba6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔥 АВТОДОЗАГРУЗКА ИЗ ЛОКАЛЬНОГО ХРАНИЛИЩА (в Firestore)
    window.addEventListener('load', async () => {
        const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
        if (backup.length > 0) {
            console.log(`🔄 Найдено ${backup.length} несохранённых результатов. Отправляем в Firestore...`);
            for (let result of backup) {
                try {
                    await Promise.race([
                        db.collection('results').doc('dialog').collection('items').add(result),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000))
                    ]);
                    console.log('✅ Отправлено:', result.user_name);
                } catch(e) {
                    console.error('❌ Ошибка дозагрузки:', e.message);
                }
            }
            localStorage.removeItem('dialog_backup');
        }
    });

    // ⚠️ Названия правил ТОЧНО совпадают с дашбордом (TRAINER_RULES)
    const ALL_RULES = [

    async function saveToFirebase(resultData) {
        // Сохраняем локально как резервную копию
        try {
            const localBackup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            if (!localBackup.some(r => r.id === resultData.id)) {
                localBackup.push(resultData);
                localStorage.setItem('dialog_backup', JSON.stringify(localBackup));
            }
        } catch(e) { console.error('Не удалось сохранить локально:', e); }
        
        // Отправляем в Firestore (с таймаутом 6 секунд)
        try {
            await Promise.race([
                db.collection('results').doc('dialog').collection('items').add(resultData),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000))
            ]);
            // Успешно — удаляем из резервной копии
            const backup = JSON.parse(localStorage.getItem('dialog_backup') || '[]');
            localStorage.setItem('dialog_backup', JSON.stringify(backup.filter(r => r.id !== resultData.id)));
            return true;
        } catch (error) {
            console.error('❌ Ошибка сохранения в Firestore:', error);
            return false;
        }
    }

        mood = Math.max(0, Math.min(100, mood + d));
        document.getElementById('moodFill').style.width = mood + '%';
        document.getElementById('moodFill').className = mood >= 60 ? 'good' : mood >= 35 ? 'mid' : 'bad';
        document.getElementById('moodEmo').textContent = moodEmoji(mood);
        if (d) { const t = document.createElement('span'); t.className = 'mood-pop ' + (d > 0 ? 'up' : 'down'); t.textContent = (d > 0 ? '+' : '') + d; document.querySelector('.mood').appendChild(t); setTimeout(() => t.remove(), 1200); }
    }
    function bubble(kind, text) {
        const el = document.createElement('div');
        el.className = 'msg ' + kind;
        el.innerHTML = kind === 'n' ? `<span>${esc(text)}</span>` : esc(text);
        chat().appendChild(el); el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    async function typing(ms) {
        const el = document.createElement('div'); el.className = 'msg c typing'; el.innerHTML = '<i></i><i></i><i></i>';
        chat().appendChild(el); el.scrollIntoView({ behavior: 'smooth', block: 'end' }); await sleep(ms); el.remove();
    }
    async function playEvents(evs) {
        for (const [k, t] of evs) { if (k === 'c') await typing(700 + Math.min(900, t.length * 12)); else await sleep(350); bubble(k, t); }
    }
    function startChat() {
        story = STORIES[Math.floor(Math.random() * STORIES.length)];
        stepIdx = 0; mood = 50; currentAnswers = []; appliedRules = []; left = false;
        document.getElementById('clAv').textContent = story.avatar;
        document.getElementById('clWho').textContent = story.who;
        chat().innerHTML = ''; setMood(0); nextTurn();
    }
    async function nextTurn() {
        const st = story.steps[stepIdx];
        document.getElementById('clStage').textContent = `Шаг ${stepIdx + 1} из ${story.steps.length} · ${getRule(st.rule).label}`;
        document.getElementById('replies').innerHTML = '';
        await playEvents(st.ev);
        const order = shuffle(st.opts.map((_, i) => i));
        const box = document.getElementById('replies');
        box.innerHTML = '<div class="replies-h">💬 Ваш ответ:</div>' + order.map((oi, k) => `<button class="reply" data-k="${k}">${esc(st.opts[oi][0])}</button>`).join('');
        box.querySelectorAll('.reply').forEach(b => b.onclick = () => choose(order, +b.dataset.k));
        box.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    async function choose(order, k) {
        if (busy) return; busy = true;
        const st = story.steps[stepIdx], o = st.opts[order[k]], rule = getRule(st.rule);
        document.getElementById('replies').innerHTML = '';
        bubble('s', o[0]);
        currentAnswers.push({ question: stepIdx, story: story.id, ruleId: st.rule, client: st.ev.filter(e => e[0] === 'c').map(e => e[1]).join(' ') || st.ev.map(e => e[1]).join(' '),
            choices: order.map(i => st.opts[i][0]), selected: k, correctIdx: order.findIndex(i => st.opts[i][1]), correct: !!o[1] });
        if (o[1] && !appliedRules.includes(rule.name)) appliedRules.push(rule.name);
        await typing(800 + Math.min(900, o[3].length * 12));
        bubble('c', o[3]); setMood(o[2]);
        await sleep(700);
        busy = false;
        if (mood <= 10) { left = true; await sleep(300); bubble('n', 'Клиент вежливо попрощался и ушёл. Диалог окончен.'); await sleep(1200); return finishGame(); }
        stepIdx++;
        if (stepIdx >= story.steps.length) { await sleep(400); return finishGame(); }
        nextTurn();
    }

    async function finishGame() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        const n = appliedRules.length, percent = Math.round(n / ALL_RULES.length * 100);
        const outcome = left ? ['🚪', 'Клиент ушёл', 'Настроение клиента упало, и он ушёл без покупки.', 'fail']
            : mood >= 80 ? ['🛍️', 'Покупка и восторг!', `Клиент купил: ${story.sale} — и обещал вернуться.`, 'success']
            : mood >= 50 ? ['🛍️', 'Покупка состоялась', `Клиент купил: ${story.sale}. Но мог уйти ещё довольнее.`, 'success']
            : ['😐', 'Без покупки', 'Клиент поблагодарил и сказал, что подумает.', 'fail'];
        let html = `<div class="result-card ${outcome[3]}"><div class="result-icon">${outcome[0]}</div><h2>${outcome[1]}</h2><p>${outcome[2]}</p>
            <div class="result-stats"><div class="stat-box"><div class="stat-value">${moodEmoji(mood)} ${mood}</div><div class="stat-label">Настроение клиента</div></div>
            <div class="stat-box"><div class="stat-value">${n}/6</div><div class="stat-label">Правил применено</div></div></div>`;
        html += `<div class="rec-section"><h3>🔍 Разбор диалога</h3>`;
        story.steps.forEach((st, i) => {
            const a = currentAnswers.find(x => x.question === i), rule = getRule(st.rule), best = st.opts.find(x => x[1])[0];
            html += `<div class="rec-item ${a ? (a.correct ? 'ok' : 'no') : 'skip'}"><div class="rec-item-header"><div class="rec-item-icon">${rule.icon}</div><div class="rec-q">${a ? (a.correct ? '✅' : '❌') : '⏹️'} ${rule.name}</div></div>`
                + (a ? `<div class="rec-you">Вы: ${esc(a.choices[a.selected])}</div>` : `<div class="rec-you">До этого шага диалог не дошёл</div>`)
                + (a && a.correct ? '' : `<div class="rec-tip"><strong>💡 Лучше так:</strong> ${esc(best)}<br><span>${esc(rule.rec)}</span></div>`) + `</div>`;
        });
        html += `</div><div class="save-status" id="saveStatus"><span class="spinner"></span>Сохраняю результат...</div>
            <button class="restart-btn" onclick="location.reload()">🔄 Другой клиент</button></div>`;
        resultScreen.innerHTML = html;

        const resultData = {
            id: Date.now(), type: 'trainer', format: 'chat', story: story.id, mood, left,
            user_name: currentUser.name, city: currentUser.city,
            score: n, total: ALL_RULES.length, percent, passed: n === ALL_RULES.length,
            rules_applied: appliedRules, rules_count: n,
            answers: currentAnswers, date: new Date().toISOString(), timestamp: new Date().toLocaleString('ru-RU')
        };
        const saved = await saveToFirebase(resultData);
        const statusDiv = document.getElementById('saveStatus');
        if (statusDiv) {
            if (saved) { statusDiv.innerHTML = '✅ Результат сохранён в облаке!'; statusDiv.style.color = '#10b981'; statusDiv.style.background = 'rgba(16,185,129,0.1)'; }
            else { statusDiv.innerHTML = '⚠️ Сохранено локально, отправится при следующем запуске.'; statusDiv.style.color = '#d97706'; statusDiv.style.background = 'rgba(217,119,6,0.1)'; }
        }
    }

    document.getElementById('startGameBtn').onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите город'); return; }

        currentUser = { name, city };
        regScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        startChat();
    };
    document.getElementById('userName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('startGameBtn').click();
    });
</script>
</body>
</html>
