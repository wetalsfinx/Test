<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>585GOLD | Тренировка продаж</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #fff0f0;
            margin: 0;
            padding: 12px;
            min-height: 100vh;
        }
        .main-container { max-width: 700px; margin: 0 auto; }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .employee-view { padding: 20px; }
            .choice-btn { font-size: 14px; padding: 12px 14px; }
            .next-btn { font-size: 16px; padding: 12px 20px; }
        }
        :root {
            --primary-red: #c41e3a;
            --primary-rose: #e8a0b4;
            --primary-white: #ffffff;
            --light-rose: #fff0f3;
            --dark-red: #8b1a2c;
            --green-success: #2c6e2c;
        }
        .employee-view {
            background: var(--primary-white);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid var(--primary-rose);
        }
        .employee-view h1 {
            color: var(--primary-red);
            margin-top: 0;
            font-size: 26px;
            text-align: center;
        }
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .register-form input, .register-form select {
            padding: 14px 16px;
            border-radius: 30px;
            border: 1px solid var(--primary-rose);
            font-size: 16px;
            width: 100%;
            background: var(--primary-white);
        }
        .register-form button {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .register-form button:hover { background: var(--dark-red); }
        .game-container {
            background: var(--primary-white);
            border-radius: 28px;
            overflow: hidden;
            margin-top: 16px;
            border: 1px solid var(--primary-rose);
        }
        .chat-area { padding: 18px; background: var(--light-rose); border-bottom: 1px solid var(--primary-rose); }
        .client-message {
            background: var(--primary-white);
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            color: #333;
            border-left: 4px solid var(--primary-red);
        }
        .choices-area { padding: 16px 18px 18px 18px; background: var(--primary-white); }
        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: var(--light-rose);
            border: 1px solid var(--primary-rose);
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
        }
        .choice-btn:hover { background: #f5e0e0; }
        .choice-btn.selected {
            background: var(--primary-rose);
            border: 2px solid var(--primary-red);
        }
        .next-area {
            padding: 0 18px 20px 18px;
            display: flex;
            justify-content: center;
        }
        .next-btn {
            background: var(--primary-red);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .next-btn:hover { background: var(--dark-red); }
        .next-btn:disabled {
            background: var(--primary-rose);
            cursor: not-allowed;
        }
        .result-card {
            padding: 18px;
            margin: 16px 18px 18px 18px;
            border-radius: 20px;
            text-align: center;
        }
        .result-card.success { background: #e8f0e8; border-left: 8px solid var(--green-success); color: var(--green-success); }
        .result-card.loss { background: #ffe0e0; border-left: 8px solid var(--primary-red); color: var(--primary-red); }
        .result-card ul { list-style: none; padding: 0; }
        .result-card li { padding: 4px 0; }
        .applied-rules {
            background: var(--light-rose);
            border-radius: 24px;
            padding: 12px 16px;
            margin: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid var(--primary-rose);
        }
        .applied-rule { background: #c41e3a20; color: var(--primary-red); padding: 4px 12px; border-radius: 40px; font-size: 12px; }
        .restart-btn {
            background: var(--primary-red);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 16px;
            margin: 0 18px 20px 18px;
            width: calc(100% - 36px);
            cursor: pointer;
            font-weight: bold;
        }
        .restart-btn:hover { background: var(--dark-red); }
        .current-user {
            background: var(--light-rose);
            padding: 10px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 16px;
            color: var(--primary-red);
            font-weight: bold;
            font-size: 14px;
        }
        .save-status { font-size: 12px; color: #666; margin-top: 10px; text-align: center; }
        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            transition: 0.3s;
        }
        .dot.active { background: var(--primary-red); }
        .dot.done { background: var(--green-success); }
        .dot.failed { background: #c41e3a; }

        /* ===== СТИЛИ ДЛЯ РЕКОМЕНДАЦИЙ В РЕЗУЛЬТАТЕ ===== */
        .rec-section {
            margin-top: 16px;
            text-align: left;
            border-top: 2px dashed #e8a0b4;
            padding-top: 16px;
        }
        .rec-section h4 {
            color: #c41e3a;
            font-size: 15px;
            margin-bottom: 12px;
            text-align: center;
        }
        .rec-item {
            background: #f8f4f0;
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-left: 4px solid #c41e3a;
        }
        .rec-item .rec-rule {
            font-weight: 600;
            font-size: 14px;
            color: #1a1a2e;
        }
        .rec-item .rec-tip {
            font-size: 13px;
            color: #854d0e;
            margin-top: 4px;
        }
        .rec-perfect {
            text-align: center;
            padding: 16px;
            background: #e8f0e8;
            border-radius: 16px;
            color: #2c6e2c;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="employee-view">
        <h1>🎯 585GOLD | Тренировка продаж</h1>
        <p style="text-align: center; color: #666; font-size: 14px;">Пройди диалог с клиентом</p>
        <div class="register-form" id="registerForm">
            <input type="text" id="userName" placeholder="Введите имя и фамилию" autocomplete="off">
            <select id="userCity">
                <option value="">Выберите город</option>
                <option value="Петрозаводск">Петрозаводск</option>
                <option value="Казань">Казань</option>
                <option value="Кандалакша">Кандалакша</option>
                <option value="Владимир">Владимир</option>
                <option value="Санкт-Петербург">Санкт-Петербург</option>
                <option value="Тюмень">Тюмень</option>
            </select>
            <button id="startGameBtn">Начать диалог</button>
        </div>
        <div id="currentUserDisplay" class="current-user" style="display: none;"></div>
        <div id="gameContainer" style="display: none;">
            <div class="game-container">
                <div class="progress-indicator" id="progressDots"></div>
                <div class="chat-area" id="chatArea"></div>
                <div class="applied-rules">
                    <span>🏆 Применённые правила:</span>
                    <span id="emptyRulesMsg">(пока ни одного)</span>
                    <div id="appliedRulesList" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                </div>
                <div class="choices-area" id="choicesArea"></div>
                <div class="next-area" id="nextArea">
                    <button class="next-btn" id="nextBtn" disabled>➡ Далее</button>
                </div>
                <div class="result-card" id="resultCard" style="display: none;">
                    <div id="resultMessage"></div>
                </div>
                <div id="saveStatus" class="save-status"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКА JSONBIN.IO ==========
    const JSONBIN_MASTER_KEY = '$2a$10$x.8W4GI2iaP/X052IXSPXOVRirz3Jep1p9o.AHQyFwkP6L8f5YIW2';
    const BIN_ID_KEY = '585_bin_id';
    
    // ========== ПРАВИЛА ==========
    const ALL_RULES = [
        { id: "initiative", name: "Проявляй инициативу", 
          rec: "Не жди, пока клиент сам позовёт. Через 20-30 секунд подойди и спроси: «Какое изделие выбираете? Для себя или в подарок?»" },
        { id: "askBeforeShow", name: "Задавай вопросы ДО показа", 
          rec: "Сначала спроси «для какого случая?», «кто получатель?», «какие предпочтения?». Только потом показывай украшения." },
        { id: "emotionalHPW", name: "Презентуй с эмоцией (ХПВ)", 
          rec: "Привязывай украшение к событию: «Это кольцо будет напоминать о вашей годовщине каждый раз, когда вы на него посмотрите»." },
        { id: "fittingOffer", name: "Предлагай примерку через «Давайте»", 
          rec: "Всегда предлагай примерку фразой «Давайте примерим». Клиент, который примерил, покупает в 3 раза чаще." },
        { id: "alternative", name: "Не отпускай без альтернативы", 
          rec: "Если нет размера или модели — сразу покажи похожие варианты и каталог заказов." },
        { id: "warmClosing", name: "Завершай с теплотой", 
          rec: "Завершай с теплотой: «Спасибо, что зашли! Если будете выбирать подарки — заходите, вместе найдём что-то особенное»." }
    ];

    // ========== ВОПРОСЫ ==========
    const QUESTIONS = [
        {
            client: "Клиент зашёл, молча смотрит на витрину с кольцами около 25 секунд. Что делаете?",
            ruleId: "initiative",
            correct: 1,
            choices: [
                "«Добрый день! Выбираете что-то конкретное или просто смотрите?»",
                "«Добрый день. У нас сегодня скидка 30% на бриллианты. Какое изделие выбираете? Для себя или в подарок?»",
                "«Здравствуйте! Если нужна помощь — обращайтесь» (и отхожу)"
            ]
        },
        {
            client: "Клиент: «Хочу подарить жене кольцо, бюджет до 40 000 ₽». Что делаете?",
            ruleId: "askBeforeShow",
            correct: 1,
            choices: [
                "«Отлично! Давайте посмотрим вот эту коллекцию — она как раз в вашем бюджете»",
                "«А для какого случая? Что ей нравится?»",
                "«40 тысяч — хороший бюджет. Покажу несколько вариантов в нейтральном стиле, а вы выберете»"
            ]
        },
        {
            client: "Клиент: «Годовщина 10 лет. Жена любит винтажный стиль». Показываете кольцо. Что говорите?",
            ruleId: "emotionalHPW",
            correct: 2,
            choices: [
                "«Это кольцо из нашей винтажной коллекции. Очень качественная огранка, хорошая цена»",
                "«Такие кольца сейчас хорошо покупают — это тренд сезона»",
                "«Это кольцо будет напоминать о вашей годовщине каждый раз, когда вы на него посмотрите. Оно создано для таких моментов»"
            ]
        },
        {
            client: "Клиент заинтересовался: «Да, это близко. Можно посмотреть?»",
            ruleId: "fittingOffer",
            correct: 1,
            choices: [
                "«Хотите, чтобы я показала это кольцо поближе?»",
                "«Давайте посмотрим на него вблизи — так вы сразу увидите, как оно прекрасно. Давайте примерим?»",
                "«У нас есть зеркало вон там — можете померить, если захотите»"
            ]
        },
        {
            client: "Клиент посмотрел кольцо, улыбается: «Красиво… но размера 16,5 нет в наличии». Что делаете?",
            ruleId: "alternative",
            correct: 0,
            choices: [
                "«Давайте покажу похожие кольца, которые есть в наличии, а также каталог на заказ — сможем заказать точно под размер»",
                "«Как жаль! Давайте посмотрим, что ещё есть в этой витрине»",
                "«Можем заказать с доставкой через 2-3 недели. Внесёте предоплату?»"
            ]
        },
        {
            client: "Клиент выбрал похожую модель, оформил заказ. Прощается. Что говорите?",
            ruleId: "warmClosing",
            correct: 2,
            choices: [
                "«Спасибо за покупку! Хорошего дня»",
                "«Будем рады видеть вас снова. У нас обновления коллекции каждую неделю»",
                "«Спасибо, что зашли к нам! Если будете выбирать подарки — заходите, вместе найдём что-то особенное»"
            ]
        }
    ];

    let currentQuestionIndex = 0, currentAnswers = [], appliedRules = [], currentUserName = null, currentUserCity = null;
    let gameActive = false, selectedChoiceIndex = null;
    let questionResults = [];

    // ========== СОХРАНЕНИЕ В JSONBIN.IO ==========
    async function saveToJsonBin(resultData) {
        try {
            console.log('Сохраняем результат тренировки...');
            
            let binId = localStorage.getItem(BIN_ID_KEY);
            
            if (!binId) {
                console.error('❌ Нет ID коробки! Сначала пройдите тест.');
                return false;
            }
            
            const getResponse = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
            });
            
            let existingResults = [];
            if (getResponse.ok) {
                const data = await getResponse.json();
                existingResults = data.record || [];
            } else {
                console.log('Коробка не найдена, возможно, нужно создать новую');
                return false;
            }
            
            existingResults.push(resultData);
            
            const updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_MASTER_KEY
                },
                body: JSON.stringify(existingResults)
            });
            
            if (updateResponse.ok) {
                console.log('✅ Результат тренировки сохранён в JSONBin.io!');
                return true;
            } else {
                const errorText = await updateResponse.text();
                console.error('❌ Ошибка обновления:', errorText);
                return false;
            }
        } catch(error) {
            console.error('❌ Ошибка:', error);
            return false;
        }
    }

    function saveResult(success) {
        const resultData = {
            id: Date.now(),
            type: 'trainer',
            user_name: currentUserName,
            city: currentUserCity,
            score: appliedRules.length,
            total: ALL_RULES.length,
            percent: Math.round((appliedRules.length / ALL_RULES.length) * 100),
            passed: success,
            rules_applied: appliedRules,
            rules_count: appliedRules.length,
            answers: currentAnswers,
            date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        saveToJsonBin(resultData).then(saved => {
            const statusDiv = document.getElementById('saveStatus');
            if (statusDiv) {
                if (saved) {
                    statusDiv.innerHTML = '✅ Результат сохранён в облаке!';
                    statusDiv.style.color = '#2c6e2c';
                } else {
                    statusDiv.innerHTML = '⚠️ Результат не сохранился, но баллы засчитаны';
                    statusDiv.style.color = '#c41e3a';
                }
            }
        });
    }

    // ========== ЛОГИКА ТРЕНАЖЁРА ==========
    function nextStep() {
        if (!gameActive || selectedChoiceIndex === null) return;
        
        const isCorrect = selectedChoiceIndex === QUESTIONS[currentQuestionIndex].correct;
        const ruleId = QUESTIONS[currentQuestionIndex].ruleId;
        
        currentAnswers.push({ 
            question: currentQuestionIndex, 
            selected: selectedChoiceIndex, 
            correct: isCorrect, 
            ruleId: ruleId,
            questionText: QUESTIONS[currentQuestionIndex].client,
            selectedText: QUESTIONS[currentQuestionIndex].choices[selectedChoiceIndex],
            correctText: QUESTIONS[currentQuestionIndex].choices[QUESTIONS[currentQuestionIndex].correct]
        });
        
        questionResults[currentQuestionIndex] = isCorrect;
        
        if (isCorrect) {
            const r = ALL_RULES.find(x => x.id === ruleId);
            if (r && !appliedRules.includes(r.name)) appliedRules.push(r.name);
        }
        
        currentQuestionIndex++;
        if (currentQuestionIndex >= QUESTIONS.length) {
            finishGame();
        } else {
            selectedChoiceIndex = null;
            renderQuestion();
        }
    }

    function finishGame() {
        gameActive = false;
        const success = appliedRules.length === 6;
        document.getElementById("choicesArea").innerHTML = "";
        document.getElementById("nextArea").style.display = "none";
        
        const resultDiv = document.getElementById("resultCard");
        resultDiv.style.display = "block";
        resultDiv.className = `result-card ${success ? "success" : "loss"}`;
        
        // ===== ФОРМИРУЕМ РЕЗУЛЬТАТ С РЕКОМЕНДАЦИЯМИ =====
        let html = '';
        
        if (success) {
            html = `
                <h2>🏆 ПОБЕДА!</h2>
                <p>Вы применили все 6 правил!</p>
                <p style="font-size:14px; color:#666;">Результат: ${appliedRules.length}/6</p>
                <div class="rec-perfect">
                    🎉 <strong>ИДЕАЛЬНО!</strong> Вы применили все правила в диалоге!<br>
                    <span style="font-size: 14px;">Продолжайте в том же духе!</span>
                </div>
            `;
        } else {
            const missingRules = ALL_RULES.filter(r => !appliedRules.includes(r.name));
            
            html = `
                <h2>😞 ДИАЛОГ НЕ ПРОЙДЕН</h2>
                <p>Применено правил: ${appliedRules.length} из 6</p>
            `;
            
            if (missingRules.length > 0) {
                html += `
                    <div class="rec-section">
                        <h4>📚 КАКИЕ ПРАВИЛА НЕ ПРИМЕНЕНЫ И КАК ИСПРАВИТЬ</h4>
                `;
                
                missingRules.forEach(rule => {
                    html += `
                        <div class="rec-item">
                            <div class="rec-rule">❌ ${rule.name}</div>
                            <div class="rec-tip">📌 ${rule.rec}</div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }
            
            if (appliedRules.length > 0) {
                html += `
                    <div style="margin-top: 12px; text-align: center; font-size: 14px; color: #2c6e2c;">
                        ✅ ${appliedRules.length} правил вы применили — так держать!
                    </div>
                `;
            }
        }
        
        resultDiv.innerHTML = html;
        
        // Сохраняем результат
        saveResult(success);
        
        // Кнопка перезапуска
        const existingBtn = resultDiv.parentNode.querySelector('.restart-btn');
        if (!existingBtn) {
            const btn = document.createElement("button");
            btn.className = "restart-btn";
            btn.innerText = "🔄 Пройти заново";
            btn.onclick = () => resetGame();
            resultDiv.parentNode.appendChild(btn);
        }
    }

    function renderQuestion() {
        const q = QUESTIONS[currentQuestionIndex];
        document.getElementById("chatArea").innerHTML = `<div class="client-message">${q.client}</div>`;
        
        updateProgress();
        
        const rulesDiv = document.getElementById("appliedRulesList");
        if (appliedRules.length) {
            document.getElementById("emptyRulesMsg").style.display = "none";
            rulesDiv.innerHTML = appliedRules.map(r => `<span class="applied-rule">✅ ${r}</span>`).join('');
        } else {
            document.getElementById("emptyRulesMsg").style.display = "inline";
            rulesDiv.innerHTML = "";
        }
        
        const choicesDiv = document.getElementById("choicesArea");
        choicesDiv.innerHTML = "";
        selectedChoiceIndex = null;
        document.getElementById("nextBtn").disabled = true;
        
        q.choices.forEach((c, idx) => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = c;
            btn.onclick = () => {
                document.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                selectedChoiceIndex = idx;
                document.getElementById("nextBtn").disabled = false;
            };
            choicesDiv.appendChild(btn);
        });
    }

    function updateProgress() {
        const dotsContainer = document.getElementById('progressDots');
        dotsContainer.innerHTML = '';
        for (let i = 0; i < QUESTIONS.length; i++) {
            const dot = document.createElement('span');
            dot.className = 'dot';
            if (i < currentQuestionIndex) {
                dot.classList.add(questionResults[i] ? 'done' : 'failed');
            } else if (i === currentQuestionIndex) {
                dot.classList.add('active');
            }
            dotsContainer.appendChild(dot);
        }
    }

    function startGame(name, city) {
        currentUserName = name;
        currentUserCity = city;
        currentQuestionIndex = 0;
        appliedRules = [];
        currentAnswers = [];
        questionResults = [];
        gameActive = true;
        
        document.getElementById("gameContainer").style.display = "block";
        document.getElementById("currentUserDisplay").innerHTML = `👤 ${name} (${city})`;
        document.getElementById("currentUserDisplay").style.display = "inline-block";
        document.getElementById("registerForm").style.display = "none";
        document.getElementById("resultCard").style.display = "none";
        document.getElementById("saveStatus").innerHTML = '';
        
        const oldBtn = document.querySelector('.restart-btn');
        if (oldBtn) oldBtn.remove();
        
        renderQuestion();
    }

    function resetGame() {
        const name = currentUserName;
        const city = currentUserCity;
        startGame(name, city);
    }

    // ========== ОБРАБОТЧИКИ ==========
    document.getElementById("startGameBtn").onclick = () => {
        const name = document.getElementById("userName").value.trim();
        const city = document.getElementById("userCity").value;
        if (!name) return alert("Введите имя");
        if (!city) return alert("Выберите город");
        startGame(name, city);
    };
    
    document.getElementById("nextBtn").onclick = nextStep;

    document.getElementById("userName").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("startGameBtn").click();
    });
</script>
</body>
</html>
