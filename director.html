<script>
// ===================== НАСТРОЙКИ =====================
const STORES = (window.STORES_585 || ['СПб, Новочеркасский, 28/19', 'СПб, Дыбенко, 27', 'Самара', 'Казань', 'Тюмень', 'Черкесск', 'Ульяновск', 'Нальчик']);

  { k: 'K1', n: 'Приветствие и речевая пластинка', short: 'Приветствие', tr: { name: 'Тренировка диалога', url: 'dialog_trainer.html' } },

  { k: 'K11', n: 'Прощание и сервис', short: 'Сервис', tr: { name: 'Сервис с человеческим лицом', url: 'service_trainer.html' } }
];
const SKN = Object.fromEntries(SK.map(s => [s.k, s]));
const TOOLS = {
  test: 'Входной тест', trainer: 'Тренировка диалога', crosssell: 'Тренажёр допродаж', errorfinder: 'Найди ошибку', clienttype: 'Типы клиентов',
  algorithm: 'Алгоритм продаж', service: 'Сервис', final_exam_1: 'Аттестация «Одна смена»', final_exam_old: 'Аттестация (старая)'
};
const TRAINERS = ['trainer', 'crosssell', 'errorfinder', 'clienttype', 'algorithm', 'service'];
const TSHORT = { trainer: 'Диалог', crosssell: 'Допродажи', errorfinder: 'Найди ошибку', clienttype: 'Типы клиентов', algorithm: 'Алгоритм', service: 'Сервис' };
const TICON = { trainer: '💬', crosssell: '🛍️', errorfinder: '🔍', clienttype: '🧑‍🤝‍🧑', algorithm: '🧭', service: '🤝' };
const TSKILL = { trainer: 'выявление, презентация, завершение', crosssell: 'допродажа', errorfinder: 'все этапы продажи', clienttype: 'презентация под тип клиента', algorithm: 'алгоритм продажи', service: 'контакт и сервис' };
const activeTr = () => TRAINERS.filter(t => RECS.some(r => r.type === t));
const COLS = [['test', 'test'], ['dialog', 'trainer'], ['crosssell', 'crosssell'], ['errorfinder', 'errorfinder'], ['clienttype', 'clienttype'], ['service', 'service'], ['algorithm', 'algorithm'], ['final_exam', 'final_exam'], ['final_exam_1', 'final_exam_1']];
const TEST_TOPICS = ['Приветствие и контакт', 'Выявление бюджета', 'Дополнительные товары', 'Выбор материала', 'Сопутствующие товары', 'Возражение «дорого»', 'Альтернатива, нет размера', 'Эмоциональная презентация', 'Дополнительные модели', 'Рассрочка (Сплит)', 'Инициатива, молчаливый клиент', 'Завершение сделки', '«Я подумаю»'];
const TEST_SK = ['K1', 'K3', 'K6', 'K5', 'K6', 'K8', 'K9', 'K4', 'K2', 'K7', 'K2', 'K10', 'K8'];
const RULES = [['Проявляй инициативу', 'K1'], ['Проявляй инициативу', 'K2'], ['Задавай вопросы ДО показа', 'K3'], ['Презентуй с эмоцией', 'K4'], ['Предлагай примерку', 'K4'], ['Показывай вариант лучше', 'K5'], ['Называй Сплит до цены', 'K7'], ['Отрабатывай «дорого»', 'K8'], ['Не отпускай без альтернативы', 'K9'], ['Закрывай сделку', 'K10'], ['Предлагай второе украшение', 'K6'], ['Предлагай футляр и уход', 'K6'], ['Завершай с теплотой', 'K11']];
const EF_SK = { 'Холодный клиент': 'K2', 'Подарок жене': 'K3', 'Дорого!': 'K8', 'Просто смотрю': 'K2', 'Допродажа на кассе': 'K6', 'А что есть ещё?': 'K4', 'Беру': 'K10' };
const CT_SK = { 'Холодный клиент': 'K2', 'Молчаливый наблюдатель': 'K2', 'Постоянный клиент': 'K11', 'Растерянный мужчина (подарок)': 'K3' };
const CS_SK = { 'Серебряная цепь': 'K5' };
const ALG_SK = { 'Классический путь покупателя': 'K10', 'Растерянный мужчина с подарком': 'K3', 'Клиент говорит ДОРОГО': 'K8', 'Допродажа на кассе': 'K6', 'Молчаливый клиент': 'K2', 'Постоянный клиент': 'K11', 'Возврат после «подумаю»': 'K8' };
const EX_SK = { 'Приветствие и контакт': ['K1', 'K2'], 'Выявление потребностей': 'K3', 'Наблюдательность': 'K3', 'Презентация и золото': ['K4', 'K5'], 'Допродажа': 'K6', 'Работа с возражениями': ['K8', 'K7'], 'Закрытие и прощание': ['K10', 'K11'], 'Удержание и допродажа': ['K6', 'K11'], 'Алгоритм продажи': 'K9' };

// Пункты каждого вида: [название пункта, навык, значение 0–100]
function itemsOf(r) {
  const x = r.raw;
  switch (r.type) {
    case 'test': return (x.answers || []).map(a => { const i = a.originalIndex ?? (a.questionNum - 1); return [TEST_TOPICS[i] || ('Вопрос ' + (i + 1)), TEST_SK[i] || 'K4', a.correct ? 100 : 0]; });
    case 'trainer': return RULES.filter(([n]) => (n !== 'Предлагай второе украшение' || (x.total || 6) >= 7) && (n !== 'Предлагай футляр и уход' || (x.total || 6) >= 8) && (!['Показывай вариант лучше', 'Называй Сплит до цены', 'Отрабатывай «дорого»', 'Закрывай сделку'].includes(n) || (x.total || 6) >= 12)).map(([n, k]) => [n, k, (x.rules_applied || []).includes(n) ? 100 : 0]); // старые прохождения — 6 правил
    case 'crosssell': return (x.scenarios || []).map(s => [s.scenario, CS_SK[s.scenario] || 'K6', s.isCorrect ? 100 : 0]);
    case 'errorfinder': return (x.scenarios || []).map(s => [s.scenario, EF_SK[s.scenario] || 'K4', s.percent != null ? s.percent : Math.round((s.score || 0) / (s.maxScore || 1) * 100)]);
    case 'clienttype': return (x.scenarios || []).map(s => [s.scenario || s.clientType, CT_SK[s.scenario] || 'K4', s.isCorrect ? 100 : 0]);
    case 'algorithm': return (x.scenarios || []).map(s => [s.scenario, ALG_SK[s.scenario] || 'K10', s.percent || 0]);
    case 'service': return (x.answers || []).filter(a => a.principle).map(a => [a.principle, 'K11', a.isCorrect ? 100 : 0]);
    case 'final_exam_1': return (x.answers || []).filter(a => a.skill).flatMap(a => [].concat(EX_SK[a.skill] || 'K10').map(k => [a.skill, k, a.percentTask || 0]));
    default: return [];
  }
}

// ===================== УТИЛИТЫ =====================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
const cls = v => v == null ? 'none' : v >= 80 ? 'good' : v >= 60 ? 'mid' : 'bad';
const pill = v => `<span class="pill ${cls(v)}">${v == null ? '—' : v + '%'}</span>`;
const delta = d => d == null ? '<span class="delta zero">—</span>' : `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'zero'}">${d > 0 ? '▲ +' : d < 0 ? '▼ ' : ''}${d}</span>`;
const fmtD = d => new Date(d).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const rub = n => Math.round(n || 0).toLocaleString('ru-RU') + ' ₽';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const cap = s => s.replace(/(^|\s|-)\S/g, c => c.toUpperCase());
const levelOf = p => p >= 85 ? ['Мастер продаж', 'gold'] : p >= 70 ? ['Специалист по сервису', 'silver'] : p >= 50 ? ['Продавец-консультант', 'bronze'] : null;

// ---- имена: автоматическое склеивание ----
function normKey(name) {
  let t = String(name || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я\s-]/g, ' ').split(/\s+/).filter(Boolean);
  if (t.length >= 3) t = t.filter(w => !/(вна|вич|ична|ична|инична)$/.test(w) || t.length <= 2);
  if (t.length > 2) t = t.slice(0, 2);
  return t.sort().join(' ');
}
// ключ сотрудника = имя + магазин: тёзки из разных магазинов не склеиваются
const pkey = (name, city) => normKey(name) + '|' + String(city || '').trim();
let MERGE = store.get('dash2_merge', {});
const rootKey = k => { let g = 0; while (MERGE[k] && g++ < 10) k = MERGE[k]; return k; };
function lev(a, b) { const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }

// ===================== СТРАНИЦА ДИРЕКТОРА =====================
const FOCUS = {
  K1: ['Речевая пластинка', 'Каждому клиенту — приветствие и конкретная акция сразу при встрече.', 'На пятиминутке каждый по очереди произносит пластинку с сегодняшней акцией. Коллеги оценивают: звучит ли выгода конкретно?'],
  K2: ['Инициатива в диалоге · Неконтактный покупатель', 'Продавец подходит первым и ведёт диалог, а не ждёт вопроса.', 'Сценка в паре: «Я просто посмотреть». Продавец даёт 2–3 минуты и заходит с «крючком» — акцией или новинкой.'],

    case 'service': return A.filter(a => !a.isCorrect).map(a => [a.principle || 'Сервис', mk((a.situation || '') + (a.action ? ' Продавец: ' + a.action : ''), 'Оценил: ' + (a.selected === 'good' ? '👍 хорошо' : '👎 плохо'), 'Правильно: ' + (a.correct === 'good' ? '👍 хорошо' : '👎 плохо'))]);

async function loadPeople() {

    try {
      const snap = await db.collection('results').doc(col).collection('items').get();
      snap.forEach(d => { const x = d.data(); let t = type; if (col === 'final_exam') t = x.exam_version === 'shift_v1' ? 'final_exam_1' : 'final_exam_old'; if (!x.user_name || x.percent == null) return;
        const dk = col + '|' + String(x.user_name).trim().toLowerCase() + '|' + (x.city || '') + '|' + x.date + '|' + x.percent; if (x.date && SEEN.has(dk)) return; SEEN.add(dk);
        recs.push({ type: t, name: String(x.user_name).trim(), city: x.city || '', percent: +x.percent || 0, date: x.date || new Date(0).toISOString(), raw: x }); });
    } catch (e) { }
  }
  recs.sort((a, b) => new Date(a.date) - new Date(b.date));
  const P = {};
  recs.forEach(r => { const k = rootKey(pkey(r.name, r.city)); (P[k] = P[k] || { recs: [], city: r.city }).recs.push(r); P[k].city = r.city; P[k].name = r.name; });
  const acc = rs => { const m = {}; rs.forEach(r => itemsOf(r).forEach(([, k, v]) => [].concat(k).forEach(kk => (m[kk] = m[kk] || []).push(v)))); return Object.fromEntries(Object.entries(m).map(([k, v]) => [k, avg(v)])); };
  Object.values(P).forEach(p => {
    const by = t => p.recs.filter(r => r.type === t);
    const t0 = by('test')[0]; p.test = !!t0; p.skTest = t0 ? acc([t0]) : {}; p.rsTest = t0 ? [t0] : [];
    const firsts = TRAINERS.map(t => by(t)[0]).filter(Boolean); p.train = firsts.length > 0; p.skTrain = acc(firsts); p.rsTrain = firsts;
    const ex = by('final_exam_1'); p.exam = ex.length > 0; p.skExam = ex.length ? acc([ex[ex.length - 1]]) : {}; p.rsExam = ex.length ? [ex[ex.length - 1]] : [];
  });
  return Object.values(P);
}

    const b = (m[lbl] = m[lbl] || { v: [], bin: true }); b.v.push(v); if (v !== 0 && v !== 100) b.bin = false; })));
  return Object.entries(m).map(([l, b]) => ({ l, a: avg(b.v), t: b.bin ? `верно ${b.v.filter(x => x === 100).length} из ${b.v.length}` : `в среднем ${avg(b.v)}%` })).filter(x => x.a < 80).sort((a, b) => a.a - b.a);

const wwHtml = w => w.length ? `<div class="ww"><b>Где ошиблись:</b><ul>${w.map(x => `<li>${esc(x.l)} — <b>${x.t}</b></li>`).join('')}</ul></div>` : '';
function progressBlock(ps) {

  if (!open.length) return '';

  return `<section><h2>🎯 Тренажёры</h2><p class="hint">Открытые тренажёры и сроки. «Из ${team}» — сотрудники магазина, у которых есть хотя бы один результат.</p><div class="card">${rows}</div></section>`;
}
function mistakesBlock(ps) {
  const per = ps.map(p => { const items = []; ['test', ...TRAINERS, 'final_exam_1'].forEach(t => { const rs = p.recs.filter(r => r.type === t); if (!rs.length) return; const r = rs[rs.length - 1], m = mistakes(r); if (m.length) items.push([t, r, m]); }); return { p, items, n: items.reduce((a, [, , m]) => a + m.length, 0) }; }).filter(x => x.p.recs.length).sort((a, b) => b.n - a.n);
  // частые ошибки команды
  const freq = {}; per.forEach(({ p, items }) => items.forEach(([t, , m]) => m.forEach(([topic]) => { const k = (t === 'test' ? '📝 Тест' : t === 'final_exam_1' ? '🏆 Аттестация' : TICON[t] + ' ' + TSHORT[t]) + ' · ' + topic; (freq[k] = freq[k] || new Set()).add(p.name); })));
  const top = Object.entries(freq).filter(([, s]) => s.size > 1).sort((a, b) => b[1].size - a[1].size).slice(0, 5);
  const tname = t => t === 'test' ? '📝 Входной тест' : t === 'final_exam_1' ? '🏆 Аттестация' : TICON[t] + ' ' + TSHORT[t];
  return `<section><h2>🔍 Ошибки сотрудников</h2><p class="hint">По каждому тесту и тренажёру — последняя попытка. Видно, что ответил сотрудник и как было правильно. Используйте для разбора один на один.</p>
  ${top.length ? `<div class="card" style="margin-bottom:12px"><b>Частые ошибки команды</b>${top.map(([k, s]) => `<div class="fq"><span>${esc(k)}</span><b>${s.size} из ${per.length}</b></div>`).join('')}</div>` : ''}
  ${per.map(({ p, items, n }) => `<details class="card emp"><summary><b>${esc(cap(p.name))}</b><span class="muted">${n ? `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'ошибка' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'ошибки' : 'ошибок'}` : 'без ошибок 🎉'}</span></summary>
    ${items.map(([t, r, m]) => `<div class="et"><div class="et-h">${tname(t)} <span class="muted">· ${new Date(r.date).toLocaleDateString('ru-RU')} · ${r.percent}%</span></div>${m.map(([topic, h]) => `<div class="et-t">${esc(topic)}</div>${h}`).join('')}</div>`).join('') || '<div class="muted" style="margin-top:8px">Ошибок нет.</div>'}</details>`).join('') || '<div class="card empty">Пока нет результатов.</div>'}</section>`;
}
function renderPicker() {
  if (!IS_TRAINER) { $('app').innerHTML = `<header class="hero"><div class="brand">585GOLD · НАВЫКИ КОМАНДЫ</div><h1>Откройте ссылку из письма</h1><p>У каждого магазина своя ссылка на страницу навыков команды. Найдите её в письме от команды обучения.</p></header>`; return; }
  const base = location.href.split('?')[0];
  $('app').innerHTML = `<header class="hero"><div class="brand">585GOLD · НАВЫКИ КОМАНДЫ</div><h1>Выберите магазин</h1><p>Откройте страницу своего магазина. Ссылку можно сохранить в закладки — данные обновляются сами.</p></header>
    <section><div class="pick">${STORES.map(s => `<a href="${base}?m=${encodeURIComponent(s)}">🏬 ${esc(s)}</a>`).join('')}</div></section>`;
}
function render(all) {

  const net = last != null ? skAvg(all.filter(p => last === 0 ? p.test : last === 1 ? p.train : p.exam), STG[last][0]) : null;
  let html = `<header class="hero"><div class="brand">585GOLD · НАВЫКИ КОМАНДЫ</div><h1>${esc(MY)}</h1><p>Как развиваются навыки вашей команды: входной тест → тренажёры → аттестация.${VAR === '1' || VAR === '2' ? '' : ' Только общий результат магазина, без имён.'}</p><span class="upd">🔄 Данные на ${now} · обновляются сами каждые 15 минут</span></header>
  <section><h2>Сколько человек прошли</h2><div class="stages">${STG.map(([, l], i) => `<div class="stg ${cnt[i] ? 'on' : ''}"><div class="l">${l}</div><div class="v">${cnt[i]}</div><div class="s">${cnt[i] ? 'сотрудников' : 'пока никто'}</div></div>`).join('')}</div></section><!--V1-->`;
  if (last == null) {
    html += `<section><div class="card empty">📭 Пока никто из команды не прошёл входной тест.<br>Как только появятся первые результаты — здесь будет картина навыков.</div></section>`;
  } else {
    html += `<section><h2>11 навыков продавца</h2><p class="hint">Средний результат команды по каждому навыку на каждом этапе. «Изменение» — от входного теста до последнего этапа, где навык проверялся.</p>${VAR === '3' ? `<div class="v3">🎯 <b>Столбец «Тренажёры» — среднее по всем пройденным тренажёрам</b> (первая попытка каждого сотрудника). Он заполняется по мере прохождения: пройдено ${trDone.length} из ${TRAINERS.length} — ${trDone.length ? trDone.map(t => TICON[t] + ' ' + TSHORT[t]).join(', ') : 'пока ни одного'}. Под цифрой — какие тренажёры уже проверили этот навык и сколько всего тренажёров его проверяют.</div>` : ''}
    <div class="tw"><table><thead><tr><th>Навык</th>${STG.map(([, l]) => `<th>${l}</th>`).join('')}<th>Изменение</th></tr></thead><tbody>${SK.map(s => {
      const v = st.map(x => x ? x[s.k] : null), a = v[0], li = [2, 1].find(i => v[i] != null), b = li != null ? v[li] : null, d = a != null && b != null ? b - a : null;
      return `<tr><td>${esc(s.n)}${net && net[s.k] != null ? `<small>по сети: ${net[s.k]}%</small>` : ''}</td>${v.map((x, i) => `<td>${cell(x)}${VAR === '3' && i === 1 && src[s.k] ? `<small class="src">${[...src[s.k]].map(t => TICON[t]).join(' ')} ${src[s.k].size} из ${TRAINERS.filter(t => TR_SK[t].includes(s.k)).length}</small>` : ''}</td>`).join('')}<td>${d == null ? '<span class="dl zero">—</span>' : `<span class="dl ${d > 2 ? 'up' : d < -2 ? 'down' : 'zero'}">${d > 2 ? '▲ +' + d : d < -2 ? '▼ ' + d : '≈ ' + (d > 0 ? '+' : '') + d}</span>`}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--ok-bg)"></i>80% и выше</span><span><i style="background:var(--mid-bg)"></i>60–79%</span><span><i style="background:var(--bad-bg)"></i>ниже 60% — зона развития</span></div></section>`;
    const latest = k => { for (const i of [2, 1, 0]) if (st[i] && st[i][k] != null) return st[i][k]; return null; };

    const weak = weakAll.slice(0, 3), rest = weakAll.slice(3);

  }
  if (VAR === '1') html = html.replace('<!--V1-->', progressBlock(ps));
  if (VAR === '2') html += mistakesBlock(ps);
  html += `<div class="note">💡 ${VAR === '1' || VAR === '2' ? 'Фамилии видны только вам как директору магазина. Пожалуйста, не пересылайте страницу дальше.' : 'Страница показывает только общий результат команды. Личные результаты сотрудников здесь не отображаются.'}</div><p class="foot">💎 585GOLD | Команда обучения</p>`;
  if (LAB) { const b = location.href.split('?')[0] + '?m=' + encodeURIComponent(MY); html = `<div class="vbar"><b>🧪 Варианты страницы:</b>${['1', '0', '2', '3'].map(v => `<a class="${v === VAR ? 'on' : ''}" href="${b}&var=${v}&lab=1">${{ '1': '1 · Основной (прогресс по тренажёрам)', '0': '0 · Только навыки, без имён', '2': '2 · Ошибки сотрудников', '3': '3 · Навыки по всем тренажёрам' }[v]}</a>`).join('')}</div>` + html; }
  $('app').innerHTML = html;
}
(async () => {
  if (!MY) { renderPicker(); return; }
  if (!db) { $('app').innerHTML = '<div class="empty">⚠️ Не удалось подключиться к базе. Обновите страницу.</div>'; return; }
