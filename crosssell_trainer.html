            options: [
                { text: "«Может быть, вам подарочный сертификат? Так вы точно не ошибётесь, а именинник выберет сам».", correct: true, explanation: "Сертификат — идеальное решение для растерянного клиента, снимающее стресс от выбора." },
                { text: "«Давайте я покажу вам вообще всё, что у нас есть в этом бюджете».", correct: false, explanation: "Ещё больше запутает и перегрузит растерянного клиента." },
                { text: "«Просто выберите то, что первым приглянулось».", correct: false, explanation: "Обесценивание процесса выбора, звучит непрофессионально." }
            ]
        },
        {
            title: "Молчаливый клиент",
            icon: "👀",
            situation: "Клиент рассматривает витрину, но на вопросы отвечает односложно.",
            clientPhrase: "«Да просто смотрю...»",
            options: [
                { text: "«Хорошо, смотрите. Я тут рядом».", correct: false, explanation: "Пассивная позиция, разговор завершён." },
                { text: "«Понимаю. Кстати, у многих наших покупателей сейчас популярны минималистичные кольца. Вы ищете что-то для повседневной носки или для особого случая?»", correct: true, explanation: "Мягкий активный вопрос, который переводит монолог в диалог и помогает выявить потребность." },
                { text: "«А почему вы ничего не выбираете? У нас большой ассортимент».", correct: false, explanation: "Давление на клиента, вызовет желание немедленно уйти." }
            ]
        },
        {
            title: "Серьги-пусеты",
            icon: "💎",
            situation: "Девушка выбрала классические серьги-пусеты с камнем.",
            clientPhrase: "«Возьму вот эти пусеты».",
            options: [

                { text: "«А может, возьмёте сразу две пары, пока акция?»", correct: false, explanation: "Слишком агрессивная попытка увеличить чек без аргументации." }
            ]
        },
        {
            title: "Серебряная цепь",

            situation: "Покупатель берёт недорогую серебряную цепь.",
            clientPhrase: "«Мне только эту цепь, пожалуйста».",
            options: [
                { text: "«Серебро требует особого ухода. Давайте я добавлю к покупке специальное средство для чистки, она стоит совсем недорого, но цепь будет как новая».", correct: true, explanation: "Продажа средства ухода через экспертную заботу о конкретном материале (серебре)." },
                { text: "«Серебро сейчас не очень модно, может, посмотрите золото?»", correct: false, explanation: "Критика выбора клиента, вызывает негатив." },
                { text: "«Хорошо, с вас 1500 рублей».", correct: false, explanation: "Отсутствие инициативы в предложении сопутствующих товаров." }
            ]
        },
        {
            title: "Пара просто смотрит",
            icon: "👫",
            situation: "Пара зашла в магазин, держатся за руки, улыбаются, но пока ничего не примеряют.",
            clientPhrase: "«Мы пока просто гуляем, смотрим».",
            options: [
                { text: "«Понимаю, прогуливайтесь. А вы не подбираете что-то к предстоящему празднику или дате? У нас как раз новое поступление».", correct: true, explanation: "Мягкий, ненавязчивый вопрос о подарке или событии, который может запустить процесс продажи." },
                { text: "«Ну ладно, заглядывайте, когда решите купить».", correct: false, explanation: "Преждевременное завершение контакта." },
                { text: "«Смотрите, но ничего не трогайте, пожалуйста».", correct: false, explanation: "Грубость и недоверие, мгновенно отпугивающее клиентов." }
            ]
        },
        {
            title: "Постоянный клиент",
            icon: "🏆",
            situation: "Знакомая клиентка, которая покупала кольцо месяц назад, зашла в магазин.",
            clientPhrase: "«Здравствуйте! Решила заглянуть, посмотреть, что у вас новенького».",
            options: [
                { text: "«Здравствуйте! Да, вот новые коллекции, смотрите».", correct: false, explanation: "Формальный ответ без использования истории покупок." },
                { text: "«Здравствуйте, Мария! Рада вас видеть. Как вам кольцо, которое вы брали в прошлом месяце, носите с удовольствием? Кстати, к нему отлично подойдут новые браслеты из той же коллекции, давайте покажу?»", correct: true, explanation: "Персонализация, забота о предыдущей покупке и логичное предложение дополнения к уже купленному." },
                { text: "«Здравствуйте. У нас сегодня скидки 10%».", correct: false, explanation: "Слишком рекламный подход, игнорирующий личные отношения." }
            ]
        }
    ];

    let currentScenario = 0;
    let selectedOption = null;
    let gameResults = [];
    let currentUserName = '';
    let currentUserCity = '';

    function updateProgress() {
        const progress = (currentScenario / SCENARIOS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
    }

    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        document.getElementById('totalScenarios').textContent = SCENARIOS.length;
        updateProgress();
        selectedOption = null;

        const scenarioArea = document.getElementById('scenarioArea');
        let optionsHtml = '';
        scenario.options.forEach((option, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `
                <div class="option" data-idx="${idx}" onclick="selectOption(${idx}, this)">
                    <div class="option-label"><span>${letter}</span></div>
                    <div class="option-text">${option.text}</div>
                </div>
            `;
        });

        scenarioArea.innerHTML = `
            <div class="scenario-header">
                <div class="scenario-icon">${scenario.icon}</div>
                <div class="scenario-content">
                    <div class="scenario-label">Сценарий ${currentScenario + 1} из ${SCENARIOS.length}</div>
                    <div class="scenario-title">${scenario.title}</div>
                </div>
            </div>
            <div class="situation-card">
                <strong>💡 Ситуация</strong>
                ${scenario.situation}
            </div>
            <div class="message client">
                <div class="speaker">👤 Клиент говорит:</div>
                <div>${scenario.clientPhrase}</div>
            </div>
            <div class="options-title">Выберите лучшую фразу для допродажи:</div>
            <div class="options-container">${optionsHtml}</div>
        `;

        const checkBtn = document.getElementById('checkBtn');
        checkBtn.textContent = '✅ Проверить';
        checkBtn.className = 'btn-primary';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;
        document.getElementById('resultCard').style.display = 'none';
    }

    function selectOption(idx, element) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        selectedOption = idx;
        document.getElementById('checkBtn').disabled = false;
    }

    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctOption = scenario.options.findIndex(opt => opt.correct);
        const options = document.querySelectorAll('.option');
        
        options.forEach((opt, idx) => {
            opt.onclick = null;
            opt.classList.add('disabled');
            if (idx === correctOption) opt.classList.add('correct');
            else if (idx === selectedOption) opt.classList.add('wrong');
        });
        
        const isCorrect = selectedOption === correctOption;
        const percent = isCorrect ? 100 : 0;
        
        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${isCorrect ? 'success' : 'fail'}`;
        
        let html = `<h2>${isCorrect ? '🎉 Отлично!' : '⚠️ Есть над чем поработать'}</h2>`;
        html += `<p>${isCorrect ? 'Вы выбрали лучшую фразу для увеличения чека!' : 'Этот вариант не сработал бы для допродажи'}</p>`;
        
        html += `<div class="explanation ${isCorrect ? 'correct' : 'wrong'}">`;
        if (isCorrect) {
            html += `<strong>✅ Правильно!</strong><p>${scenario.options[selectedOption].explanation}</p>`;
        } else {
            html += `<strong>❌ Почему это не сработает:</strong><p>${scenario.options[selectedOption].explanation}</p>`;
            html += `<div class="correct-answer"><strong>✅ Лучший вариант:</strong><p style="margin-top:6px;">${scenario.options[correctOption].text}</p><p style="margin-top:8px;"><em>${scenario.options[correctOption].explanation}</em></p></div>`;
        }
        html += `</div>`;
        resultCard.innerHTML = html;
        
        gameResults.push({
            scenario: scenario.title,
            icon: scenario.icon,
            selectedOption: selectedOption,
            correctOption: correctOption,
            isCorrect: isCorrect,
            percent: percent
        });
        
        const checkBtn = document.getElementById('checkBtn');
        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn-primary btn-next';
            checkBtn.disabled = false;
            checkBtn.onclick = () => { currentScenario++; renderScenario(); };
        } else {
            checkBtn.textContent = '🏁 Завершить игру';
            checkBtn.className = 'btn-primary btn-finish';
            checkBtn.disabled = false;
            checkBtn.onclick = finishGame;
        }
    }

    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.percent, 0);
        const avgPercent = Math.round(totalScore / SCENARIOS.length);
        const correctCount = gameResults.filter(r => r.isCorrect).length;
        const passed = avgPercent >= 70;
        
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('finalScreen').classList.remove('hidden');
        
        let reviewHtml = '<div class="scenarios-review"><h3>💰 Ваши результаты по ситуациям допродаж</h3>';
        gameResults.forEach(r => {
            reviewHtml += `
                <div class="scenario-review-item ${r.isCorrect ? '' : 'wrong'}">
                    <div class="scenario-review-icon">${r.icon}</div>
                    <div class="scenario-review-info">
                        <div class="scenario-review-title">${r.scenario}</div>
                        <div class="scenario-review-type">${r.isCorrect ? 'Верно увеличил чек' : 'Возможность упущена'}</div>
                    </div>
                    <div class="scenario-review-status">${r.isCorrect ? '✅' : '❌'}</div>
                </div>
            `;
        });
        reviewHtml += '</div>';
        
        document.getElementById('finalScreen').innerHTML = `
            <div class="final-card ${passed ? 'success' : 'fail'}">
                <div class="final-icon">${passed ? '🏆' : '📚'}</div>
                <h2>${passed ? 'Мастер допродаж!' : 'Есть над чем поработать'}</h2>
                <p>${passed ? 'Вы отлично находите возможности увеличить средний чек!' : 'Рекомендуем повторить тренажёр и изучить техники cross-sell.'}</p>
                <div class="result-stats">
                    <div class="stat-box"><div class="stat-value">${avgPercent}%</div><div class="stat-label">Результат</div></div>
                    <div class="stat-box"><div class="stat-value">${correctCount}/${SCENARIOS.length}</div><div class="stat-label">Верно</div></div>
                </div>
                ${reviewHtml}
                <div class="save-status" id="saveStatus"><span class="spinner"></span>Сохраняю результат...</div>
                <button class="restart-btn" onclick="location.reload()">🔄 Пройти ещё раз</button>
            </div>
        `;
        
        const resultData = {
            id: Date.now(), type: 'crosssell', user_name: currentUserName, city: currentUserCity,
            score: totalScore, total: SCENARIOS.length * 100, percent: avgPercent, passed: passed,
            scenarios: gameResults, date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        const statusDiv = document.getElementById('saveStatus');
        try {
            const localBackup = JSON.parse(localStorage.getItem('crosssell_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('crosssell_backup', JSON.stringify(localBackup));
            
            const newRef = db.ref('results/crosssell').push();
            await Promise.race([
                newRef.set(resultData),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000))
            ]);
            
            const backup = JSON.parse(localStorage.getItem('crosssell_backup') || '[]');
            localStorage.setItem('crosssell_backup', JSON.stringify(backup.filter(r => r.id !== resultData.id)));
            
            statusDiv.innerHTML = '✅ Результат сохранён в облаке!';
            statusDiv.style.color = '#10b981';
            statusDiv.style.background = 'rgba(16,185,129,0.1)';
        } catch(e) {
            statusDiv.innerHTML = '⚠️ Сохранено локально, отправится при следующем запуске.';
            statusDiv.style.color = '#d97706';
            statusDiv.style.background = 'rgba(217,119,6,0.1)';
        }
    }

    document.getElementById('startBtn').onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите магазин'); return; }
        
        currentUserName = name;
        currentUserCity = city;
        currentScenario = 0;
        gameResults = [];
        
        document.getElementById('regScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        renderScenario();
    };

    document.getElementById('userName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('startBtn').click();
    });
</script>
