  const left = [];
  for (const r of backup) { try { await withTimeout(COL().add(r)); } catch (e) { left.push(r); } }
  try { localStorage.setItem('crosssell_backup', JSON.stringify(left)); } catch (e) {}
});

    say: { o: ['«Здравствуйте! Новинки вон там, на правой витрине, смотрите спокойно — я буду рядом»',
      '«Мария, рада вас видеть! У нас скидки на всё — можно сразу взять побольше»',
      '«Мария, рада вас видеть! Как носится кольцо? Давайте покажу серьги к нему»'], k: 2,
      ok: 'По имени, с вопросом о прошлой покупке и с конкретным предложением.',
      no: 'Формальное «смотрите» и «скидки на всё» — не про неё. Покажите, что помните: имя, кольцо, пара к нему.' } }
];

const money = n => n.toLocaleString('ru-RU') + ' ₽';
const shuffle = a => { const b = a.map((v, i) => [v, i]); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
let cur = 0, check = 0, results = [], userName = '', userCity = '', st = null;

const $ = id => document.getElementById(id);
function setCheck(v, bump) {
  check = v; const el = $('check'); el.textContent = '🧾 ' + money(v);
  if (bump) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 450); }
}
function head(s) {
  return `<div class="sit"><div class="ic">${s.i}</div><div><div class="t">${s.t}</div><div class="d">${s.d}</div></div></div>
    <div class="client"><small>Клиент</small>${s.c}</div>`;
}
function render() {
  const s = S[cur];
  st = { pickSel: null, sayOrder: shuffle(s.say.o) };
  $('stepLbl').textContent = `Покупатель ${cur + 1} из ${S.length}`;
  $('prog').style.width = (cur / S.length * 100) + '%';
  if (s.base) setCheck(check + s.base, false);
  const tiles = shuffle(s.pick.o).map(([[e, n], i]) => `<button class="tile" data-i="${i}"><span class="e">${e}</span>${n}</button>`).join('');
  $('area').innerHTML = head(s) + `<p class="q"><span>1/2</span> Что предложить?</p><div class="tiles">${tiles}</div><div id="fb1"></div>`;
  $('area').querySelectorAll('.tile').forEach(b => b.onclick = () => pick(+b.dataset.i));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pick(i) {
  const s = S[cur], ok = i === s.pick.k; st.pickSel = i;
  $('area').querySelectorAll('.tile').forEach(b => { const j = +b.dataset.i; b.disabled = true; b.classList.add(j === s.pick.k ? 'ok' : j === i ? 'no' : 'dim'); });
  $('fb1').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? '✅ Верно!' : '❌ Не то'}</b>${ok ? s.pick.ok : s.pick.no}</div><button class="btn next" id="toSay">Как сказать? →</button>`;
  $('toSay').onclick = sayStep;
}
function sayStep() {
  const s = S[cur], item = s.pick.o[s.pick.k];
  const opts = st.sayOrder.map(([t, i]) => `<button class="opt" data-i="${i}">${t}</button>`).join('');
  $('area').innerHTML = head(s) + `<div class="chosen">Предлагаем: ${item[0]} ${item[1]}</div><p class="q"><span>2/2</span> Как сказать?</p><div class="opts">${opts}</div><div id="fb2"></div>`;
  $('area').querySelectorAll('.opt').forEach(b => b.onclick = () => say(+b.dataset.i));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function say(i) {
  const s = S[cur], ok = i === s.say.k, pickOk = st.pickSel === s.pick.k, both = ok && pickOk;
  $('area').querySelectorAll('.opt').forEach(b => { const j = +b.dataset.i; b.disabled = true; b.classList.add(j === s.say.k ? 'ok' : j === i ? 'no' : 'dim'); });
  if (both) setCheck(check + s.add, true);
  const gain = both ? `<br><b style="margin-top:8px">🧾 +${money(s.add)} к чеку</b>` : (ok ? '<br>К чеку не добавилось — в первом шаге было другое предложение.' : '');
  $('fb2').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? '✅ Так и скажем!' : '❌ Клиент, скорее всего, откажется'}</b>${ok ? s.say.ok : s.say.no}${gain}</div>
    <button class="btn next" id="nx">${cur < S.length - 1 ? 'Следующий покупатель →' : 'Закрыть смену 🏁'}</button>`;
  results.push({
    scenario: s.t, icon: s.i, situation: s.d + ' Клиент: ' + s.c,
    pickCorrect: pickOk, phraseCorrect: ok, isCorrect: both, percent: (pickOk ? 50 : 0) + (ok ? 50 : 0),
    selectedPick: s.pick.o[st.pickSel][1], correctPick: s.pick.o[s.pick.k][1],
    selectedText: s.say.o[i], correctText: s.say.o[s.say.k], added: both ? s.add : 0
  });
  $('nx').onclick = () => { if (cur < S.length - 1) { cur++; render(); } else finish(); };
}
async function finish() {
  $('prog').style.width = '100%';
  const maxCheck = S.reduce((a, s) => a + s.base + s.add, 0);
  const pct = Math.round(results.reduce((a, r) => a + r.percent, 0) / S.length);
  const full = results.filter(r => r.isCorrect).length;
  const passed = pct >= 70;
  const weak = results.filter(r => !r.isCorrect);
  $('game').classList.add('hidden'); $('fin').classList.remove('hidden');
  $('fin').innerHTML = `<div style="font-size:44px">${passed ? '🏆' : '💪'}</div>
    <h1>${passed ? 'Сильная смена!' : 'Хорошее начало!'}</h1>
    <div class="of">Ваш чек за смену</div>
    <div class="big">${money(check)}</div>
    <div class="of">из возможных ${money(maxCheck)}</div>
    <div class="stats"><div><b>${full}/${S.length}</b><span>покупок собрано полностью</span></div><div><b>+${money(results.reduce((x, r) => x + r.added, 0))}</b><span>допродано</span></div><div><b>${pct}%</b><span>результат</span></div></div>
    <div class="rev">${results.map(r => `<div><span>${r.icon}</span><span>${r.scenario}</span><span>${r.isCorrect ? '✅' : r.percent ? '½' : '❌'}</span></div>`).join('')}</div>
    ${weak.length ? `<div class="tip"><b>💡 Запомните:</b> ${weak.slice(0, 2).map(r => r.correctText).join('<br>')}</div>` : `<div class="tip"><b>💡</b> Все покупки собраны. Попробуйте завтра так же в зале!</div>`}
    <div class="save" id="save">⏳ Сохраняю результат…</div>
    <button class="btn restart" onclick="location.reload()">🔄 Пройти ещё раз</button>`;
  const data = {
    id: Date.now(), type: 'crosssell', format: 'basket', user_name: userName, city: userCity,
    score: full, total: S.length, percent: pct, passed, check, max_check: maxCheck,
    scenarios: results, rules_applied: [...new Set(results.filter(r => r.isCorrect).map(r => r.correctPick))],
    date: new Date().toISOString(), timestamp: new Date().toLocaleString('ru-RU')
  };
  data.rules_count = data.rules_applied.length;
  try {
    await withTimeout(COL().add(data));
    $('save').textContent = '✅ Результат сохранён'; $('save').style.background = '#ecfdf5'; $('save').style.color = '#065f46';
  } catch (e) {
    try { const b = JSON.parse(localStorage.getItem('crosssell_backup') || '[]'); b.push(data); localStorage.setItem('crosssell_backup', JSON.stringify(b)); } catch (er) {}
    $('save').textContent = '⚠️ Нет связи — результат отправится при следующем открытии'; $('save').style.background = '#fef3c7'; $('save').style.color = '#92400e';
  }
}
$('startBtn').onclick = () => {
  const n = $('userName').value.trim(), c = $('userCity').value;
  if (!n) { $('regErr').textContent = 'Введите имя и фамилию'; return; }
  if (!c) { $('regErr').textContent = 'Выберите магазин'; return; }
  userName = n; userCity = c; cur = 0; check = 0; results = [];
  $('reg').classList.add('hidden'); $('game').classList.remove('hidden');
  setCheck(0, false); render();
};
$('userName').addEventListener('keydown', e => { if (e.key === 'Enter') $('startBtn').click(); });
</script>
</body>
</html>
