        },
        {
            title: "Постоянный клиент",
            situation: "Знакомая клиентка, которая покупала кольцо месяц назад, зашла в магазин.",
            clientPhrase: "«Здравствуйте! Решила заглянуть, посмотреть, что у вас новенького».",
            options: [
                { text: "«Здравствуйте! Да, вот новые коллекции, смотрите».", correct: false, explanation: "Формальный ответ без использования истории покупок." },
                { text: "«Здравствуйте, Мария! Рада вас видеть. Как вам кольцо, которое вы брали в прошлом месяце, носите с удовольствием? Кстати, к нему отлично подойдут новые браслеты из той же коллекции, давайте покажу?»", correct: true, explanation: "Персонализация, забота о предыдущей покупке и логичное предложение дополнения к уже купленному." },
                { text: "«Здравствуйте. У нас сегодня скидки 10%».", correct: false, explanation: "Слишком рекламный подход, игнорирующий личные отношения." }
            ]
        }
    ];

    // ========== 📖 РЕНДЕР СЦЕНАРИЯ ==========
    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        
        const progress = ((currentScenario) / SCENARIOS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        
        selectedOption = null;
        
        const scenarioArea = document.getElementById('scenarioArea');
        
        const situationHtml = `
            <div class="client-situation">
                <strong>💡 Ситуация:</strong>
                <p>${scenario.situation}</p>
            </div>
            <div class="message client">
                <div class="speaker">👤 Клиент говорит:</div>
                <div>${scenario.clientPhrase}</div>
            </div>
        `;
        
        let optionsHtml = '<div class="options-container">';
        scenario.options.forEach((option, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `
                <div class="option" data-idx="${idx}" onclick="selectOption(${idx}, this)">
                    <span class="option-label">${letter}</span>
                    ${option.text}
                </div>
            `;
        });
        optionsHtml += '</div>';
        
        scenarioArea.innerHTML = situationHtml + optionsHtml;
        
        const checkBtn = document.getElementById('checkBtn');
        checkBtn.textContent = '✅ Проверить';
        checkBtn.className = 'btn btn-primary';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;
        
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('saveStatus').textContent = '';
    }

    // ========== 🖱️ ВЫБОР ОПЦИИ ==========
    function selectOption(idx, element) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        
        element.classList.add('selected');
        selectedOption = idx;
        
        document.getElementById('checkBtn').disabled = false;
    }

    // ========== ✅ ПРОВЕРКА СЦЕНАРИЯ ==========
    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctOption = scenario.options.findIndex(opt => opt.correct);
        
        const options = document.querySelectorAll('.option');
        options.forEach((opt, idx) => {
            if (idx === correctOption) opt.classList.add('correct');
            if (idx === selectedOption && idx !== correctOption) opt.classList.add('wrong');
        });
        
        const isCorrect = selectedOption === correctOption;
        const percent = isCorrect ? 100 : 0;
        
        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${isCorrect ? 'success' : 'fail'}`;
        
        let html = `<h2>${isCorrect ? '🎉 Отлично!' : '⚠️ Есть над чем поработать'}</h2>`;
        html += `<p style="text-align: center; font-size: 18px; margin-bottom: 20px;">${isCorrect ? 'Вы выбрали лучшую фразу для допродажи!' : 'Этот вариант не совсем подходит для увеличения чека'}</p>`;
        
        html += '<div style="text-align: left; margin-top: 16px;">';
        if (isCorrect) {
            html += `<div class="explanation correct">
                <strong>✅ Правильно!</strong>
                <p>${scenario.options[selectedOption].explanation}</p>
            </div>`;
        } else {
            html += `<div class="explanation wrong">
                <strong>❌ Почему это неправильно:</strong>
                <p>${scenario.options[selectedOption].explanation}</p>
                <div class="explanation correct" style="margin-top: 12px;">
                    <strong>✅ Лучший вариант:</strong>
                    <p>${scenario.options[correctOption].text}</p>
                    <p style="margin-top: 8px;">${scenario.options[correctOption].explanation}</p>
                </div>
            </div>`;
        }
        html += '</div>';
        
        resultCard.innerHTML = html;
        
        gameResults.push({
            scenario: scenario.title,
            selectedOption: selectedOption,
            correctOption: correctOption,
            isCorrect: isCorrect,
            percent: percent
        });
        
        const checkBtn = document.getElementById('checkBtn');
        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn btn-next';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                currentScenario++;
                renderScenario();
            };
        } else {
            checkBtn.textContent = '🏁 Завершить игру';
            checkBtn.className = 'btn btn-finish';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                finishGame();
            };
        }
    }

    // ========== 🏁 ЗАВЕРШЕНИЕ ИГРЫ ==========
    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.percent, 0);
        const avgPercent = Math.round(totalScore / SCENARIOS.length);
        
        const resultData = {
            id: Date.now(),
            type: 'crosssell',
            user_name: currentUserName,
            city: currentUserCity,
            score: totalScore,
            total: SCENARIOS.length * 100,
            percent: avgPercent,
            passed: avgPercent >= 70,
            scenarios: gameResults,
            date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        const scenarioArea = document.getElementById('scenarioArea');
        scenarioArea.innerHTML = `
            <div class="final-screen">
                <h2>🎉 Игра завершена!</h2>
                <div class="result-big">${avgPercent}%</div>
                <p>Правильных ответов: <strong>${gameResults.filter(r => r.isCorrect).length} из ${SCENARIOS.length}</strong></p>
                <p style="margin-top: 24px; font-size: 20px;">${avgPercent >= 70 ? '✅ Отличный результат! Вы мастерски владеете техникой допродаж.' : '⚠️ Рекомендуем повторить тренажёр и изучить стандарты допродаж.'}</p>
                <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 32px; max-width: 300px;">🔄 Пройти ещё раз</button>
            </div>
        `;
        
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('checkBtn').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
        
        const statusDiv = document.getElementById('saveStatus');
        statusDiv.textContent = '⏳ Сохранение...';
        statusDiv.style.color = '#d97706';
        
        try {
            const localBackup = JSON.parse(localStorage.getItem('crosssell_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('crosssell_backup', JSON.stringify(localBackup));
            
            const newRef = db.ref('results/crosssell').push();
            await newRef.set(resultData);
            
            const backup = JSON.parse(localStorage.getItem('crosssell_backup') || '[]');
            const filtered = backup.filter(r => r.id !== resultData.id);
            localStorage.setItem('crosssell_backup', JSON.stringify(filtered));
            
            statusDiv.textContent = '✅ Результат сохранён!';
            statusDiv.style.color = '#10b981';
        } catch(e) {
            statusDiv.textContent = '⚠️ Сохранено локально';
            statusDiv.style.color = '#ef4444';
        }
    }
</script>

</body>
</html>
