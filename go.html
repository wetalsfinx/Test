<body>
<div class="wrap">

<script src="stores.js"></script>
<script>
// Расписание. Даты включительно (ГГГГ-ММ-ДД). Меняется только здесь (и в SCHED дашборда).
// col — коллекция результатов в базе (если тренажёр их сохраняет), чтобы отметить «✅ пройдено».
const T = [
  { n: 'Входной тест', u: 'test_new.html', i: '📝', d: '13 ситуаций из зала. Не экзамен — диагностика.', m: 10, from: '2026-10-01', to: '2026-10-05', col: 'test' },
  { n: 'Тренировка диалога', u: 'dialog_trainer.html', i: '💬', d: 'Живой разговор с клиентом: доведите до покупки.', m: 6, from: '2026-10-07', to: '2026-10-14', col: 'dialog' },
  { n: 'Сервис с человеческим лицом', u: 'service_trainer.html', i: '🤝', d: '16 ситуаций: хорошо или плохо поступил продавец?', m: 5, from: '2026-10-12', to: '2026-10-19', col: 'service' },
  { n: 'Собери покупку', u: 'crosssell_trainer.html', i: '🛍️', d: 'Клиент выбрал украшение. Что предложить к нему и как сказать?', m: 5, from: '2026-10-16', to: '2026-10-23', col: 'crosssell' },
  { n: 'Сценка «Дорого»', u: 'dorogo_trainer.html', i: '🎬', d: 'Выберите ответ продавца — у сценки 5 концовок.', m: 5, from: '2026-10-20', to: '2026-10-27' },
  { n: 'Найди ошибку в диалоге', u: 'error_finder.html', i: '🔍', d: 'Нажмите на фразу, где продавец ошибся.', m: 7, from: '2026-10-22', to: '2026-10-29', col: 'errorfinder' },
  { n: 'Аттестация «Одна смена»', u: 'attestation.html', i: '🏆', d: '9 клиентов, ответы своими словами, именной сертификат.', m: 25, from: '2026-10-28', to: '2026-11-02', col: 'final_exam' },
  { n: 'Лайфхаки', u: 'lifehacks.html', i: '💡', d: 'Повторение приёмов перед аттестацией.', m: 5, from: '2026-10-28', to: '2026-11-02', extra: 1 }
];
const KEY = 'AIzaSyACk392rDmGmYxaC1uqQqMsRvjOaYKgpTc';
const BASE = 'https://firestore.googleapis.com/v1/projects/gold-8105a/databases/(default)/documents/results/';
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const fmt = d => d.getDate() + ' ' + MON[d.getMonth()];
const left = t => Math.round((day(t.to) - today) / 864e5);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
$('today').textContent = 'Сегодня ' + WD[now.getDay()] + ', ' + fmt(now);

const open = T.filter(t => day(t.from) <= today && today <= day(t.to))
  .sort((a, b) => (a.extra || 0) - (b.extra || 0) || day(a.to) - day(b.to));

// Имя: без отчества, без регистра; «Анна Иванова» = «Иванова Анна»
const toks = s => String(s || '').toLowerCase().replace(/ё/g, 'е').split(/[\s.,]+/).filter(w => w.length > 1 && !/(вна|вич|ична)$/.test(w));
// одна опечатка в длинном слове не мешает: «Шасварова» = «Шасворова»
function lev1(a, b) {
  if (a === b) return true; if (Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 5) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++d > 1) return false; if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } }
  return d + (a.length - i) + (b.length - j) <= 1;
}
function sameName(a, b) {
  const x = toks(a), y = toks(b); if (!x.length || !y.length) return false;
  const [s, l] = x.length <= y.length ? [x, y] : [y, x];
  if (!s.every(w => l.some(v => lev1(w, v)))) return false;
  return s.length >= 2 || x.length === y.length;
}
async function myResults(col, me) {
  const out = []; let tok = '';
  do {
    const r = await fetch(BASE + col + '/items?pageSize=300&key=' + KEY + (tok ? '&pageToken=' + tok : ''));
    const j = await r.json(); if (j.error) throw new Error(j.error.message);
    (j.documents || []).forEach(d => {
      const f = d.fields || {}, v = k => f[k] ? (f[k].stringValue ?? f[k].integerValue ?? f[k].doubleValue) : null;
      const nm = v('user_name'), c = v('city');
      if (c === me.city && sameName(nm, me.name)) out.push({ p: +v('percent') || 0 });
      else if (toks(nm).length >= 2 && toks(me.name).length >= 2 && sameName(nm, me.name)) out.push({ p: +v('percent') || 0, city: c });
    });
    tok = j.nextPageToken;
  } while (tok);
  return out;
}
function card(t, k, big) {
  const l = left(t);
  const pills = [
    k === 0 && big ? '<span class="pill top1">Сначала этот</span>' : '',
    l === 0 ? '<span class="pill hot">Сегодня последний день</span>' : `<span class="pill ${l <= 2 ? 'warn' : ''}">до ${fmt(day(t.to))} · ${l === 1 ? 'остался 1 день' : 'осталось ' + plural(l, 'день', 'дня', 'дней')}</span>`,
    `<span class="pill">~${t.m} мин</span>`
  ].join('');
  return `<a class="card ${k === 0 && big ? 'first' : ''} ${big ? '' : 'small'}" href="${t.u}" data-u="${t.u}"><div class="top"><div class="ic">${t.i}</div><div><div class="nm">${t.n}</div>${big ? `<div class="ds">${t.d}</div>` : ''}</div></div><div class="meta">${pills}</div>${big ? '<span class="go">Начать →</span>' : ''}</a>`;
}
async function draw() {
  const me = ls.get('go585_me');
  if (!me) { $('conf').classList.add('hidden'); $('chgBox').classList.add('hidden'); $('warn').innerHTML = ''; $('reg').classList.remove('hidden'); $('who').classList.add('hidden'); $('list').innerHTML = ''; return; }
  $('reg').classList.add('hidden');
  $('who').classList.remove('hidden');
  $('conf').classList.add('hidden'); $('chgBox').classList.add('hidden'); $('warn').innerHTML = '';
  $('who').innerHTML = `<div class="av">👤</div><div class="wn"><b>${esc(me.name)}</b><span>🏬 ${esc(me.city)}</span></div><div class="wb"><button id="chgStore">Другой магазин</button><button id="chg">Это не я</button></div>`;
  $('chg').onclick = () => { try { localStorage.removeItem('go585_me'); localStorage.removeItem('go585_self'); localStorage.removeItem('go585_opened'); } catch (e) {} draw(); };
  $('chgStore').onclick = () => { fillSel($('chgCity'), me.city); $('chgBox').classList.toggle('hidden'); };
  if (!open.length) { $('list').innerHTML = `<div class="all"><div class="e">🎉</div><h2>${today > day(T[T.length - 1].to) ? 'Обучение этого месяца завершено' : 'Сейчас открытых тренажёров нет'}</h2><p>Спасибо!</p></div>`; return; }
  $('list').innerHTML = '<div class="load">⏳ Проверяю, что вы уже прошли…</div>';
  const opened = ls.get('go585_opened') || {};
  const status = await Promise.all(open.map(async t => {
    if (!t.col) return { t, done: !!opened[t.u] || !!(ls.get('go585_self') || {})[t.u], pct: null, local: true };
    const mine = (ls.get('go585_self') || {})[t.u];
    try { const r = await myResults(t.col, me); if (!r.length && mine) return { t, done: true, pct: null, self: true }; const here = r.filter(x => !x.city), use = here.length ? here : r; return { t, done: r.length > 0, pct: r.length ? Math.max(...use.map(x => x.p)) : null, other: here.length ? null : (r[0] && r[0].city) }; }
    catch (e) { return { t, done: !!mine, pct: null, self: !!mine, err: true }; }
  }));
  // Все найденные прохождения — в другом магазине? Возможно, магазин выбран неверно
  const others = [...new Set(status.filter(s => s.other).map(s => s.other))], anyHere = status.some(s => s.done && !s.other && !s.local && !s.self);
  if (others.length === 1 && !anyHere) {
    const o = others[0];
    $('warn').innerHTML = `<div class="warnbox">⚠️ <b>Проверьте магазин.</b> Здесь выбран <b>${esc(me.city)}</b>, а ваши прохождения записаны в магазине <b>${esc(o)}</b>. В каком магазине вы работаете?<div class="wbtns"><button class="main" id="wOther">${esc(o)}</button><button id="wHere">${esc(me.city)} — меня перевели</button></div></div>`;
    $('wOther').onclick = () => { ls.set('go585_me', { name: me.name, city: o }); draw(); };
    $('wHere').onclick = () => { ls.set('go585_ok_' + me.city, 1); $('warn').innerHTML = ''; };
    if (ls.get('go585_ok_' + me.city)) $('warn').innerHTML = '';
  }
  const todo = status.filter(s => !s.done), done = status.filter(s => s.done);
  let html = '';
  if (todo.length) {
    html += `<div class="sec">${todo.length === 1 ? 'Вам осталось пройти' : 'Вам осталось · ' + todo.length}</div>`;
    html += card(todo[0].t, 0, true);
    if (todo.length > 1) html += '<div class="sec">Потом</div>' + todo.slice(1).map(s => card(s.t, 1, false)).join('');
    html += `<p class="note" style="margin-top:4px">Уже проходили, а здесь не отмечено? ${todo.map(s => `<button class="selfbtn" data-u="${s.t.u}">${s.t.n} — я прошёл(а)</button>`).join(' ')}</p>`;
  } else {
    html += `<div class="all"><div class="e">🎉</div><h2>Всё открытое пройдено!</h2><p>Отличная работа. Новое задание придёт в письме.</p></div>`;
  }
  if (done.length) html += '<div class="sec">Уже пройдено</div>' + done.map(s => `<div class="done">${s.local ? '👀' : s.self ? '👌' : '✅'} <b>${s.t.n}${s.pct != null ? ' · ' + s.pct + '%' : ''}${s.local ? ' · открывали' : ''}${s.self ? ' · отмечено вами' : ''}${s.other ? ' · в магазине ' + esc(s.other) : ''}</b><a href="${s.t.u}">ещё раз</a></div>`).join('');
  $('list').innerHTML = html;
  $('list').querySelectorAll('.selfbtn').forEach(b => b.onclick = () => { const o = ls.get('go585_self') || {}; o[b.dataset.u] = 1; ls.set('go585_self', o); draw(); });
  $('list').querySelectorAll('a.card').forEach(a => a.addEventListener('click', () => { const o = ls.get('go585_opened') || {}; o[a.dataset.u] = 1; ls.set('go585_opened', o); }));
}
$('saveBtn').onclick = () => {
  const n = $('userName').value.trim(), c = $('userCity').value;
  if (toks(n).length < 2) { $('regErr').textContent = 'Нужно имя и фамилия — два слова, как в тренажёрах'; return; }
  if (!c) { $('regErr').textContent = 'Выберите магазин'; return; }
  $('regErr').textContent = '';
  $('confName').textContent = '👤 ' + n.replace(/\s+/g, ' ');
  $('confCity').textContent = '🏬 Магазин: ' + c;
  $('reg').classList.add('hidden'); $('conf').classList.remove('hidden');
};
$('confYes').onclick = () => { ls.set('go585_me', { name: $('userName').value.trim().replace(/\s+/g, ' '), city: $('userCity').value }); draw(); };
$('confNo').onclick = () => { $('conf').classList.add('hidden'); $('reg').classList.remove('hidden'); $('userCity').focus(); };
function fillSel(sel, cur) { if (sel.options.length < 2) (window.STORES_585 || []).forEach(s => { const o = document.createElement('option'); o.value = o.textContent = s; sel.appendChild(o); }); sel.value = cur || ''; }
$('chgSave').onclick = () => { const me = ls.get('go585_me'), c = $('chgCity').value; if (!me || !c) return; ls.set('go585_me', { name: me.name, city: c }); draw(); };
$('userName').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveBtn').click(); });
// Подсказка имён: кто из этого магазина уже есть в базе (по входному тесту и тренажёрам)
$('userCity').addEventListener('change', async () => {
  const c = $('userCity').value, seen = new Map(); $('names').innerHTML = ''; if (!c) return;
  for (const col of ['test', 'dialog', 'service', 'crosssell']) {
    try {
      const r = await fetch(BASE + col + '/items?pageSize=300&key=' + KEY); const j = await r.json();
      (j.documents || []).forEach(d => { const f = d.fields || {}; if (f.city?.stringValue !== c) return; const n = String(f.user_name?.stringValue || '').trim().replace(/\s+/g, ' '); const k = toks(n).sort().join(' '); if (toks(n).length >= 2 && !seen.has(k)) seen.set(k, n); });
    } catch (e) {}
  }
  $('names').innerHTML = [...seen.values()].sort().map(n => `<option value="${esc(n)}">`).join('');
});
// Страница долго висела во вкладке (или телефон показал сохранённую копию) — перезагрузить,
// чтобы список тренажёров был на сегодня и по свежему расписанию
const LOADED = Date.now(), LOADED_DAY = new Date().toDateString();
function stale() { return Date.now() - LOADED > 10 * 60 * 1000 || new Date().toDateString() !== LOADED_DAY; }
window.addEventListener('pageshow', e => { if (e.persisted && stale()) location.reload(); });
