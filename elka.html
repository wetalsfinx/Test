<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>585GOLD · Ёлка тренинга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#b3122e;--red2:#d61f3f;--bord:#340c16;--night:#0e080c;--gold:#e6be6a;--gold2:#f7e2a8;--cream:#faf6f0;--muted:#c9b7a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Onest,system-ui,sans-serif;color:var(--cream);background:radial-gradient(90% 80% at 35% 20%,#4a1020 0%,#23080f 50%,var(--night) 100%)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr 1fr;height:100vh;padding:2.5vh 3vw;gap:3vw}
.left{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#tree{height:96vh;max-width:100%}
.right{display:flex;flex-direction:column;justify-content:center;min-height:0;gap:2.2vh}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:var(--red);color:#fff;font-family:Unbounded;font-weight:800;border-radius:14px;padding:9px 13px;line-height:.95;font-size:2.1vh;text-align:center;box-shadow:0 0 26px rgba(214,31,63,.55)}
.logo small{display:block;font-size:1.15vh;letter-spacing:2px;font-weight:600}
.brand .t{font-size:1.9vh;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
h1{font-family:Unbounded;font-weight:800;font-size:4.6vh;line-height:1.1;margin:0;background:linear-gradient(180deg,#fff 0%,var(--gold2) 55%,var(--gold) 100%);-webkit-background-clip:text;color:transparent}
.count{display:flex;align-items:baseline;gap:14px}
.count b{font-family:Unbounded;font-size:9vh;line-height:1;color:var(--gold2);text-shadow:0 0 30px rgba(230,190,106,.5)}
.count span{font-size:2.4vh;color:var(--muted);line-height:1.35}
.qrbox{display:flex;gap:2vw;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(230,190,106,.25);border-radius:22px;padding:2vh}
.qrbox img{width:25vh;height:25vh;background:#fff;border-radius:16px;padding:1vh;flex:none}
.qrbox p{margin:0;font-size:2.3vh;line-height:1.4}
.qrbox p b{color:var(--gold2)}
.feed{display:flex;flex-direction:column;gap:1vh;min-height:16vh}
.feed div{font-size:2.3vh;padding:1vh 1.4vh;border-radius:12px;background:rgba(230,190,106,.08);border-left:3px solid var(--gold);animation:fin .6s ease}
.feed div small{color:var(--muted);font-size:1.7vh;margin-left:8px}
@keyframes fin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.allin{display:none;font-family:Unbounded;font-size:3vh;color:var(--gold2);text-align:center;padding:1.4vh;border-radius:16px;background:linear-gradient(135deg,rgba(214,31,63,.5),rgba(179,18,46,.3));box-shadow:0 0 40px rgba(230,190,106,.3)}
.allin.on{display:block;animation:fin .8s}
/* всплывашка */
.toast{position:fixed;left:30%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:5;opacity:0;pointer-events:none;font-family:Unbounded;font-weight:800;font-size:4.8vh;color:#fff;text-align:center;padding:3vh 5vh;border-radius:28px;background:linear-gradient(135deg,rgba(214,31,63,.95),rgba(120,10,30,.95));box-shadow:0 0 80px rgba(230,190,106,.55),0 0 0 3px rgba(230,190,106,.6);white-space:nowrap}
.toast small{display:block;font:500 2.2vh Onest;color:var(--gold2);margin-top:1vh}
.toast.on{animation:toast 3.6s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}16%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
/* панель */
.bar{position:fixed;left:14px;bottom:12px;z-index:3;display:flex;gap:8px;opacity:.35;transition:.3s}
.bar:hover{opacity:1}
.bar button{background:rgba(0,0,0,.4);border:1px solid rgba(230,190,106,.35);color:var(--cream);border-radius:10px;padding:7px 11px;font:500 13px Onest;cursor:pointer}
.bar button.on{background:var(--red);border-color:var(--red)}
.st{position:fixed;right:14px;bottom:12px;z-index:3;font-size:12px;color:var(--muted);opacity:.5}
/* огоньки */
.bulbOff{fill:#3d3135;stroke:#6b5a3a;stroke-width:1}
.lab{font:700 19px Onest;fill:var(--cream);paint-order:stroke;stroke:#1a0a10;stroke-width:4px;stroke-linejoin:round}
.lit{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.78}}
.new{animation:popb 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes popb{0%{transform:scale(0)}100%{transform:scale(1)}}
#star{transition:filter 1s, opacity 1s}
/* список */
.ov{position:fixed;inset:0;z-index:10;background:rgba(10,4,8,.88);display:none;align-items:center;justify-content:center}
.ov.on{display:flex}
.panel{background:var(--cream);color:#2a1418;border-radius:20px;width:min(980px,94vw);max-height:90vh;overflow:auto;padding:24px 28px}
.panel h2{font-family:Unbounded;font-size:22px;margin:0 0 4px;color:var(--bord)}
.panel .sub{color:#7a6a62;margin-bottom:14px}
.panel table{width:100%;border-collapse:collapse;font-size:15px}
.panel th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8a7a6a;border-bottom:2px solid #e8dccb;padding:8px 6px}
.panel td{padding:9px 6px;border-bottom:1px solid #eee3d4}
.panel tr.no td{color:#a0928a}
.ok{color:#1f7a3a;font-weight:600}
.pb{display:flex;gap:10px;margin:16px 0 0;flex-wrap:wrap}
.pb button{border:0;border-radius:12px;padding:11px 16px;font:600 15px Onest;cursor:pointer}
.pb .g{background:var(--red);color:#fff}
.pb .s{background:#eadfce;color:#3a2a20}
.un{border:0;background:#f3e6d6;color:#8a3a3a;border-radius:8px;padding:3px 8px;font:500 12px Onest;cursor:pointer;margin-left:6px}.un.sure{background:#b3122e;color:#fff}
.tag{display:inline-block;font-size:11px;background:#fde9c8;color:#8a5a10;border-radius:6px;padding:1px 6px;margin-left:6px}

/* телефон вертикально */
@media (orientation:portrait){
  html,body{overflow:auto;height:auto}
  .stage{display:flex;flex-direction:column;height:auto;padding:16px;gap:14px}
  .left{order:2}
  #tree{height:auto;width:100%;max-height:none}
  .right{order:1;gap:12px}
  .logo{font-size:15px;padding:7px 10px}.logo small{font-size:9px}
  .brand .t{font-size:12px}
  h1{font-size:26px}
  .count b{font-size:54px}.count span{font-size:15px}
  .qrbox{flex-direction:column;text-align:center;padding:16px}
  .qrbox img{width:min(74vw,330px);height:min(74vw,330px)}
  .qrbox p{font-size:16px}
  .feed{min-height:0}
  .feed div{font-size:15px}.feed div small{font-size:12px}
  .allin{font-size:18px}
  .toast{left:50%;top:40%;font-size:24px;padding:18px 22px;white-space:normal;width:86vw}
  .toast small{font-size:14px}
  .bar{position:static;margin:0 16px 24px;opacity:.9;flex-wrap:wrap;justify-content:center}
  .bar button{font-size:12px;padding:6px 8px}
  .st{display:none}
  .lab{font-size:22px}
  .panel{padding:16px;font-size:13px}.panel table{font-size:13px}
}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const TEST = /[?&]test=1/.test(location.search);
let day = regDefaultDay(), recs = [], seen = new Set(), first = true, sound = false;
$('sub').textContent = REG.title + ' · ' + REG.city;

/* ---------- снег ---------- */
(function snow(){
  const c = $('snow'), x = c.getContext('2d'); let W, H, f = [];
  function rs(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  rs(); addEventListener('resize', rs);
  for (let i = 0; i < 110; i++) f.push({ x: Math.random(), y: Math.random(), r: Math.random() * 2.6 + .6, s: Math.random() * .0011 + .0004, w: Math.random() * 6.28 });
  (function loop(){
    x.clearRect(0, 0, W, H);
    for (const p of f) {
      p.y += p.s; p.w += .008; if (p.y > 1.02) { p.y = -.02; p.x = Math.random(); }
      x.beginPath(); x.arc((p.x + Math.sin(p.w) * .012) * W, p.y * H, p.r, 0, 6.28);
      x.fillStyle = p.r > 2.4 ? 'rgba(247,226,168,.7)' : 'rgba(255,255,255,.55)'; x.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ---------- ёлка ---------- */
const NS = 'http://www.w3.org/2000/svg';
const CX = 300, TOP = 95, BOT = 690;
function halfW(y){ // ширина ёлки по ярусам
  const tiers = [[95, 250, 20, 130], [215, 420, 60, 200], [370, 560, 90, 250], [510, 690, 120, 290]];
  let w = 0; for (const [a, b, w0, w1] of tiers) if (y >= a && y <= b) w = Math.max(w, w0 + (w1 - w0) * (y - a) / (b - a));
  return w;
}
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
const svg = $('tree');
function drawTree(){
  svg.innerHTML = '';
  const defs = el('defs', {});
  defs.innerHTML = `
  <linearGradient id="gT" x1="0" x2="1"><stop offset="0" stop-color="#0d3b2a"/><stop offset=".5" stop-color="#17604a"/><stop offset="1" stop-color="#0a3022"/></linearGradient>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#f7e2a8" stop-opacity=".9"/><stop offset="1" stop-color="#f7e2a8" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>`;
  // ствол и подставка
  el('rect', { x: CX - 28, y: 680, width: 56, height: 50, rx: 6, fill: '#5a3420' });
  el('path', { d: `M${CX - 80} 728 h160 l-14 48 h-132 z`, fill: '#b3122e', stroke: '#e6be6a', 'stroke-width': 2 });
  el('path', { d: `M${CX - 80} 744 h160`, stroke: '#e6be6a', 'stroke-width': 2, opacity: .6 });
  // ярусы
  const tiers = [[95, 250, 20, 130], [215, 420, 60, 200], [370, 560, 90, 250], [510, 690, 120, 290]];
  for (const [a, b, w0, w1] of tiers.slice().reverse()) {
    const n = 7, pts = [];
    pts.push(`M${CX - w0} ${a}`);
    pts.push(`L${CX - w1} ${b - 10}`);
    for (let i = 0; i <= n; i++) { const x = CX - w1 + 2 * w1 * i / n; pts.push(`Q${x - w1 / n} ${b + 14} ${x} ${b - 10}`); }
    pts.push(`L${CX + w0} ${a} Z`);
    el('path', { d: pts.join(' ').replace(`Q${CX - w1 - w1 / n} ${b + 14} ${CX - w1} ${b - 10}`, ''), fill: 'url(#gT)', stroke: '#e6be6a', 'stroke-opacity': .35, 'stroke-width': 1.5 });
  }
  // гирлянды-провода
  wires = [];
  GARL.forEach(g => {
    const p = []; for (let t = 0; t <= 1.0001; t += .05) p.push(gpt(g, t));
    el('path', { d: 'M' + p.map(q => q.x.toFixed(1) + ' ' + q.y.toFixed(1)).join(' L'), stroke: '#c9a35a', 'stroke-opacity': .55, 'stroke-width': 1.6, fill: 'none' });
  });
  // звезда
  const st = el('g', { id: 'star', transform: `translate(${CX} ${TOP - 28})` });
  el('circle', { r: 46, fill: 'url(#gGlow)', id: 'starGlow', opacity: 0 }, st);
  const sp = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 15 : 36, a = -Math.PI / 2 + i * Math.PI / 5; sp.push((r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1)); }
  el('polygon', { points: sp.join(' '), fill: '#7a6a4a', stroke: '#e6be6a', 'stroke-width': 2, id: 'starP' }, st);
  layer = el('g', {});
}
let wires = [], layer;
// гирлянды: базовая высота y, провис, наклон
const GARL = [ { y: 175, sag: 26, k: -14 }, { y: 300, sag: 34, k: 18 }, { y: 430, sag: 40, k: -20 }, { y: 560, sag: 46, k: 22 }, { y: 655, sag: 22, k: -12 } ];
function gpt(g, t){
  const y0 = g.y + g.k * (t - .5) * 2, w = halfW(y0) - 14;
  return { x: CX + (t - .5) * 2 * w, y: y0 + g.sag * Math.sin(Math.PI * t) };
}
function slots(n){
  // равномерно раскладываем n огоньков по гирляндам (больше — на нижних)
  const weights = GARL.map(g => halfW(g.y)); const tot = weights.reduce((a, b) => a + b, 0);
  let cnt = weights.map(w => Math.max(1, Math.round(n * w / tot)));
  let diff = n - cnt.reduce((a, b) => a + b, 0), i = cnt.length - 2;
  while (diff !== 0) { const j = ((i % cnt.length) + cnt.length) % cnt.length; if (diff > 0) { cnt[j]++; diff--; } else if (cnt[j] > 1) { cnt[j]--; diff++; } i--; }
  const out = [];
  GARL.forEach((g, gi) => { const c = cnt[gi]; for (let k = 0; k < c; k++) { const t = (k + .5) / c * .86 + .07; out.push(Object.assign(gpt(g, t), { row: gi })); } });
  return out;
}
const COLS = ['#ff4d6d', '#ffd166', '#f7e2a8', '#7ee3ff', '#ff8fab', '#b8f2a6', '#ffffff', '#ffb347'];

/* ---------- данные ---------- */
function listFor(d){ return REG.people.filter(p => p.d === d); }
function norm(s){ return (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я ]/g, '').replace(/\s+/g, ' ').trim(); }
function arrivals(d){
  const list = listFor(d), out = [], keys = new Set();
  const cancelled = new Set(recs.filter(r => r.cancel).map(r => r.cancel));
  const rs = recs.filter(r => !r.cancel && r.user_name && !cancelled.has(r._id) && r.day === d && r.event === REG.event && (TEST || !/тест/i.test(r.user_name))).sort((a, b) => a.date < b.date ? -1 : 1);
  for (const r of rs) {
    let pid = r.pid;
    if (!pid) { // ручной ввод — может совпасть со списком (фамилия + инициал)
      const n = norm(r.user_name).split(' ');
      const m = REG.people.find(p => { const q = norm(p.n).split(' '); return q[0] === n[0] && (!n[1] || q[1] === n[1][0]); });
      if (m) pid = m.id;
    }
    const key = pid || norm(r.user_name);
    if (keys.has(key)) { out.find(o => o.key === key).ids.push(r._id); continue; } keys.add(key);
    out.push(Object.assign({}, r, { pid: pid || '', key, ids: [r._id] }));
  }
  return out;
}
async function load(){
  try {
    let all = [], tok = '';
    do {
      const r = await fetch(REG_DB.BASE + '?pageSize=300&key=' + REG_DB.KEY + (tok ? '&pageToken=' + tok : ''), { cache: 'no-store' });
      const j = await r.json(); (j.documents || []).forEach(d => { const o = {}; for (const k in d.fields) { const v = d.fields[k]; o[k] = v.stringValue ?? v.booleanValue ?? v.integerValue ?? ''; } o._id = d.name.split('/').pop(); all.push(o); });
      tok = j.nextPageToken || '';
    } while (tok);
    recs = all;
    $('st').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU').slice(0, 5) + (TEST ? ' · тест' : '');
    render();
  } catch (e) { $('st').textContent = 'нет связи — пробую ещё раз'; }
}

/* ---------- отрисовка ---------- */
let lastKey = '';
function render(){
  const list = listFor(day), arr = arrivals(day);
  const extra = arr.filter(a => !list.some(p => p.id === a.pid));
  const n = Math.max(list.length + extra.length, 6);
  const key = day + '|' + arr.map(a => a.key).join(',') + '|' + n;
  if (key === lastKey) return; lastKey = key;
  const ak = new Set(arr.map(a => a.key));
  if ([...seen].some(k => !ak.has(k))) { seen = new Set([...seen].filter(k => ak.has(k))); $('feed').innerHTML = ''; arr.slice(-4).forEach(a => feedAdd(a)); }
  const pos = slots(n);
  // порядок мест: участники из списка — по своим местам, остальные — следом
  const order = list.map(p => ({ p, a: arr.find(a => a.pid === p.id) })).concat(extra.map(a => ({ p: null, a })));
  // перемешиваем места детерминированно, чтобы огоньки зажигались по всей ёлке
  const idx = pos.map((_, i) => i).sort((a, b) => ((a * 7919) % 13) - ((b * 7919) % 13));
  layer.innerHTML = '';
  let lit = 0;
  order.forEach((o, i) => {
    const q = pos[idx[i] ?? i]; if (!q) return;
    const g = el('g', { transform: `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})` }, layer);
    el('rect', { x: -5, y: -19, width: 10, height: 8, rx: 1.5, fill: '#8a7448' }, g);
    if (o.a) {
      lit++;
      const c = COLS[i % COLS.length];
      const inner = el('g', { class: 'lit' + (!first && !seen.has(o.a.key) ? ' new' : '') }, g);
      inner.style.animationDelay = (i % 5) * .45 + 's';
      el('circle', { r: 34, fill: c, opacity: .4, filter: 'url(#blur)' }, inner);
      el('ellipse', { rx: 12, ry: 15, fill: c, stroke: '#fff', 'stroke-opacity': .6, 'stroke-width': 1 }, inner);
      el('ellipse', { cx: -4, cy: -5, rx: 3.5, ry: 5, fill: '#fff', opacity: .75 }, inner);
      const sur = o.a.user_name.split(' ')[0];
      const t = el('text', { class: 'lab', y: 38, 'text-anchor': 'middle' }, inner); t.textContent = sur;
      if (!first && !seen.has(o.a.key)) { announce(o.a); chime(); }
      seen.add(o.a.key);
    } else {
      el('ellipse', { rx: 11, ry: 14, class: 'bulbOff' }, g);
    }
  });
  const wait = list.filter(p => !arr.some(a => a.pid === p.id)).length;
  $('cnt').textContent = lit;
  $('cntTxt').innerHTML = plural(lit, 'огонёк горит', 'огонька горят', 'огоньков горит') + (wait ? '<br>ждём ещё ' + wait : '');
  const all = list.length > 0 && list.every(p => arr.some(a => a.pid === p.id));
  $('allin').classList.toggle('on', all);
  $('starP').setAttribute('fill', all ? '#ffd166' : '#7a6a4a');
  $('starGlow').setAttribute('opacity', all ? 1 : 0);
  if (first) { // при первом открытии — последние в ленту, без вспышек
    $('feed').innerHTML = ''; arr.slice(-4).forEach(a => feedAdd(a));
  }
  first = false;
  if ($('ov').classList.contains('on')) openList();
}
function plural(n, a, b, c){ const m = n % 10, h = n % 100; return (m === 1 && h !== 11) ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? b : c; }
function feedAdd(a){
  const d = document.createElement('div');
  d.innerHTML = '✨ <b>' + esc(a.user_name) + '</b><small>' + esc(a.store || '') + '</small>';
  $('feed').prepend(d); while ($('feed').children.length > 4) $('feed').lastChild.remove();
}
function announce(a){
  feedAdd(a);
  const t = $('toast'); t.innerHTML = '✨ ' + esc(a.user_name) + '<small>' + esc(a.store || '') + '</small>';
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- звук ---------- */
let AC;
function chime(){
  if (!sound) return;
  try {
    AC = AC || new AudioContext();
    [1318.5, 1760, 2093].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .11;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .9);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 1);
    });
  } catch (e) {}
}

/* ---------- панель ---------- */
function renderBar(){
  $('bar').innerHTML = REG.days.map(d => `<button class="${d.d === day ? 'on' : ''}" onclick="setDay('${d.d}')">${d.label}</button>`).join('') +
    `<button onclick="openList()">📋 Список</button><button onclick="toggleFs()">⛶ На весь экран</button><button class="${sound ? 'on' : ''}" onclick="sound=!sound;renderBar();chime()">${sound ? '🔔 Звук' : '🔕 Звук'}</button>`;
}
function setDay(d){ day = d; first = true; seen = new Set(); lastKey = ''; renderBar(); render(); }
function toggleFs(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

/* ---------- список для отчёта ---------- */
function rows(){
  const list = listFor(day), arr = arrivals(day), out = [];
  list.forEach(p => { const a = arr.find(x => x.pid === p.id); out.push({ n: p.n, r: p.r, s: REG.stores[p.s], t: a ? time(a.date) : '', ok: !!a, extra: false, ids: a ? a.ids : [] }); });
  arr.filter(a => !list.some(p => p.id === a.pid)).forEach(a => {
    const p = REG.people.find(x => x.id === a.pid);
    out.push({ n: p ? p.n : a.user_name, r: p ? p.r : a.role, s: p ? REG.stores[p.s] : a.store, t: time(a.date), ok: true, extra: true, why: p ? 'по списку — на другой день' : 'нет в списке', ids: a.ids });
  });
  return out;
}
function time(iso){ const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
function openList(){
  const dl = REG.days.find(d => d.d === day).label, rs = rows(), ok = rs.filter(r => r.ok).length, exp = listFor(day).length;
  $('lh').textContent = REG.title + ' · ' + REG.city + ' · ' + dl;
  $('ls').textContent = `Пришли: ${ok} · по списку: ${exp} · не отметились: ${rs.filter(r => !r.ok).length}`;
  $('lt').innerHTML = rs.map((r, i) => `<tr class="${r.ok ? '' : 'no'}"><td>${i + 1}</td><td>${esc(r.n)}${r.extra ? '<span class="tag">' + r.why + '</span>' : ''}</td><td>${esc(r.r || '')}</td><td>${esc(r.s || '')}</td><td>${r.ok ? '<span class="ok">✅ ' + r.t + '</span> <button class="un" data-ids="' + r.ids.join(',') + '" onclick="unmark(this)">✖ снять</button>' : '⏳ не отметился'}</td></tr>`).join('');
  $('ov').classList.add('on');
}
async function unmark(b){
  if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'точно снять?'; b.classList.add('sure'); return; }
  b.textContent = '…';
  for (const id of b.dataset.ids.split(',').filter(Boolean)) {
    try { await fetch(REG_DB.BASE + '?key=' + REG_DB.KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { event: { stringValue: REG.event }, day: { stringValue: day }, cancel: { stringValue: id }, user_name: { stringValue: '' }, date: { stringValue: new Date().toISOString() }, device: { stringValue: 'trainer' } } }) }); } catch (e) {}
  }
  lastKey = ''; await load();
}
function closeList(){ $('ov').classList.remove('on'); }
function exportCsv(){
  const dl = REG.days.find(d => d.d === day).label;
  const q = s => '"' + String(s || '').replace(/"/g, '""') + '"';
  const lines = [[REG.title + ' · ' + REG.city + ' · ' + dl].map(q).join(';'), '', ['№', 'ФИО', 'Должность', 'Магазин', 'Пришёл(ла)', 'Время отметки', 'Примечание'].map(q).join(';')];
  rows().forEach((r, i) => lines.push([i + 1, r.n, r.r, r.s, r.ok ? 'да' : 'нет', r.t, r.extra ? r.why : ''].map(q).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Регистрация_' + REG.city + '_' + day + '.csv'; a.click();
}

/* ---------- старт ---------- */
drawTree(); renderBar(); load(); setInterval(load, 3000);
</script>
