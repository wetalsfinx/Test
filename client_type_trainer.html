</head>
<body>

<div class="main-container">

                { text: "(Молча наблюдает, не подходит)", correct: false, explanation: "Клиент может уйти, так и не получив помощи." },

                { text: "«Здравствуйте! Конечно помню, вы брали кольцо с фианитами. Как оно, носите с удовольствием? У нас как раз новое поступление — давайте покажу, что может дополнить вашу коллекцию».", correct: true, explanation: "Постоянный клиент хочет чувствовать себя особенным. «Помню, что вы брали» + «как оно?» = забота и персонализация. Предложение «дополнить коллекцию» = мягкая допродажа." },

            ]

    ];

    // ========== 📖 РЕНДЕР СЦЕНАРИЯ ==========
    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        
        // Update progress bar
        const progress = ((currentScenario) / SCENARIOS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        
        selectedOption = null;
        
        const scenarioArea = document.getElementById('scenarioArea');
        
        // Client type badge
        const typeClass = scenario.clientType;
        const typeHtml = `
            <div class="client-type-badge ${typeClass}">
                <span class="icon">${scenario.clientIcon}</span>
                <span>Тип клиента: ${scenario.clientName}</span>
            </div>
        `;
        
        // Client description
        const descHtml = `
            <div class="client-description">
                <strong> Описание:</strong>
                <p>${scenario.clientDescription}</p>
            </div>
        `;
        
        // Client phrase
        const phraseHtml = `
            <div class="message client">
                <div class="speaker">👤 Клиент говорит:</div>
                <div>${scenario.clientPhrase}</div>
            </div>
        `;
        
        // Options
        let optionsHtml = '<div class="options-container">';
        scenario.options.forEach((option, idx) => {
            const letter = String.fromCharCode(65 + idx); // A, B, C...
            optionsHtml += `
                <div class="option" data-idx="${idx}" onclick="selectOption(${idx}, this)">
                    <span class="option-label">${letter}</span>
                    ${option.text}
                </div>
            `;
        });
        optionsHtml += '</div>';
        
        scenarioArea.innerHTML = typeHtml + descHtml + phraseHtml + optionsHtml;
        
        // Reset button
        const checkBtn = document.getElementById('checkBtn');
        checkBtn.textContent = '✅ Проверить ответ';
        checkBtn.className = 'btn btn-primary';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;
        
        document.getElementById('resultCard').style.display = 'none';
    }

    // ========== 🖱️ ВЫБОР ОПЦИИ ==========
    function selectOption(idx, element) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        
        element.classList.add('selected');
        selectedOption = idx;
        
        document.getElementById('checkBtn').disabled = false;
    }

    // ========== ✅ ПРОВЕРКА СЦЕНАРИЯ ==========
    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctOption = scenario.options.findIndex(opt => opt.correct);
        
        // Подсвечиваем правильный и неправильные ответы
        const options = document.querySelectorAll('.option');
        options.forEach((opt, idx) => {
            if (idx === correctOption) opt.classList.add('correct');
            if (idx === selectedOption && idx !== correctOption) opt.classList.add('wrong');
        });
        
        // Считаем результат
        const isCorrect = selectedOption === correctOption;
        const percent = isCorrect ? 100 : 0;
        
        // Показываем результат
        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${isCorrect ? 'success' : 'fail'}`;
        
        let html = `<div class="result-title">${isCorrect ? '🎉 Отлично!' : '⚠️ Есть над чем поработать'}</div>`;
        html += `<p style="text-align: center; font-size: 18px; margin-bottom: 20px;">${isCorrect ? 'Вы выбрали правильный ответ!' : 'Этот ответ не совсем подходит'}</p>`;
        
        // Объяснение
        html += '<div class="explanation ' + (isCorrect ? 'correct' : 'wrong') + '">';
        if (isCorrect) {
            html += `<strong>✅ Правильно!</strong>
                <p>${scenario.options[selectedOption].explanation}</p>`;
        } else {
            html += `<strong>❌ Почему это неправильно:</strong>
                <p>${scenario.options[selectedOption].explanation}</p>
                <div class="explanation correct" style="margin-top: 12px;">
                    <strong>✅ Правильный ответ:</strong>
                    <p>${scenario.options[correctOption].text}</p>
                    <p style="margin-top: 8px;">${scenario.options[correctOption].explanation}</p>
                </div>`;
        }
        html += '</div>';
        
        resultCard.innerHTML = html;
        
        // Сохраняем результат
        gameResults.push({
            scenario: scenario.title,
            selectedOption: selectedOption,
            correctOption: correctOption,
            isCorrect: isCorrect,
            percent: percent
        });
        
        // Меняем кнопку
        const checkBtn = document.getElementById('checkBtn');
        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn btn-next';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                currentScenario++;
                renderScenario();
            };
        } else {
            checkBtn.textContent = '🏁 Завершить игру';
            checkBtn.className = 'btn btn-finish';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                finishGame();
            };
        }
    }

    // ==========  ЗАВЕРШЕНИЕ ИГРЫ ==========
    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.percent, 0);
        const avgPercent = Math.round(totalScore / SCENARIOS.length);
        
        const resultData = {
            id: Date.now(),
            type: 'clienttype',
            user_name: currentUserName,
            city: currentUserCity,
            score: totalScore,
            total: SCENARIOS.length * 100,
            percent: avgPercent,
            passed: avgPercent >= 70,
            scenarios: gameResults,
            date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        const scenarioArea = document.getElementById('scenarioArea');
        scenarioArea.innerHTML = `
            <div class="final-screen">
                <h2> Игра завершена!</h2>
                <div class="result-big">${avgPercent}%</div>
                <p>Правильных ответов: <strong>${gameResults.filter(r => r.isCorrect).length} из ${SCENARIOS.length}</strong></p>
                <p style="margin-top: 24px; font-size: 20px;">${avgPercent >= 70 ? '✅ Отличный результат! Вы отлично адаптируете ответы под тип клиента.' : '⚠️ Рекомендуем повторить тренажёр и изучить типы клиентов.'}</p>
                <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 32px; max-width: 300px;">🔄 Пройти ещё раз</button>
            </div>
        `;
        
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('checkBtn').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
        
        // Сохранение в Firebase
        try {
            const localBackup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('clienttype_backup', JSON.stringify(localBackup));
            
            const newRef = db.ref('results/clienttype').push();
            await newRef.set(resultData);
            
            const backup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
            const filtered = backup.filter(r => r.id !== resultData.id);
            localStorage.setItem('clienttype_backup', JSON.stringify(filtered));
            
            console.log('✅ Результат сохранён!');
        } catch(e) {
            console.error('❌ Ошибка сохранения:', e);
        }
    }
</script>
