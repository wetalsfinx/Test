                { text: "«У нас огромный выбор! Вот посмотрите эту витрину, а ещё у нас есть электронный каталог. Давайте я покажу!»", correct: false, explanation: "Слишком много выбора вызовет панику и ступор." },
                { text: "«Понимаю, это важный подарок. Давайте я покажу вам 2-3 наших хита продаж в этом бюджете, которые гарантированно нравятся женщинам».", correct: true, explanation: "Растерянный клиент боится ошибиться. Ему нужно готовое решение и уверенность. «Хиты продаж» + «беспроигрышные» = снимает тревогу." },
                { text: "«Ну, если не разбираетесь, возьмите самое дорогое в бюджете — точно не прогадаете».", correct: false, explanation: "Звучит как попытка продать подороже, а не помочь." },
                { text: "«А может, подарочный сертификат? Так она сама выберет, что хочет».", correct: false, explanation: "Сертификат — это последнее средство. Сначала нужно попробовать помочь с выбором." }
            ]
        },
        {
            title: "Эмоциональная девушка",
            clientType: "emotional",
            clientIcon: "✨",
            clientName: "Эмоциональная",
            clientDescription: "Девушка 20-35 лет, меряет украшение, улыбается, смотрит в зеркало. Важны эмоции и ощущения.",
            clientPhrase: "«Ой, мне так нравится, как оно переливается... Но дороговато для меня»",
            options: [
                { text: "«Да, это все таки 2 грамма, сделаем скидку по карте. Можем оформить в рассрочку».", correct: false, explanation: "Слишком сухо и технично. Убивает эмоцию покупки." },
                { text: "«Вам очень идёт! Это кольцо действительно создано, чтобы притягивать взгляды. Представляете, как красиво оно будет смотреться на вашей руке на важном мероприятии? Можем посмотреть варианты в другом бюджете с похожим эффектом».", correct: true, explanation: "Эмоциональный клиент покупает чувства. Нужно усилить эмоцию («притягивать взгляды») + показать заботу о бюджете («варианты в другом бюджете»)." },
                { text: "«Ну, качество требует вложений. Зато это золото, а не бижутерия».", correct: false, explanation: "Звучит как поучение. Клиентка почувствует себя неловко." }
            ]
        },
        {
            title: "Рациональный скептик",
            clientType: "skeptic",
            clientIcon: "🤔",
            clientName: "Скептик",
            clientDescription: "Клиент долго сравнивает цены, хмурится, задаёт каверзные вопросы. Ищет выгоду и аргументы.",
            clientPhrase: "«А почему это кольцо дороже того, что на соседней витрине? Выглядит почти так же»",
            options: [
                { text: "«Потому что это более престижная коллекция, вы же не хотите сэкономить на качестве?»", correct: false, explanation: "Звучит как давление и манипуляция («вы же не хотите...»)." },
                { text: "«Отличный вопрос. Здесь используется более сложное плетение, которое не цепляет одежду, и камни закреплены так, что не выпадут при ежедневной носке. Это инвестиция в долговечность».", correct: true, explanation: "Скептик хочет логики и аргументов. Конкретные преимущества (плетение, закрепка) + выгода («долговечность») = убеждает рационально." },
                { text: "«Ну, цены разные бывают. Могу показать подешевле, если хотите».", correct: false, explanation: "Показывает неуверенность. Скептик решит, что разница в цене необоснованна." }
            ]
        },
        {
            title: "Молчаливый наблюдатель",
            clientType: "quiet",
            clientIcon: "👀",
            clientName: "Молчаливый",
            clientDescription: "Клиент зашёл, молча ходит вдоль витрин, не смотрит на продавца. Нужно аккуратно начать диалог.",
            clientPhrase: "(молчит, просто смотрит)",
            options: [
                { text: "«Добрый день! Чем могу помочь? Что вас интересует?»", correct: false, explanation: "Слишком общий вопрос «чем помочь» — клиент ответит «просто смотрю» и закроется." },
                { text: "«Добрый день! У нас сегодня акция - скидка 15% на все кольца. Какое изделие выбираете — для себя или в подарок?»", correct: true, explanation: "Молчаливому клиенту нужно дать «крючок» для разговора. Конкретика (скидка) + открытый вопрос (для себя или в подарок) = мягко вовлекает в диалог." },
                { text: "(Молча наблюдает, не подходит)", correct: false, explanation: "Клиент может уйти, так и не получив помощи." },
                { text: "«Здравствуйте! Если нужна будет помощь — обращайтесь, я рядом».", correct: false, explanation: "Пассивная позиция. Клиент не обратится сам." }
            ]
        },
        {
            title: "Торопливый",
            clientType: "hurry",
            clientIcon: "⏱️",
            clientName: "Торопливый",
            clientDescription: "Клиент зашёл на минуту, смотрит на часы, говорит быстро. Нужно быстро понять потребность и предложить решение.",
            clientPhrase: "«Мне нужно быстро выбрать серьги в подарок, бюджет 20 тысяч, через час встреча»",
            options: [
                { text: "«Ой, у нас такой большой выбор! Давайте я покажу вам все наши коллекции, у нас есть классика, модерн, винтаж...»", correct: false, explanation: "Слишком долго. Клиент уйдёт, не дождавшись." },
                { text: "«Поняла, времени мало. Давайте сразу к делу — вот 3 наших бестселлера в этом бюджете. Они точно понравятся. Выбирайте!»", correct: true, explanation: "Торопливый клиент ценит скорость. «Понял, времени мало» = эмпатия. «3 бестселлера» = готовое решение без лишнего выбора." },
                { text: "«За час мы точно успеем! Давайте начнём с того, какой стиль она предпочитает — золото или серебро?»", correct: false, explanation: "Хотя вопрос уместен, он замедляет процесс. Сначала нужно показать конкретные варианты." }
            ]
        },
        {
            title: "Постоянный клиент",
            clientType: "regular",
            clientIcon: "💎",
            clientName: "Постоянный",
            clientDescription: "Клиент уже покупал в этом магазине, узнаёт продавца. Важно показать, что его помнят и ценят.",
            clientPhrase: "«Здравствуйте! Я у вас месяц назад покупала кольцо, помните? Хочу посмотреть, что нового»",
            options: [
                { text: "«Здравствуйте! Да, конечно. Вот наша новая коллекция, посмотрите всё».", correct: false, explanation: "Формально. Не показывает, что клиента запомнили." },
                { text: "«Здравствуйте! Конечно помню, вы брали кольцо с фианитами. Как оно, носите с удовольствием? У нас как раз новое поступление — давайте покажу, что может дополнить вашу коллекцию».", correct: true, explanation: "Постоянный клиент хочет чувствовать себя особенным. «Помню, что вы брали» + «как оно?» = забота и персонализация. Предложение «дополнить коллекцию» = мягкая допродажа." },
                { text: "«Здравствуйте! Рады вас видеть. Что подбираете сегодня?»", correct: false, explanation: "Стандартное приветствие. Не использует возможность укрепить лояльность." }
            ]
        }
    ];

    let currentScenario = 0;
    let selectedOption = null;
    let gameResults = [];
    let currentUserName = '';
    let currentUserCity = '';

    function updateProgress() {
        const progress = (currentScenario / SCENARIOS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
    }

    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        document.getElementById('totalScenarios').textContent = SCENARIOS.length;
        updateProgress();
        selectedOption = null;

        const scenarioArea = document.getElementById('scenarioArea');
        let optionsHtml = '';
        scenario.options.forEach((option, idx) => {
            const letter = String.fromCharCode(65 + idx);
            optionsHtml += `
                <div class="option" data-idx="${idx}" onclick="selectOption(${idx}, this)">
                    <div class="option-label"><span>${letter}</span></div>
                    <div class="option-text">${option.text}</div>
                </div>
            `;
        });

        scenarioArea.innerHTML = `
            <div class="scenario-header">
                <div class="scenario-icon">${scenario.clientIcon}</div>
                <div class="scenario-content">
                    <div class="scenario-label">Сценарий ${currentScenario + 1}</div>
                    <div class="scenario-title">${scenario.title}</div>
                    <div class="scenario-name">👤 Тип клиента: ${scenario.clientName}</div>
                </div>
            </div>
            <div class="client-card">
                <strong>📋 Описание клиента</strong>
                ${scenario.clientDescription}
            </div>
            <div class="message client">
                <div class="speaker">👤 Клиент говорит:</div>
                <div>${scenario.clientPhrase}</div>
            </div>
            <div class="options-title">Выберите лучший ответ:</div>
            <div class="options-container">${optionsHtml}</div>
        `;

        const checkBtn = document.getElementById('checkBtn');
        checkBtn.textContent = '✅ Проверить ответ';
        checkBtn.className = 'btn-primary';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;
        document.getElementById('resultCard').style.display = 'none';
    }

    function selectOption(idx, element) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        selectedOption = idx;
        document.getElementById('checkBtn').disabled = false;
    }

    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctOption = scenario.options.findIndex(opt => opt.correct);
        const options = document.querySelectorAll('.option');
        
        options.forEach((opt, idx) => {
            opt.onclick = null;
            opt.classList.add('disabled');
            if (idx === correctOption) opt.classList.add('correct');
            else if (idx === selectedOption) opt.classList.add('wrong');
        });
        
        const isCorrect = selectedOption === correctOption;
        const percent = isCorrect ? 100 : 0;
        
        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${isCorrect ? 'success' : 'fail'}`;
        
        let html = `<h2>${isCorrect ? '🎉 Отлично!' : '⚠️ Есть над чем поработать'}</h2>`;
        html += `<p>${isCorrect ? 'Вы выбрали идеальный ответ для этого типа клиента!' : 'Этот ответ не совсем подходит для данного типа клиента'}</p>`;
        
        html += `<div class="explanation ${isCorrect ? 'correct' : 'wrong'}">`;
        if (isCorrect) {
            html += `<strong>✅ Правильно!</strong><p>${scenario.options[selectedOption].explanation}</p>`;
        } else {
            html += `<strong>❌ Почему это неправильно:</strong><p>${scenario.options[selectedOption].explanation}</p>`;
            html += `<div class="correct-answer"><strong>✅ Правильный ответ:</strong><p style="margin-top:6px;">${scenario.options[correctOption].text}</p><p style="margin-top:8px;"><em>${scenario.options[correctOption].explanation}</em></p></div>`;
        }
        html += `</div>`;
        resultCard.innerHTML = html;
        
        gameResults.push({
            scenario: scenario.title,
            clientType: scenario.clientName,
            clientIcon: scenario.clientIcon,
            selectedOption: selectedOption,
            correctOption: correctOption,
            isCorrect: isCorrect,
            percent: percent
        });
        
        const checkBtn = document.getElementById('checkBtn');
        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn-primary btn-next';
            checkBtn.disabled = false;
            checkBtn.onclick = () => { currentScenario++; renderScenario(); };
        } else {
            checkBtn.textContent = '🏁 Завершить игру';
            checkBtn.className = 'btn-primary btn-finish';
            checkBtn.disabled = false;
            checkBtn.onclick = finishGame;
        }
    }

    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.percent, 0);
        const avgPercent = Math.round(totalScore / SCENARIOS.length);
        const correctCount = gameResults.filter(r => r.isCorrect).length;
        const passed = avgPercent >= 70;
        
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('finalScreen').classList.remove('hidden');
        
        let reviewHtml = '<div class="scenarios-review"><h3>📋 Ваши результаты по типам клиентов</h3>';
        gameResults.forEach(r => {
            reviewHtml += `
                <div class="scenario-review-item ${r.isCorrect ? '' : 'wrong'}">
                    <div class="scenario-review-icon">${r.clientIcon}</div>
                    <div class="scenario-review-info">
                        <div class="scenario-review-title">${r.scenario}</div>
                        <div class="scenario-review-type">Тип: ${r.clientType}</div>
                    </div>
                    <div class="scenario-review-status">${r.isCorrect ? '✅' : '❌'}</div>
                </div>
            `;
        });
        reviewHtml += '</div>';
        
        document.getElementById('finalScreen').innerHTML = `
            <div class="final-card ${passed ? 'success' : 'fail'}">
                <div class="final-icon">${passed ? '🏆' : '📚'}</div>
                <h2>${passed ? 'Отличный результат!' : 'Есть над чем поработать'}</h2>
                <p>${passed ? 'Вы отлично адаптируете ответы под разные типы клиентов!' : 'Рекомендуем повторить тренажёр и изучить особенности каждого типа клиента.'}</p>
                <div class="result-stats">
                    <div class="stat-box"><div class="stat-value">${avgPercent}%</div><div class="stat-label">Результат</div></div>
                    <div class="stat-box"><div class="stat-value">${correctCount}/${SCENARIOS.length}</div><div class="stat-label">Верно</div></div>
                </div>
                ${reviewHtml}
                <div class="save-status" id="saveStatus"><span class="spinner"></span>Сохраняю результат...</div>
                <button class="restart-btn" onclick="location.reload()">🔄 Пройти ещё раз</button>
            </div>
        `;
        
        const resultData = {
            id: Date.now(), type: 'clienttype', user_name: currentUserName, city: currentUserCity,
            score: totalScore, total: SCENARIOS.length * 100, percent: avgPercent, passed: passed,
            scenarios: gameResults, date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        const statusDiv = document.getElementById('saveStatus');
        try {
            const localBackup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('clienttype_backup', JSON.stringify(localBackup));
            
            const newRef = db.ref('results/clienttype').push();
            await newRef.set(resultData);
            
            const backup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
            localStorage.setItem('clienttype_backup', JSON.stringify(backup.filter(r => r.id !== resultData.id)));
            
            statusDiv.innerHTML = '✅ Результат сохранён в облаке!';
            statusDiv.style.color = '#10b981';
            statusDiv.style.background = 'rgba(16,185,129,0.1)';
        } catch(e) {
            statusDiv.innerHTML = '⚠️ Сохранено локально, отправится при следующем запуске.';
            statusDiv.style.color = '#d97706';
            statusDiv.style.background = 'rgba(217,119,6,0.1)';
        }
    }

    document.getElementById('startBtn').onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите магазин'); return; }
        
        currentUserName = name;
        currentUserCity = city;
        currentScenario = 0;
        gameResults = [];
        
        document.getElementById('regScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        renderScenario();
    };

    document.getElementById('userName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('startBtn').click();
    });
</script>

</body>
</html>
