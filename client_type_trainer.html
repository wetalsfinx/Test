        .btn.finish-btn { background: #16a34a; }

        .progress { text-align: center; color: #666; margin-bottom: 16px; font-size: 13px; }

</head>
<body>

<div class="main-container">
    <div class="employee-view">
        <h1>🎭 585GOLD | Адаптация под тип клиента</h1>
        <p style="text-align: center; color: #666; font-size: 14px;">Выберите правильный ответ, который подходит под тип клиента</p>

                <div class="controls">

</div>

    // ========== 🚀 ФУНКЦИЯ ЗАПУСКА ИГРЫ ==========
    function startGame() {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        
        if (!name) {
            alert('Введите имя');
            return;
        }
        if (!city) {
            alert('Выберите город');
            return;
        }
        
        currentUserName = name;
        currentUserCity = city;
        currentScenario = 0;
        gameResults = [];
        
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        document.getElementById('totalScenarios').textContent = SCENARIOS.length;
        
        renderScenario();
    }

    // ========== 🔄 АВТОДОЗАГРУЗКА ==========

        const backup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
        if (backup.length > 0) {
            console.log(`🔄 Найдено ${backup.length} несохранённых результатов. Отправляем...`);

                try {
                    const newRef = db.ref('results/clienttype').push();
                    await newRef.set(result);
                    console.log('✅ Отправлено:', result.user_name);
                } catch(e) {
                    console.error('❌ Ошибка:', e.message);

            clientPhrase: "«Мне нужно что-то на годовщину, бюджет 30 тысяч, но я вообще не разбираюсь в этом. Помогите выбрать»",
            options: [
                { 
                    text: "«У нас огромный выбор! Вот посмотрите эту витрину, а ещё у нас есть электронный каталог. Давайте я покажу!»",

            clientDescription: "Клиент долго сравнивает цены, хмурится, задаёт каверзные вопросы. Ищет выгоду и аргументы.",
            clientPhrase: "«А почему это кольцо дороже того, что на соседней витрине? Выглядит почти так же»",
            options: [
                { 
                    text: "«Потому что это более престижная коллекция, вы же не хотите сэкономить на качестве?»", 
                    correct: false, 
                    explanation: "Звучит как давление и манипуляция («вы же не хотите...»)." 
                },
                { 
                    text: "«Отличный вопрос. Здесь используется более сложное плетение, которое не цепляет одежду, и камни закреплены так, что не выпадут при ежедневной носке. Это инвестиция в долговечность».", 
                    correct: true, 
                    explanation: "Скептик хочет логики и аргументов. Конкретные преимущества (плетение, закрепка) + выгода («долговечность») = убеждает рационально." 
                },
                { 
                    text: "«Ну, цены разные бывают. Могу показать подешевле, если хотите».", 
                    correct: false, 
                    explanation: "Показывает неуверенность. Скептик решит, что разница в цене необоснованна." 
                }
            ]
        },
        {
            title: "Молчаливый наблюдатель",
            clientType: "Молчаливый",
            clientDescription: "Клиент зашёл, молча ходит вдоль витрин, не смотрит на продавца. Нужно аккуратно начать диалог.",

                },
                { 
                    text: "«Добрый день! У нас сегодня акция - скидка 15% на все кольца. Какое изделие выбираете — для себя или в подарок?»",

                { 
                    text: "«Ой, у нас такой большой выбор! Давайте я покажу вам все наши коллекции, у нас есть классика, модерн, винтаж...»",

                {

    // ========== 📖 РЕНДЕР СЦЕНАРИЯ ==========
    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        selectedOption = null;
        
        const scenarioArea = document.getElementById('scenarioArea');
        scenarioArea.innerHTML = `
            <div class="client-type">
                <strong>Тип клиента:</strong> ${scenario.clientType}
                <div style="margin-top: 8px; color: #666;">${scenario.clientDescription}</div>
            </div>
            <div class="client-phrase">
                <strong>Клиент говорит:</strong> ${scenario.clientPhrase}
            </div>
        `;
        
        scenario.options.forEach((option, idx) => {
            const optionDiv = document.createElement('div');
            optionDiv.className = 'option';
            optionDiv.dataset.idx = idx;
            optionDiv.innerHTML = option.text;
            optionDiv.onclick = () => selectOption(idx, optionDiv);
            scenarioArea.appendChild(optionDiv);
        });
        
        const checkBtn = document.getElementById('checkBtn');
        checkBtn.textContent = '✅ Проверить';
        checkBtn.className = 'btn';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;
        
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('saveStatus').textContent = '';
    }

    // ========== 🖱️ ВЫБОР ОПЦИИ ==========
    function selectOption(idx, element) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        
        element.classList.add('selected');
        selectedOption = idx;
        
        document.getElementById('checkBtn').disabled = false;
    }

    // ========== ✅ ПРОВЕРКА СЦЕНАРИЯ ==========
    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctOption = scenario.options.findIndex(opt => opt.correct);
        
        // Подсвечиваем правильный и неправильные ответы
        const options = document.querySelectorAll('.option');
        options.forEach((opt, idx) => {
            if (idx === correctOption) opt.classList.add('correct');
            if (idx === selectedOption && idx !== correctOption) opt.classList.add('wrong');
        });
        
        // Считаем результат
        const isCorrect = selectedOption === correctOption;
        const percent = isCorrect ? 100 : 0;
        
        // Показываем результат
        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${isCorrect ? 'success' : 'fail'}`;
        
        let html = `<h2>${isCorrect ? '✅ Отлично!' : '⚠️ Есть над чем поработать'}</h2>`;
        html += `<p>Ваш выбор: ${scenario.options[selectedOption].text}</p>`;
        html += `<p>Результат: ${percent}%</p>`;
        
        // Объяснение
        html += '<div style="text-align: left; margin-top: 16px;">';
        if (isCorrect) {
            html += `<div class="explanation">
                <div class="correct-text">✅ Правильно!</div>
                <div style="margin-top: 6px;">${scenario.options[selectedOption].explanation}</div>
            </div>`;
        } else {
            html += `<div class="explanation">
                <div class="error-text">❌ Неправильно!</div>
                <div style="margin-top: 6px;">${scenario.options[selectedOption].explanation}</div>
                <div class="explanation">
                    <div class="correct-text" style="margin-top: 12px;">✅ Правильный ответ:</div>
                    <div style="margin-top: 6px;">${scenario.options[correctOption].text}</div>
                    <div style="margin-top: 6px;">${scenario.options[correctOption].explanation}</div>
                </div>
            </div>`;
        }
        html += '</div>';
        
        resultCard.innerHTML = html;
        
        // Сохраняем результат
        gameResults.push({
            scenario: scenario.title,
            selectedOption: selectedOption,
            correctOption: correctOption,
            isCorrect: isCorrect,
            percent: percent
        });
        
        // Меняем кнопку
        const checkBtn = document.getElementById('checkBtn');
        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn next-btn';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                currentScenario++;
                renderScenario();
            };
        } else {
            checkBtn.textContent = '🏁 Завершить игру и показать результаты';
            checkBtn.className = 'btn finish-btn';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                finishGame();
            };
        }
    }

    // ========== 🏁 ЗАВЕРШЕНИЕ ИГРЫ ==========
    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.percent, 0);
        const avgPercent = Math.round(totalScore / SCENARIOS.length);
        
        const resultData = {
            id: Date.now(),
            type: 'clienttype',
            user_name: currentUserName,
            city: currentUserCity,
            score: totalScore,
            total: SCENARIOS.length * 100,
            percent: avgPercent,
            passed: avgPercent >= 70,
            scenarios: gameResults,
            date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        const statusDiv = document.getElementById('saveStatus');
        statusDiv.textContent = '⏳ Сохранение...';
        statusDiv.style.color = '#f59e0b';
        
        try {
            const localBackup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('clienttype_backup', JSON.stringify(localBackup));
            
            const newRef = db.ref('results/clienttype').push();
            await newRef.set(resultData);
            
            const backup = JSON.parse(localStorage.getItem('clienttype_backup') || '[]');
            const filtered = backup.filter(r => r.id !== resultData.id);
            localStorage.setItem('clienttype_backup', JSON.stringify(filtered));
            
            statusDiv.textContent = '✅ Результат сохранён!';
            statusDiv.style.color = '#16a34a';
        } catch(e) {
            statusDiv.textContent = '⚠️ Сохранено локально';
            statusDiv.style.color = '#f59e0b';
        }
        
        const scenarioArea = document.getElementById('scenarioArea');
        scenarioArea.innerHTML = `
            <div style="text-align: center; padding: 20px;">
                <h2>🎉 Игра завершена!</h2>
                <p style="font-size: 18px;">Ваш результат: <strong>${avgPercent}%</strong></p>
                <p>Правильных ответов: ${gameResults.filter(r => r.isCorrect).length} из ${SCENARIOS.length}</p>
                <p style="margin-top: 16px;">${avgPercent >= 70 ? '✅ Отличный результат! Вы отлично адаптируете ответы под тип клиента.' : '⚠️ Рекомендуем повторить тренажёр и изучить типы клиентов.'}</p>
                <button class="btn" onclick="location.reload()" style="margin-top: 20px; max-width: 300px;">🔄 Пройти ещё раз</button>
            </div>
        `;
        
        document.getElementById('checkBtn').style.display = 'none';
    }
</script>

</body>
</html>
