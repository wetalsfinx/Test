<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>585GOLD | Дашборд</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; }
        .dashboard { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-top: 4px solid #c41e3a; }
        h2, h3 { color: #c41e3a; margin-top: 0; }
        .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
        select, button { padding: 8px 16px; border-radius: 40px; border: 1px solid #ddd; background: white; cursor: pointer; }
        button { background: #c41e3a; color: white; border: none; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: #f8f9fa; border-radius: 20px; padding: 16px; text-align: center; }
        .kpi-value { font-size: 32px; font-weight: bold; color: #c41e3a; }
        .charts-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
        .chart-box { flex: 1; min-width: 280px; }
        canvas { max-height: 220px; width: 100%; }
        .employee-list { max-height: 400px; overflow-y: auto; }
        .employee-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .employee-item:hover { background: #fff0f3; }
        .delete-btn { background: #8b1a2c; color: white; border: none; border-radius: 20px; padding: 4px 12px; cursor: pointer; margin-left: 10px; font-size: 12px; }
        .badge { background: #c41e3a; color: white; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="card">
        <h2>📊 585GOLD | Дашборд</h2>
        <div class="flex-row">
            <select id="cityFilter"><option value="all">Все города</option></select>
            <button id="loadBtn">Загрузить</button>
            <button id="exportBtn">📎 CSV</button>
        </div>
        <div id="status" style="margin-top: 8px; color: #666; font-size: 13px;"></div>
    </div>

    <div id="statsArea" style="display: none;">
        <div class="kpi-grid" id="kpi"></div>
        <div class="charts-row">
            <div class="card chart-box"><h3>Распределение баллов</h3><canvas id="scoreChart"></canvas></div>
            <div class="card chart-box"><h3>Топ городов</h3><canvas id="cityChart"></canvas></div>
        </div>
        <div class="card">
            <h3>📋 Сотрудники (<span id="empCount">0</span>)</h3>
            <div id="employeeList" class="employee-list"></div>
        </div>
    </div>
    <div id="loading" class="loading">Загрузка...</div>
</div>

<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; max-width:550px; width:90%; max-height:80vh; overflow-y:auto; border-radius:24px; padding:20px;">
        <h3 id="modalTitle"></h3>
        <div id="modalAnswers"></div>
        <button onclick="closeModal()" style="margin-top:16px; background:#6c757d; color:white; border:none; padding:8px 20px; border-radius:30px;">Закрыть</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://qtostraaqrnjbxiydlip.supabase.co', 'sb_publishable_0GzJSuoAi5zc7pHkicHMNg_cQ-rGAX7');
    
    let allData = [], filteredData = [], scoreChart = null, cityChart = null;
    
    async function loadResults() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('statsArea').style.display = 'none';
        document.getElementById('status').innerHTML = 'Загрузка...';
        
        const { data, error } = await supabaseClient.from('results_new').select('*').eq('test_slug', 'prodazhi_2025').order('created_at', { ascending: false }).limit(500);
        
        document.getElementById('loading').style.display = 'none';
        if (error) { document.getElementById('status').innerHTML = 'Ошибка: ' + error.message; return; }
        if (!data || !data.length) { document.getElementById('status').innerHTML = 'Нет данных'; return; }
        
        allData = data.map(r => ({
            id: r.id,
            user_name: r.user_name || r.user_id || 'Аноним',
            city: r.city || 'Не указан',
            score: r.score || 0,
            total: r.total || 11,
            percent: r.percent || 0,
            answers: r.answers || []
        }));
        
        const cities = [...new Set(allData.map(r => r.city))];
        const citySelect = document.getElementById('cityFilter');
        citySelect.innerHTML = '<option value="all">Все города</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
        
        applyFilters();
        document.getElementById('statsArea').style.display = 'block';
        document.getElementById('status').innerHTML = `✅ ${allData.length} записей`;
    }
    
    function applyFilters() {
        const city = document.getElementById('cityFilter').value;
        filteredData = city === 'all' ? [...allData] : allData.filter(r => r.city === city);
        renderDashboard();
    }
    
    async function deleteEmployee(id, event) {
        event.stopPropagation();
        if (!confirm('Удалить результаты этого сотрудника?')) return;
        await supabaseClient.from('results_new').delete().eq('id', id);
        await loadResults();
    }
    
    function renderDashboard() {
        if (!filteredData.length) { 
            document.getElementById('kpi').innerHTML = '<div class="kpi-card">Нет данных</div>';
            document.getElementById('employeeList').innerHTML = '';
            return;
        }
        
        const total = filteredData.length;
        const avg = Math.round(filteredData.reduce((s,r)=>s+r.percent,0)/total);
        const success = filteredData.filter(r=>r.percent>=85).length;
        const errors = filteredData.reduce((s,r)=>s+(r.total-r.score),0);
        
        document.getElementById('kpi').innerHTML = `
            <div class="kpi-card"><div class="kpi-value">${total}</div><div>Сотрудников</div></div>
            <div class="kpi-card"><div class="kpi-value">${avg}%</div><div>Средний балл</div></div>
            <div class="kpi-card"><div class="kpi-value">${success}</div><div>Успешно (≥85%)</div></div>
            <div class="kpi-card"><div class="kpi-value">${errors}</div><div>Ошибок всего</div></div>
        `;
        
        document.getElementById('empCount').innerText = filteredData.length;
        document.getElementById('employeeList').innerHTML = filteredData.map(r => `
            <div class="employee-item" onclick="showEmployee(${r.id})">
                <div style="flex:1">
                    <b>${escapeHtml(r.user_name)}</b> (${escapeHtml(r.city)})
                    <span class="badge" style="background:${r.percent>=85?'#28a745':'#c41e3a'}">${r.percent}%</span>
                </div>
                <button class="delete-btn" onclick="deleteEmployee(${r.id}, event)">🗑</button>
            </div>
        `).join('');
        
        // Гистограмма
        const bins = [0,0,0,0,0];
        filteredData.forEach(r => {
            if (r.percent <= 20) bins[0]++;
            else if (r.percent <= 40) bins[1]++;
            else if (r.percent <= 60) bins[2]++;
            else if (r.percent <= 80) bins[3]++;
            else bins[4]++;
        });
        
        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(document.getElementById('scoreChart'), {
            type: 'bar',
            data: { labels: ['0-20%', '21-40%', '41-60%', '61-80%', '81-100%'], datasets: [{ data: bins, backgroundColor: '#c41e3a' }] },
            options: { responsive: true, plugins: { legend: { display: false } }, animation: { duration: 0 } }
        });
        
        // График городов
        const cityMap = new Map();
        filteredData.forEach(r => {
            if (!cityMap.has(r.city)) cityMap.set(r.city, { sum: 0, count: 0 });
            const c = cityMap.get(r.city);
            c.sum += r.percent;
            c.count++;
        });
        const cityRating = [...cityMap.entries()].map(([city, data]) => ({ city, avg: Math.round(data.sum / data.count) })).sort((a,b)=>b.avg-a.avg).slice(0,6);
        
        if (cityChart) cityChart.destroy();
        cityChart = new Chart(document.getElementById('cityChart'), {
            type: 'bar',
            data: { labels: cityRating.map(c=>c.city), datasets: [{ data: cityRating.map(c=>c.avg), backgroundColor: '#c41e3a' }] },
            options: { responsive: true, plugins: { legend: { display: false } }, animation: { duration: 0 } }
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function showEmployee(id) {
        const emp = filteredData.find(r => r.id == id);
        if (!emp) return;
        document.getElementById('modalTitle').innerHTML = `${emp.user_name} (${emp.city}) — ${emp.percent}%`;
        let html = `<p>✅ Правильных ответов: ${emp.score}/${emp.total}</p>`;
        if (emp.answers && emp.answers.length) {
            emp.answers.forEach((a,i) => {
                const isCorrect = a.correct === true;
                html += `<div style="background:#f8f9fa; border-radius:16px; padding:12px; margin-bottom:12px; border-left:4px solid ${isCorrect ? '#28a745' : '#c41e3a'}">
                            <b>Вопрос ${i+1}:</b> ${escapeHtml(a.questionText)}<br>
                            <b>Ваш ответ:</b> ${escapeHtml(a.selectedText)}<br>
                            ${!isCorrect ? `<b>✅ Правильный ответ:</b> ${escapeHtml(a.correctText)}<br><div style="background:#e8f0e8; padding:8px; margin-top:8px; border-radius:8px;">💡 ${getRecommendation(a.correctText)}</div>` : ''}
                         </div>`;
            });
        }
        document.getElementById('modalAnswers').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function getRecommendation(text) {
        const q = text.toLowerCase();
        if (q.includes('скидка') && q.includes('бонусами')) return 'Сначала дайте ценность (скидку + бонусы), затем задайте открытые вопросы.';
        if (q.includes('с чем она планирует носить')) return 'Уточните контекст: куда и с чем будет носить — это поможет подобрать точнее.';
        if (q.includes('давайте примерим')) return 'Не соглашайтесь сразу. Пригласите примерить — клиент сам увидит.';
        if (q.includes('подобрать серьги')) return 'Сначала предложите дополнительное украшение, покажите образ целиком.';
        if (q.includes('сплит') && q.includes('45 000')) return 'Назовите цену и сразу предложите Сплит как комфортный вариант оплаты.';
        if (q.includes('с чем вы сравниваете')) return 'Не спешите снижать цену. Сначала выясните причину сомнения.';
        if (q.includes('сплит') && q.includes('11 250')) return 'Подтвердите ценность товара, затем предложите Сплит.';
        if (q.includes('футляр')) return 'Не спрашивайте «нужно?». Презентуйте аксессуар как полезную добавку.';
        return 'Изучите правильный ответ и повторите материал.';
    }
    
    function exportCSV() {
        if (!filteredData.length) return alert('Нет данных');
        let csv = "Имя,Город,Правильных,Всего,Процент\n";
        filteredData.forEach(r => csv += `"${r.user_name}","${r.city}",${r.score},${r.total},${r.percent}%\n`);
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `results_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
    }
    
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    
    document.getElementById('loadBtn').onclick = loadResults;
    document.getElementById('cityFilter').onchange = applyFilters;
    document.getElementById('exportBtn').onclick = exportCSV;
    window.closeModal = closeModal;
    window.showEmployee = showEmployee;
    window.deleteEmployee = deleteEmployee;
    
    loadResults();
</script>
</body>
</html>
