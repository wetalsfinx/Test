<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>585GOLD | Дашборд</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; }
        .dashboard { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #c41e3a; }
        h2, h3 { color: #c41e3a; margin-top: 0; font-size: 18px; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        select, button, input { padding: 8px 12px; border-radius: 30px; border: 1px solid #ddd; font-size: 13px; background: white; cursor: pointer; }
        button { background: #c41e3a; color: white; border: none; }
        button:hover { background: #8b1a2c; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .kpi-card { background: #f8f9fa; border-radius: 20px; padding: 12px; text-align: center; }
        .kpi-value { font-size: 28px; font-weight: bold; color: #c41e3a; }
        .charts-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .chart-box { flex: 1; min-width: 260px; }
        canvas { max-height: 200px; width: 100%; }
        .employee-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .employee-item:hover { background: #fff0f3; }
        .employee-list { max-height: 400px; overflow-y: auto; }
        .badge { background: #c41e3a; color: white; padding: 2px 10px; border-radius: 30px; font-size: 11px; }
        .delete-btn { background: #8b1a2c; border: none; border-radius: 20px; padding: 4px 12px; cursor: pointer; font-size: 11px; color: white; margin-left: 8px; }
        .tab-btn { background: #e0d6cc; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: bold; margin-right: 8px; }
        .tab-btn.active { background: #c41e3a; color: white; }
        .feedback-btn { background: #2c6e2c; margin-left: 5px; }
        .question-stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .question-stats-table th, .question-stats-table td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
        .question-stats-table th { background: #c41e3a; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; border-radius: 28px; padding: 20px; }
        .answer-item { background: #f8f9fa; border-radius: 16px; padding: 10px; margin-bottom: 10px; border-left: 4px solid #c41e3a; }
        .recommendation { background: #e8f0e8; padding: 8px; margin-top: 8px; border-radius: 8px; font-size: 12px; }
        .loading-text { text-align: center; padding: 30px; color: #666; }
        .leader-card { background: linear-gradient(135deg, #fff0f3, #ffe0e0); border-radius: 20px; padding: 12px; margin-bottom: 15px; text-align: center; }
        .dark { background: #1a1a2e; color: #eee; }
        .dark .card { background: #16213e; }
        .dark .kpi-card { background: #0f3460; }
        .dark .employee-item { border-color: #2c3e50; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <h2 style="margin: 0;">📊 585GOLD | Дашборд</h2>
            <button id="themeToggleBtn" style="background:#6c757d; padding: 6px 15px;">🌙 Тема</button>
        </div>
        <div style="margin-top: 12px;">
            <button id="tabTestBtn" class="tab-btn active">📊 Тест</button>
            <button id="tabCityStatsBtn" class="tab-btn">🏙️ Статистика по городам</button>
        </div>
        <div id="testFilters" class="flex-row" style="margin-top: 12px;">
            <select id="cityFilter"><option value="all">Все города</option></select>
            <select id="percentFilter"><option value="all">Все</option><option value="70">≥70%</option><option value="85">≥85%</option><option value="50">&lt;50%</option></select>
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск">
            <button id="resetFiltersBtn">Сбросить</button>
            <button id="loadBtn">Загрузить</button>
            <button id="exportBtn">📎 CSV</button>
            <button id="feedbackBtn" class="feedback-btn">📝 Фидбек для города</button>
        </div>
        <div id="status" style="margin-top: 8px; font-size: 12px; color: #666;"></div>
    </div>

    <div id="testArea">
        <div id="leaderCelebration" class="leader-card" style="display: none;"></div>
        <div class="kpi-grid" id="kpi"></div>
        <div class="charts-row">
            <div class="card chart-box"><h3>Распределение баллов</h3><canvas id="scoreChart"></canvas></div>
            <div class="card chart-box"><h3>Топ городов</h3><canvas id="cityChart"></canvas></div>
        </div>
        <div class="row" style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="card" style="flex:1"><h3>🏆 Топ сотрудников (≥85%)</h3><div id="topList"></div></div>
            <div class="card" style="flex:1"><h3>🏙️ Рейтинг городов</h3><div id="cityRating"></div></div>
        </div>
        <div class="card">
            <h3>📋 Сотрудники (<span id="empCount">0</span>)</h3>
            <div class="employee-list" id="employeeList"></div>
        </div>
        <div class="card">
            <h3>📊 Статистика по вопросам (ошибки)</h3>
            <div style="overflow-x: auto;">
                <table class="question-stats-table" id="questionStatsTable">
                    <thead>汽<th>Вопрос</th><th>Ошибок</th><th>% ошибок</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="cityStatsArea" style="display: none;">
        <div class="card">
            <h3>🏙️ Статистика по городам</h3>
            <div style="overflow-x: auto;">
                <table class="question-stats-table" id="cityStatsTable">
                    <thead>汽<th>Город</th><th>Сотрудников</th><th>Средний балл</th><th>Успешно (≥85%)</th><th>Ошибок всего</th></tr></thead>
                    <tbody id="cityStatsBody"></tbody>
                </table>
            </div>
            <button id="exportCityBtn" style="margin-top: 15px;">📎 Экспорт таблицы CSV</button>
        </div>
    </div>
    <div id="loadingSkeleton" class="loading-text">Загрузка...</div>
</div>

<div id="modal" class="modal"><div class="modal-content"><h3 id="modalTitle"></h3><div id="modalAnswers"></div><button onclick="closeModal()" style="margin-top: 16px; background: #6c757d;">Закрыть</button></div></div>

<script>
    // ========== НАСТРОЙКА JSONBIN.IO ==========
    // ⚠️ СЮДА ВСТАВЬ ТВОЙ MASTER KEY (тот же, что в тесте)
    const JSONBIN_MASTER_KEY = '$2a$10$x.8W4GI2iaP/X052IXSPXOVRirz3Jep1p9o.AHQyFwkP6L8f5YIW2';
    const BIN_ID_KEY = '585_bin_id';
    
    let allData = [], filteredData = [], scoreChart = null, cityChart = null;
    
    async function loadResults() {
        document.getElementById('loadingSkeleton').style.display = 'block';
        document.getElementById('status').innerHTML = 'Загрузка...';
        
        try {
            // Получаем ID коробки из localStorage
            const binId = localStorage.getItem(BIN_ID_KEY);
            if (!binId) {
                document.getElementById('status').innerHTML = '❌ Нет результатов. Пройдите тест первым.';
                document.getElementById('loadingSkeleton').style.display = 'none';
                return;
            }
            
            // Загружаем результаты из JSONBin.io
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            const results = data.record || [];
            
            if (!results.length) {
                document.getElementById('status').innerHTML = 'Нет результатов. Пройдите тест.';
                document.getElementById('loadingSkeleton').style.display = 'none';
                return;
            }
            
            allData = results.map(r => ({
                id: r.id,
                user_name: r.user_name || 'Аноним',
                city: r.city || 'Не указан',
                score: r.score || 0,
                total: r.total || 11,
                percent: r.percent || 0,
                answers: r.answers || []
            }));
            
            // Обновляем фильтр городов
            const cities = [...new Set(allData.map(r => r.city))];
            const citySelect = document.getElementById('cityFilter');
            citySelect.innerHTML = '<option value="all">Все города</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
            
            // Обновляем статистику по городам
            renderCityStatsTable();
            
            applyFilters();
            document.getElementById('status').innerHTML = `✅ Загружено: ${allData.length} записей из облака`;
            
        } catch (err) {
            console.error(err);
            document.getElementById('status').innerHTML = 'Ошибка загрузки: ' + err.message;
        } finally {
            document.getElementById('loadingSkeleton').style.display = 'none';
        }
    }
    
    function renderCityStatsTable() {
        const cityMap = new Map();
        allData.forEach(r => {
            if (!cityMap.has(r.city)) cityMap.set(r.city, { count: 0, sum: 0, success: 0, errors: 0 });
            const c = cityMap.get(r.city);
            c.count++;
            c.sum += r.percent;
            if (r.percent >= 85) c.success++;
            c.errors += (r.total - r.score);
        });
        const cityStats = [...cityMap.entries()].map(([city, data]) => ({
            city, count: data.count, avg: Math.round(data.sum / data.count), success: data.success, errors: data.errors
        })).sort((a,b) => b.avg - a.avg);
        
        const tbody = document.getElementById('cityStatsBody');
        tbody.innerHTML = '';
        cityStats.forEach(c => {
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = `<b>${c.city}</b>`;
            row.insertCell(1).innerHTML = c.count;
            row.insertCell(2).innerHTML = `${c.avg}%`;
            row.insertCell(3).innerHTML = `${c.success} / ${c.count}`;
            row.insertCell(4).innerHTML = c.errors;
        });
    }
    
    function exportCityCSV() {
        const cityMap = new Map();
        allData.forEach(r => {
            if (!cityMap.has(r.city)) cityMap.set(r.city, { count: 0, sum: 0, success: 0, errors: 0 });
            const c = cityMap.get(r.city);
            c.count++;
            c.sum += r.percent;
            if (r.percent >= 85) c.success++;
            c.errors += (r.total - r.score);
        });
        const cityStats = [...cityMap.entries()].map(([city, data]) => ({
            city, count: data.count, avg: Math.round(data.sum / data.count), success: data.success, errors: data.errors
        })).sort((a,b) => b.avg - a.avg);
        
        let csv = "Город,Сотрудников,Средний балл,Успешно (≥85%),Ошибок всего\n";
        cityStats.forEach(c => csv += `"${c.city}",${c.count},${c.avg}%,${c.success}/${c.count},${c.errors}\n`);
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `city_stats.csv`;
        a.click();
    }
    
    function applyFilters() {
        let filtered = [...allData];
        const city = document.getElementById('cityFilter').value;
        if (city !== 'all') filtered = filtered.filter(r => r.city === city);
        const percent = document.getElementById('percentFilter').value;
        if (percent === '70') filtered = filtered.filter(r => r.percent >= 70);
        else if (percent === '85') filtered = filtered.filter(r => r.percent >= 85);
        else if (percent === '50') filtered = filtered.filter(r => r.percent < 50);
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        if (search) filtered = filtered.filter(r => r.user_name.toLowerCase().includes(search));
        filteredData = filtered;
        renderDashboard();
    }
    
    function generateFeedback() {
        const city = document.getElementById('cityFilter').value;
        if (city === 'all') { alert('Выберите город'); return; }
        if (!filteredData.length) { alert('Нет данных'); return; }
        const total = filteredData.length;
        const avg = Math.round(filteredData.reduce((s,r)=>s+r.percent,0)/total);
        let feedback = `📊 Анализ результатов: город ${city}\n👥 Сотрудников: ${total}\n📈 Средний балл: ${avg}%\n\n`;
        feedback += `📌 Рекомендации:\n`;
        feedback += `• Проведите разбор ошибок с сотрудниками\n`;
        feedback += `• Обратите внимание на правила продаж\n`;
        navigator.clipboard.writeText(feedback).then(() => alert('Фидбек скопирован'));
    }
    
    function renderDashboard() {
        if (!filteredData.length) {
            document.getElementById('kpi').innerHTML = '<div class="kpi-card">Нет данных</div>';
            return;
        }
        
        const total = filteredData.length;
        const avg = Math.round(filteredData.reduce((s,r)=>s+r.percent,0)/total);
        const success = filteredData.filter(r=>r.percent>=85).length;
        const errors = filteredData.reduce((s,r)=>s+(r.total-r.score),0);
        
        document.getElementById('kpi').innerHTML = `
            <div class="kpi-card"><div class="kpi-value">${total}</div><div>Сотрудников</div></div>
            <div class="kpi-card"><div class="kpi-value">${avg}%</div><div>Средний балл</div></div>
            <div class="kpi-card"><div class="kpi-value">${success}</div><div>Успешно (≥85%)</div></div>
            <div class="kpi-card"><div class="kpi-value">${errors}</div><div>Ошибок всего</div></div>
        `;
        
        const top5 = [...filteredData].filter(r=>r.percent>=85).sort((a,b)=>b.percent-a.percent).slice(0,5);
        document.getElementById('topList').innerHTML = top5.map((r,i)=>`
            <div class="employee-item" onclick="showDetails(${r.id})">
                <span><b>${i+1}</b> ${r.user_name} (${r.city})</span>
                <span class="badge">${r.percent}%</span>
            </div>
        `).join('') || 'Нет';
        
        const cityMap = new Map();
        filteredData.forEach(r => {
            if (!cityMap.has(r.city)) cityMap.set(r.city, { sum: 0, count: 0 });
            cityMap.get(r.city).sum += r.percent;
            cityMap.get(r.city).count++;
        });
        const cityRating = [...cityMap.entries()].map(([city, data]) => ({ city, avg: Math.round(data.sum / data.count), count: data.count })).sort((a,b)=>b.avg-a.avg);
        document.getElementById('cityRating').innerHTML = cityRating.map(c => `
            <div class="employee-item" onclick="document.getElementById('cityFilter').value='${c.city}'; applyFilters();">
                <span><b>${c.city}</b> (${c.count})</span>
                <span class="badge">${c.avg}%</span>
            </div>
        `).join('');
        
        const leader = [...filteredData].sort((a,b)=>b.percent-a.percent)[0];
        if(leader) document.getElementById('leaderCelebration').innerHTML = `🏆 Лучший: ${leader.user_name} (${leader.city}) — ${leader.percent}%`;
        
        document.getElementById('empCount').innerText = filteredData.length;
        document.getElementById('employeeList').innerHTML = filteredData.map(r => `
            <div class="employee-item">
                <div style="flex:1; cursor:pointer;" onclick="showDetails(${r.id})">
                    <b>${r.user_name}</b> (${r.city})
                    <span class="badge" style="background:${r.percent>=85?'#28a745':'#c41e3a'}">${r.percent}%</span>
                </div>
                <button class="delete-btn" onclick="deleteRow(${r.id})">🗑</button>
            </div>
        `).join('');
        
        const bins = [0,0,0,0,0];
        filteredData.forEach(r => {
            if (r.percent <= 20) bins[0]++;
            else if (r.percent <= 40) bins[1]++;
            else if (r.percent <= 60) bins[2]++;
            else if (r.percent <= 80) bins[3]++;
            else bins[4]++;
        });
        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(document.getElementById('scoreChart'), {
            type: 'bar',
            data: { labels: ['0-20%', '21-40%', '41-60%', '61-80%', '81-100%'], datasets: [{ data: bins, backgroundColor: '#c41e3a' }] }
        });
        
        if (cityChart) cityChart.destroy();
        cityChart = new Chart(document.getElementById('cityChart'), {
            type: 'bar',
            data: { labels: cityRating.map(c=>c.city), datasets: [{ data: cityRating.map(c=>c.avg), backgroundColor: '#c41e3a' }] }
        });
        
        // Статистика по вопросам (из answers)
        const questionStats = [];
        filteredData.forEach(r => {
            if (r.answers && r.answers.length) {
                r.answers.forEach((a, idx) => {
                    if (!questionStats[idx]) questionStats[idx] = { total: 0, errors: 0, text: a.questionText };
                    questionStats[idx].total++;
                    if (!a.correct) questionStats[idx].errors++;
                });
            }
        });
        const tbody = document.querySelector('#questionStatsTable tbody');
        tbody.innerHTML = '';
        questionStats.forEach((q, i) => {
            const percent = Math.round((q.errors / q.total) * 100);
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = `<b>${i+1}.</b> ${q.text}`;
            row.insertCell(1).innerHTML = `${q.errors}/${q.total}`;
            row.insertCell(2).innerHTML = `${percent}%`;
        });
    }
    
    function deleteRow(id) {
        if (!confirm('Удалить результаты этого сотрудника? Удаление только из дашборда (из облака не удалится).')) return;
        allData = allData.filter(r => r.id !== id);
        applyFilters();
        renderCityStatsTable();
        alert('Удалено из текущего просмотра');
    }
    
    function showDetails(id) {
        const emp = filteredData.find(r => r.id == id);
        if (!emp) return;
        document.getElementById('modalTitle').innerHTML = `${emp.user_name} (${emp.city}) — ${emp.percent}%`;
        let html = `<p>✅ Правильных: ${emp.score}/${emp.total}</p>`;
        if (emp.answers && emp.answers.length) {
            emp.answers.forEach((a,i) => {
                html += `<div class="answer-item">
                            <b>Вопрос ${i+1}:</b> ${a.questionText}<br>
                            <b>Ваш ответ:</b> ${a.selectedText}<br>
                            ${!a.correct ? `<b>✅ Правильный ответ:</b> ${a.correctText}<br><div class="recommendation">💡 Изучите правило подробнее</div>` : ''}
                         </div>`;
            });
        }
        document.getElementById('modalAnswers').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function exportCSV() {
        if (!filteredData.length) return alert('Нет данных');
        let csv = "Имя,Город,Правильных,Всего,Процент\n";
        filteredData.forEach(r => csv += `"${r.user_name}","${r.city}",${r.score},${r.total},${r.percent}%\n`);
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `results.csv`;
        a.click();
    }
    
    function resetFilters() {
        document.getElementById('cityFilter').value = 'all';
        document.getElementById('percentFilter').value = 'all';
        document.getElementById('searchInput').value = '';
        applyFilters();
    }
    
    function switchTab(tab) {
        if (tab === 'test') {
            document.getElementById('testArea').style.display = 'block';
            document.getElementById('cityStatsArea').style.display = 'none';
            document.getElementById('tabTestBtn').classList.add('active');
            document.getElementById('tabCityStatsBtn').classList.remove('active');
        } else {
            document.getElementById('testArea').style.display = 'none';
            document.getElementById('cityStatsArea').style.display = 'block';
            document.getElementById('tabTestBtn').classList.remove('active');
            document.getElementById('tabCityStatsBtn').classList.add('active');
            renderCityStatsTable();
        }
    }
    
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function initTheme() { if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); }
    function toggleTheme() { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); }
    
    document.getElementById('loadBtn').onclick = loadResults;
    document.getElementById('resetFiltersBtn').onclick = resetFilters;
    document.getElementById('cityFilter').onchange = applyFilters;
    document.getElementById('percentFilter').onchange = applyFilters;
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('exportBtn').onclick = exportCSV;
    document.getElementById('feedbackBtn').onclick = generateFeedback;
    document.getElementById('tabTestBtn').onclick = () => switchTab('test');
    document.getElementById('tabCityStatsBtn').onclick = () => switchTab('city');
    document.getElementById('exportCityBtn').onclick = exportCityCSV;
    document.getElementById('themeToggleBtn').onclick = toggleTheme;
    
    initTheme();
    loadResults();
</script>
</body>
</html>
