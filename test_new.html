<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>585GOLD — Тест продаж</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #fff0f0;
            padding: 12px;
            min-height: 100vh;
        }
        .container { max-width: 650px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e8a0b4;
        }
        h1 { color: #c41e3a; text-align: center; font-size: 24px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; color: #333; }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 40px;
            border: 1px solid #e8a0b4;
            font-size: 15px;
            background: white;
        }
        button {
            background: #c41e3a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:disabled { background: #e8a0b4; cursor: not-allowed; }
        .progress { text-align: center; color: #666; margin-bottom: 16px; font-size: 13px; }
        .question-text { font-weight: 700; font-size: 17px; margin-bottom: 16px; line-height: 1.4; }
        .option {
            background: #f8f4f0;
            border: 1px solid #e2d6cc;
            border-radius: 20px;
            padding: 10px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .option.selected { background: #c41e3a; color: white; border-color: #c41e3a; }
        .hidden { display: none; }
        .result-box { text-align: center; padding: 20px; border-radius: 24px; }
        .result-box.success { background: #e8f0e8; border-left: 6px solid #2c6e2c; }
        .result-box.fail { background: #ffe0e0; border-left: 6px solid #c41e3a; }
        .restart-btn { background: #c41e3a; margin-top: 16px; }
        .save-status { font-size: 12px; color: #666; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="regScreen" class="card">
        <h1>🎯 585GOLD | Тест продаж</h1>
        <div class="form-group">
            <label>Имя и фамилия</label>
            <input type="text" id="userName" placeholder="Например: Иванова Анна">
        </div>
        <div class="form-group">
            <label>Город</label>
            <select id="userCity">
                <option value="">-- Выберите город --</option>
                <option value="Сыктывкар">Сыктывкар</option>
                <option value="Оренбург">Оренбург</option>
                <option value="Екатеринбург">Екатеринбург</option>
                <option value="Уфа">Уфа</option>
                <option value="Ульяновск">Ульяновск</option>
                <option value="Нижний Новгород">Нижний Новгород</option>
            </select>
        </div>
        <button id="startTestBtn">Начать тест</button>
    </div>

    <div id="quizScreen" class="hidden">
        <div class="card">
            <div class="progress">Вопрос <span id="qNum">1</span> из <span id="qTotal">11</span></div>
            <div id="questionText" class="question-text"></div>
            <div id="optionsContainer"></div>
            <button id="nextQuestionBtn" disabled>➡ Далее</button>
        </div>
    </div>

    <div id="resultScreen" class="hidden"></div>
</div>

<script>
    // ========== НАСТРОЙКИ GITHUB ==========
    const GITHUB_TOKEN = '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';
    const GITHUB_REPO = 'wetalsfinx/Test';
    const GITHUB_BRANCH = 'main';
    const GITHUB_FILE = 'results.json';  // ← изменил имя файла
    
    // Функция сохранения результата на GitHub (ИСПРАВЛЕНА)
    async function saveToGitHub(result) {
        try {
            console.log('Начинаю сохранение...');
            
            // Шаг 1: Пытаемся получить текущий файл (если есть)
            let existingResults = [];
            let sha = null;
            
            const getResponse = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            
            if (getResponse.ok) {
                // Файл существует — читаем его
                const fileData = await getResponse.json();
                sha = fileData.sha;
                const decodedContent = atob(fileData.content);
                existingResults = JSON.parse(decodedContent);
                console.log('Существующий файл загружен, записей:', existingResults.length);
            } else if (getResponse.status === 404) {
                // Файл не существует — создадим новый
                console.log('Файл results.json не найден, будет создан новый');
                existingResults = [];
            } else {
                console.error('Ошибка при проверке файла:', getResponse.status);
                throw new Error('Не удалось проверить файл на GitHub');
            }
            
            // Шаг 2: Добавляем новый результат
            existingResults.push(result);
            
            // Шаг 3: Кодируем в base64 (правильный способ для UTF-8)
            const jsonString = JSON.stringify(existingResults, null, 2);
            const encoded = btoa(unescape(encodeURIComponent(jsonString)));
            
            // Шаг 4: Сохраняем обратно на GitHub
            const putResponse = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `Тест: ${result.user_name} (${result.city}) — ${result.percent}%`,
                    content: encoded,
                    branch: GITHUB_BRANCH,
                    sha: sha
                })
            });
            
            if (putResponse.ok) {
                console.log('✅ Результат успешно сохранён на GitHub!');
                return true;
            } else {
                const errorData = await putResponse.json();
                console.error('❌ Ошибка при сохранении:', errorData);
                return false;
            }
        } catch(error) {
            console.error('❌ Критическая ошибка:', error);
            return false;
        }
    }

    // ========== ВОПРОСЫ ТЕСТА (без изменений) ==========
    const ORIGINAL_QUESTIONS = [
        { text: "Молодая девушка 25 лет заходит в магазин, смотрит на витрину с кольцами. Вы установили зрительный контакт. Что говорите ПЕРВЫМ?", options: ["«Добрый день! Чем могу помочь?»", "«Здравствуйте! У нас сегодня скидка 30% на бриллианты + оплата бонусами до 80%. Какое изделие выбираете — для себя или в подарок?»", "«Добрый день! Присмотритесь к нашим новинкам»", "«Здравствуйте! Если нужны будут рекомендации — обращайтесь»"], correct: 1 },
        { text: "Клиент говорит: «Мне нужно кольцо до 25 000 рублей». Вы услышали бюджет. Что делаете ДАЛЬШЕ?", options: ["Сразу показываете 3-4 кольца в пределах 25 000 ₽", "Показываете сначала кольцо за 28 000 ₽ (якорь), затем за 25 000 ₽", "Спрашиваете: «А для какого случая? Это подарок или для себя?»", "Спрашиваете: «А готовы добавить за лучшее качество?»"], correct: 2 },
        { text: "Клиентка выбрала кольцо. Вы хотите предложить серьги из той же коллекции. Как говорите?", options: ["«У нас есть ещё серьги, посмотрите?»", "«Можно подобрать серьги к этому кольцу?»", "«Давайте подберём серьги из той же коллекции — вместе они создадут законченный образ»", "«К этому кольцу обычно берут серьги»"], correct: 2 },
        { text: "Клиентка смотрит на серьги из серебра за 12 000 ₽. Вы хотите мягко переориентировать на золото. Что говорите?", options: ["«Золото лучше — оно дороже и качественнее»", "«У нас акция на золото — скидка 30%»", "«Давайте примерим оба варианта — и серебро, и золото. Посмотрите, как золото сверкает на свету»", "«Золото 585 пробы служит дольше»"], correct: 2 },
        { text: "Клиентка оформляет покупку кольца. Вы:", options: ["«Футляр нужен будет?»", "«Давайте выберем для вашего нового украшения красивый футляр и чистящее средство, чтобы оно всегда выглядело безупречно»", "«У нас есть футляры и средства для чистки. Показать?»", "«Можем предложить футляр»"], correct: 1 },
        { text: "Клиентка выбрала кольцо за 38 000 ₽, но говорит: «Дороговато... Я думала, дешевле будет». Что отвечаете?", options: ["«Так вы же золото покупаете, а не бижутерию»", "«Это кольцо с бриллиантом высокой чистоты»", "«Понимаю, цена важна. А с чем вы сравниваете?»", "«Давайте посмотрю, что есть подешевле»"], correct: 2 },
        { text: "Клиент выбирает кольцо, но размера нет в наличии. Что говорите?", options: ["«Можем заказать — доставка 3-5 дней»", "«Этот размер закончился, но скоро привезут»", "«Давайте покажу похожие кольца, которые есть в наличии, а также каталог на заказ»", "«Приходите завтра — возможно, будет в наличии»"], correct: 2 },
        { text: "Клиентка выбирает подарок маме на юбилей. Как презентуете изделие?", options: ["«Это кольцо из золота 585 пробы, вес 3 грамма»", "«Это кольцо станет идеальным напоминанием о её юбилее, она будет с теплотой вспоминать о нем, глядя на ваш подарок»", "«Красивое кольцо, маме понравится»", "«Это кольцо с бриллиантом, очень популярная модель»"], correct: 1 },
        { text: "Клиент спрашивает: «Можно посмотреть другие модели?». Как отвечаете?", options: ["«Да, конечно. Какие именно?»", "«Смотрите, у нас много всего»", "«Давайте я покажу вам ещё несколько моделей, которые идеально дополнят вашу коллекцию»", "«Конечно, вот каталог»"], correct: 2 },
        { text: "Клиентка выбрала кольцо за 55 000 ₽, но колеблется. Вы знаете, что у магазина есть Яндекс Сплит. Когда и КАК вы упоминаете об этом?", options: ["Только если клиентка скажет «дорого» или «я подумаю»", "Только на кассе при оформлении покупки", "Во время презентации, ДО озвучивания итоговой цены: «Для такого выбора можно оформить Сплит — 4 платежа без переплат, это займёт 2 минуты»", "Когда клиентка сама спросит про рассрочку"], correct: 2 },
        { text: "Клиентка зашла в магазин. Вы поздоровались, проговорили акцию. Она кивнула и продолжает медленно идти вдоль витрины, не останавливаясь. Что делаете?", options: ["Сразу подходите и спрашиваете: «Что-то присмотрели?»", "Ждёте 20-30 секунд, даёте клиентке освоиться, затем мягко начинаете диалог: «Какое изделие выбираете? Для себя или в подарок?»", "Подходите через 5 минут", "Наблюдаете, но не подходите, пока клиентка сама не обратится"], correct: 1 }
    ];

    let shuffledQuestions = [];
    let currentUser = { name: '', city: '' };
    let currentIndex = 0;
    let userSelections = [];
    let currentSelectedOption = null;

    const regScreen = document.getElementById('regScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startBtn = document.getElementById('startTestBtn');
    const nextBtn = document.getElementById('nextQuestionBtn');
    const qNumSpan = document.getElementById('qNum');
    const qTotalSpan = document.getElementById('qTotal');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderQuestion() {
        const q = shuffledQuestions[currentIndex];
        questionTextDiv.innerText = q.text;
        qNumSpan.innerText = currentIndex + 1;
        qTotalSpan.innerText = shuffledQuestions.length;

        optionsContainer.innerHTML = '';
        currentSelectedOption = null;
        nextBtn.disabled = true;

        q.options.forEach((opt, idx) => {
            const optionDiv = document.createElement('div');
            optionDiv.className = 'option';
            const letter = String.fromCharCode(65 + idx);
            optionDiv.innerText = `${letter}) ${opt}`;
            optionDiv.dataset.idx = idx;
            optionDiv.addEventListener('click', () => {
                document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                optionDiv.classList.add('selected');
                currentSelectedOption = idx;
                nextBtn.disabled = false;
            });
            optionsContainer.appendChild(optionDiv);
        });
    }

    async function saveResult() {
        let correctCount = 0;
        const answersDetail = [];

        for (let i = 0; i < shuffledQuestions.length; i++) {
            const selectedIdx = userSelections[i];
            const q = shuffledQuestions[i];
            const isCorrect = (selectedIdx === q.correct);
            if (isCorrect) correctCount++;
            answersDetail.push({
                questionNum: i + 1,
                selected: selectedIdx,
                correct: isCorrect,
                questionText: q.text,
                selectedText: q.options[selectedIdx],
                correctText: q.options[q.correct]
            });
        }
        const percent = Math.round((correctCount / shuffledQuestions.length) * 100);
        const passed = percent >= 85;

        const resultData = {
            id: Date.now(),
            user_name: currentUser.name,
            city: currentUser.city,
            score: correctCount,
            total: shuffledQuestions.length,
            percent: percent,
            passed: passed,
            answers: answersDetail,
            date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };

        // Показываем сообщение о сохранении
        resultScreen.classList.remove('hidden');
        resultScreen.innerHTML = `
            <div class="result-box ${passed ? 'success' : 'fail'}">
                <h2>${passed ? '🏆 Победа!' : '😞 Тест не пройден'}</h2>
                <p>Правильных ответов: ${correctCount} из ${shuffledQuestions.length}</p>
                <p>Ваш результат: ${percent}%</p>
                <p>${passed ? 'Отлично! Вы применяете правила продаж.' : 'Порог успеха: 85%. Повторите и попробуйте снова.'}</p>
                <div class="save-status" id="saveStatus">⏳ Сохраняю результат...</div>
                <button class="restart-btn" onclick="location.reload()">🔄 Пройти заново</button>
            </div>
        `;
        
        // Сохраняем на GitHub
        const saved = await saveToGitHub(resultData);
        const statusDiv = document.getElementById('saveStatus');
        if (statusDiv) {
            if (saved) {
                statusDiv.innerHTML = '✅ Результат сохранён!';
                statusDiv.style.color = '#2c6e2c';
            } else {
                statusDiv.innerHTML = '⚠️ Результат не сохранился. Проверьте консоль (F12)';
                statusDiv.style.color = '#c41e3a';
            }
        }
    }

    function nextQuestionHandler() {
        if (currentSelectedOption === null) return;
        userSelections[currentIndex] = currentSelectedOption;
        currentIndex++;
        if (currentIndex < shuffledQuestions.length) {
            renderQuestion();
        } else {
            quizScreen.classList.add('hidden');
            saveResult();
        }
    }

    startBtn.onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите город из списка'); return; }

        shuffledQuestions = shuffleArray([...ORIGINAL_QUESTIONS]);
        currentUser = { name, city };
        currentIndex = 0;
        userSelections = [];
        currentSelectedOption = null;

        regScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        renderQuestion();
    };
    nextBtn.onclick = nextQuestionHandler;
</script>
</body>
</html>
