            icon: "🛍️", label: "Допродажа", title: "Допродажа на кассе",
            dialogue: [
                { speaker: "client", text: "Клиентка выбрала золотые серьги-пусеты. «Всё, давайте оформлять, мне очень понравилось.»" },
                { speaker: "seller", text: "Прекрасный выбор! Они будут вас радовать каждый день.", error: false },
                { speaker: "client", text: "Спасибо." },
                { speaker: "seller", text: "Пробивать чек?", error: true, explanation: "Продавец упустил возможность увеличить чек и проявить заботу о продукте, перейдя сразу к упаковке.", rec: "Скажите: «Чтобы серьги всегда сияли как новые, позвольте добавить к покупке нашу профессиональную салфетку для чистки золота. Она стоит всего 300 рублей, но продлевает жизнь украшению на годы. Добавим в чек?»" },
                { speaker: "client", text: "Клиентка: «Да, оплата картой»." },
                { speaker: "seller", text: "Чтобы серьги всегда сияли как новые, позвольте добавить к покупке нашу профессиональную салфетку для чистки золота. Она стоит всего 300 рублей, но продлевает жизнь украшению на годы. Добавим в чек?", error: false }
            ],
            correctErrors: [3]
        },
        {
            icon: "🔍", label: "Сужение выбора", title: "А что есть ещё?",
            dialogue: [
                { speaker: "client", text: "Клиентка: «Мне нравится это кольцо, но посмотрю я ещё что-нибудь»." },
                { speaker: "seller", text: "Конечно! А что именно вам понравилось в этой модели: камень, форма шинки?", error: false },
                { speaker: "client", text: "Клиентка: «Ну, мне нравится, что оно не слишком широкое и легкое»." },
                { speaker: "seller", text: "Поняла! Вот ещё 10 колец из этой витрины, посмотрите все, вдруг что-то приглянется.", error: true, explanation: "Продавец полностью проигнорировал критерий клиента («не слишком широкое») и показывает всё подряд.", rec: "Сузьте выбор на основе критериев: «Тогда давайте посмотрим эти 2-3 изящные модели, они как раз легкие и аккуратные»." }
            ],
            correctErrors: [3]
        },
        {
            icon: "💍", label: "Завершение сделки", title: "Беру",
            dialogue: [
                { speaker: "client", text: "Клиентка: «Всё, беру это кольцо!»" },
                { speaker: "seller", text: "Отлично! Что-то еще может?", error: true, explanation: "Продавец упустил золотую возможность для допродажи (футляр, средство для ухода, серьги из той же коллекции).", rec: "Скажите: «Отличный выбор! Давайте подберём к кольцу футляр и средство для ухода, чтобы оно всегда сияло. Или, может быть, серьги из этой же коллекции?»" },
                { speaker: "client", text: "Клиентка: «Нет, спасибо, только кольцо»." },
                { speaker: "seller", text: "Хорошо, тогда пройдем к кассе. Давайте выберем футляр для вашего нового украшения!", error: false }
            ],
            correctErrors: [1]
        }
    ];

    let currentScenario = 0;
    let selectedErrors = [];
    let gameResults = [];
    let currentUser = { name: '', city: '' };

    const regScreen = document.getElementById('regScreen');
    const quizScreen = document.getElementById('quizScreen');
    const finalScreen = document.getElementById('finalScreen');
    const checkBtn = document.getElementById('checkBtn');

    function updateProgress() {
        const progress = (currentScenario / SCENARIOS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
    }

    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        document.getElementById('totalScenarios').textContent = SCENARIOS.length;
        updateProgress();

        document.getElementById('scenarioHeader').innerHTML = `
            <div class="question-wrapper">
                <div class="question-icon">${scenario.icon}</div>
                <div class="question-content">
                    <div class="question-label">${scenario.label}</div>
                    <div class="question-text">${scenario.title}</div>
                </div>
            </div>
        `;

        selectedErrors = [];
        const dialogueArea = document.getElementById('dialogueArea');
        dialogueArea.innerHTML = '';

        scenario.dialogue.forEach((msg, idx) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.speaker}`;
            msgDiv.dataset.idx = idx;

            if (msg.speaker === 'seller' && msg.error !== undefined) {
                msgDiv.classList.add('clickable');
                msgDiv.onclick = () => toggleError(idx, msgDiv);
            }

            msgDiv.innerHTML = `
                <div class="speaker">${msg.speaker === 'client' ? '👤 Клиент' : '💼 Продавец'}</div>
                <div>${msg.text}</div>
            `;
            dialogueArea.appendChild(msgDiv);
        });

        checkBtn.textContent = '✅ Проверить';
        checkBtn.className = 'btn-primary';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;

        document.getElementById('resultCard').style.display = 'none';
    }

    function toggleError(idx, element) {
        if (selectedErrors.includes(idx)) {
            selectedErrors = selectedErrors.filter(i => i !== idx);
            element.classList.remove('selected');
        } else {
            selectedErrors.push(idx);
            element.classList.add('selected');
        }
        checkBtn.disabled = selectedErrors.length === 0;
    }

    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctErrors = scenario.correctErrors;

        document.querySelectorAll('.message.seller').forEach((msg) => {
            const globalIdx = parseInt(msg.dataset.idx);
            if (correctErrors.includes(globalIdx)) msg.classList.add('correct');
            if (selectedErrors.includes(globalIdx) && !correctErrors.includes(globalIdx)) msg.classList.add('wrong');
            msg.classList.remove('clickable');
            msg.onclick = null;
        });

        const correctFound = selectedErrors.filter(e => correctErrors.includes(e)).length;
        const wrongFound = selectedErrors.filter(e => !correctErrors.includes(e)).length;
        const score = Math.max(0, correctFound - wrongFound);
        const maxScore = correctErrors.length;
        const percent = maxScore > 0 ? Math.round((score / maxScore) * 100) : 100;

        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${percent >= 70 ? 'success' : 'fail'}`;

        let html = `<h2>${percent >= 70 ? '🎉 Отлично!' : '⚠️ Есть над чем поработать'}</h2>`;
        html += `<p>Найдено ошибок: <strong>${correctFound} из ${maxScore}</strong> (Результат: ${percent}%)</p>`;

        html += '<div class="rec-section"><h3>📚 Разбор ошибок сценария</h3>';
        correctErrors.forEach(idx => {
            const msg = scenario.dialogue[idx];
            html += `
                <div class="rec-item">
                    <div class="rec-q">❌ Ошибка: «${msg.text}»</div>
                    <div class="rec-expl">${msg.explanation}</div>
                    <div class="rec-tip">📌 <strong>Как надо:</strong> ${msg.rec}</div>
                </div>
            `;
        });
        html += '</div>';
        resultCard.innerHTML = html;

        gameResults.push({
            scenario: scenario.title,
            score: score,
            maxScore: maxScore,
            percent: percent,
            selectedErrors: selectedErrors,
            correctErrors: correctErrors
        });

        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn-primary btn-next';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                currentScenario++;
                renderScenario();
            };
        } else {
            checkBtn.textContent = '🏁 Завершить игру';
            checkBtn.className = 'btn-primary btn-finish';
            checkBtn.disabled = false;
            checkBtn.onclick = finishGame;
        }
    }

    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.score, 0);
        const maxTotal = gameResults.reduce((sum, r) => sum + r.maxScore, 0);
        const avgPercent = maxTotal > 0 ? Math.round((totalScore / maxTotal) * 100) : 0;
        const passed = avgPercent >= 70;

        quizScreen.classList.add('hidden');
        finalScreen.classList.remove('hidden');

        finalScreen.innerHTML = `
            <div class="final-card ${passed ? 'success' : 'fail'}">
                <div class="final-icon">${passed ? '🏆' : '📚'}</div>
                <h2>${passed ? 'Отличный результат!' : 'Есть над чем поработать'}</h2>
                <p>${passed ? 'Вы хорошо видите нарушения алгоритма продаж!' : 'Рекомендуем повторить алгоритм продаж и сыграть ещё раз.'}</p>
                <div class="result-stats">
                    <div class="stat-box"><div class="stat-value">${avgPercent}%</div><div class="stat-label">Результат</div></div>
                    <div class="stat-box"><div class="stat-value">${totalScore}/${maxTotal}</div><div class="stat-label">Ошибок найдено</div></div>
                </div>
                <div class="save-status" id="saveStatus"><span class="spinner"></span>Сохраняю результат...</div>
                <button class="restart-btn" onclick="location.reload()">🔄 Пройти ещё раз</button>
            </div>
        `;

        const resultData = {
            id: Date.now(), type: 'errorfinder', user_name: currentUser.name, city: currentUser.city,
            score: totalScore, total: maxTotal, percent: avgPercent, passed: passed,
            scenarios: gameResults, date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };

        const statusDiv = document.getElementById('saveStatus');
        try {
            const localBackup = JSON.parse(localStorage.getItem('errorfinder_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('errorfinder_backup', JSON.stringify(localBackup));

            const newRef = db.ref('results/errorfinder').push();
            await newRef.set(resultData);

            const backup = JSON.parse(localStorage.getItem('errorfinder_backup') || '[]');
            localStorage.setItem('errorfinder_backup', JSON.stringify(backup.filter(r => r.id !== resultData.id)));

            statusDiv.innerHTML = '✅ Результат сохранён в облаке!';
            statusDiv.style.color = '#10b981';
            statusDiv.style.background = 'rgba(16,185,129,0.1)';
        } catch(e) {
            statusDiv.innerHTML = '⚠️ Сохранено локально, отправится при следующем запуске.';
            statusDiv.style.color = '#d97706';
            statusDiv.style.background = 'rgba(217,119,6,0.1)';
        }
    }

    document.getElementById('startBtn').onclick = () => {
        const name = document.getElementById('userName').value.trim();
        const city = document.getElementById('userCity').value;
        if (!name) { alert('Введите имя и фамилию'); return; }
        if (!city) { alert('Выберите город'); return; }

        currentUser = { name, city };
        currentScenario = 0;
        selectedErrors = [];
        gameResults = [];

        regScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        renderScenario();
    };

    document.getElementById('userName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('startBtn').click();
    });
</script>
</body>
</html>
