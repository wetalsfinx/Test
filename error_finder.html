    // ========== 📖 РЕНДЕР СЦЕНАРИЯ ==========
    function renderScenario() {
        const scenario = SCENARIOS[currentScenario];
        document.getElementById('scenarioNum').textContent = currentScenario + 1;
        
        const progress = ((currentScenario) / SCENARIOS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        
        selectedErrors = [];
        
        const dialogueArea = document.getElementById('dialogueArea');
        dialogueArea.innerHTML = '';
        
        scenario.dialogue.forEach((msg, idx) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.speaker}`;
            msgDiv.dataset.idx = idx;
            
            if (msg.speaker === 'seller' && msg.error !== undefined) {
                msgDiv.onclick = () => toggleError(idx, msgDiv);
            }
            
            msgDiv.innerHTML = `
                <div class="speaker">${msg.speaker === 'client' ? '👤 Клиент' : '👨‍💼 Продавец'}</div>
                <div>${msg.text}</div>
            `;
            
            dialogueArea.appendChild(msgDiv);
        });
        
        const checkBtn = document.getElementById('checkBtn');
        checkBtn.textContent = '✅ Проверить';
        checkBtn.className = 'btn btn-primary';
        checkBtn.disabled = true;
        checkBtn.onclick = checkScenario;
        
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('saveStatus').textContent = '';
    }

    // ========== 🖱️ ВЫБОР ОШИБКИ ==========
    function toggleError(idx, element) {
        if (selectedErrors.includes(idx)) {
            selectedErrors = selectedErrors.filter(i => i !== idx);
            element.classList.remove('selected');
        } else {
            selectedErrors.push(idx);
            element.classList.add('selected');
        }
        
        document.getElementById('checkBtn').disabled = selectedErrors.length === 0;
    }

    // ========== ✅ ПРОВЕРКА СЦЕНАРИЯ ==========
    function checkScenario() {
        const scenario = SCENARIOS[currentScenario];
        const correctErrors = scenario.correctErrors;
        
        const messages = document.querySelectorAll('.message.seller');
        messages.forEach((msg) => {
            const globalIdx = parseInt(msg.dataset.idx);
            if (correctErrors.includes(globalIdx)) {
                msg.classList.add('correct');
            }
            if (selectedErrors.includes(globalIdx) && !correctErrors.includes(globalIdx)) {
                msg.classList.add('wrong');
            }
        });
        
        const correctFound = selectedErrors.filter(e => correctErrors.includes(e)).length;
        const wrongFound = selectedErrors.filter(e => !correctErrors.includes(e)).length;
        
        const score = Math.max(0, correctFound - wrongFound);
        const maxScore = correctErrors.length;
        const percent = maxScore > 0 ? Math.round((score / maxScore) * 100) : 100;
        
        const resultCard = document.getElementById('resultCard');
        resultCard.style.display = 'block';
        resultCard.className = `result-card ${percent >= 70 ? 'success' : 'fail'}`;
        
        let html = `<h2>${percent >= 70 ? '🎉 Отлично!' : '⚠️ Есть над чем поработать'}</h2>`;
        html += `<p style="text-align: center; font-size: 18px; margin-bottom: 20px;">Найдено ошибок: ${correctFound} из ${maxScore} (Результат: ${percent}%)</p>`;
        
        html += '<div style="text-align: left; margin-top: 16px;">';
        correctErrors.forEach(idx => {
            const msg = scenario.dialogue[idx];
            html += `
                <div class="explanation">
                    <div class="error-text">❌ Ошибка: "${msg.text}"</div>
                    <div style="margin-top: 6px; color: #6b7280;">${msg.explanation}</div>
                    <div class="rec">📌 ${msg.rec}</div>
                </div>
            `;
        });
        html += '</div>';
        
        resultCard.innerHTML = html;
        
        gameResults.push({
            scenario: scenario.title,
            score: score,
            maxScore: maxScore,
            percent: percent,
            selectedErrors: selectedErrors,
            correctErrors: correctErrors
        });
        
        const checkBtn = document.getElementById('checkBtn');
        if (currentScenario < SCENARIOS.length - 1) {
            checkBtn.textContent = '➡️ Следующий сценарий';
            checkBtn.className = 'btn btn-next';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                currentScenario++;
                renderScenario();
            };
        } else {
            checkBtn.textContent = '🏁 Завершить игру';
            checkBtn.className = 'btn btn-finish';
            checkBtn.disabled = false;
            checkBtn.onclick = () => {
                finishGame();
            };
        }
    }

    // ========== 🏁 ЗАВЕРШЕНИЕ ИГРЫ ==========
    async function finishGame() {
        const totalScore = gameResults.reduce((sum, r) => sum + r.score, 0);
        const maxTotal = gameResults.reduce((sum, r) => sum + r.maxScore, 0);
        const avgPercent = maxTotal > 0 ? Math.round((totalScore / maxTotal) * 100) : 0;
        
        const resultData = {
            id: Date.now(),
            type: 'errorfinder',
            user_name: currentUserName,
            city: currentUserCity,
            score: totalScore,
            total: maxTotal,
            percent: avgPercent,
            passed: avgPercent >= 70,
            scenarios: gameResults,
            date: new Date().toISOString(),
            timestamp: new Date().toLocaleString('ru-RU')
        };
        
        const dialogueArea = document.getElementById('dialogueArea');
        dialogueArea.innerHTML = `
            <div class="final-screen">
                <h2>🎉 Игра завершена!</h2>
                <div class="result-big">${avgPercent}%</div>
                <p>Найдено ошибок: ${totalScore} из ${maxTotal}</p>
                <p style="margin-top: 24px; font-size: 20px;">${avgPercent >= 70 ? '✅ Отличный результат! Вы хорошо знаете алгоритм продаж.' : '⚠️ Рекомендуем повторить тренажёр и изучить алгоритм продаж.'}</p>
                <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 32px; max-width: 300px;">🔄 Пройти ещё раз</button>
            </div>
        `;
        
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('checkBtn').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
        
        const statusDiv = document.getElementById('saveStatus');
        statusDiv.textContent = '⏳ Сохранение...';
        statusDiv.style.color = '#d97706';
        
        try {
            const localBackup = JSON.parse(localStorage.getItem('errorfinder_backup') || '[]');
            localBackup.push(resultData);
            localStorage.setItem('errorfinder_backup', JSON.stringify(localBackup));
            
            const newRef = db.ref('results/errorfinder').push();
            await newRef.set(resultData);
            
            const backup = JSON.parse(localStorage.getItem('errorfinder_backup') || '[]');
            const filtered = backup.filter(r => r.id !== resultData.id);
            localStorage.setItem('errorfinder_backup', JSON.stringify(filtered));
            
            statusDiv.textContent = '✅ Результат сохранён!';
            statusDiv.style.color = '#10b981';
        } catch(e) {
            statusDiv.textContent = '⚠️ Сохранено локально';
            statusDiv.style.color = '#ef4444';
        }
    }
</script>
