<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>585GOLD | Дашборд — чистая версия</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-top: 4px solid #c41e3a;
        }
        h2, h3 {
            color: #c41e3a;
            margin-top: 0;
        }
        select, button {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }
        button {
            background: #c41e3a;
            color: white;
            border: none;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }
        .kpi-value {
            font-size: 32px;
            font-weight: bold;
            color: #c41e3a;
        }
        .charts-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .chart-box {
            flex: 1;
            min-width: 280px;
        }
        canvas {
            max-height: 220px;
            width: 100%;
        }
        .employee-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .employee-item:hover {
            background: #fff0f3;
        }
        .badge {
            background: #c41e3a;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
        }
        .top-employee, .city-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .flex-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 20px;
        }
        .answer-item {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .answer-correct {
            border-left: 4px solid #28a745;
        }
        .answer-wrong {
            border-left: 4px solid #c41e3a;
        }
        .recommendation {
            background: #e8f0e8;
            padding: 8px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="card">
        <h2>📊 585GOLD | Дашборд (чистая версия)</h2>
        <div class="flex-row">
            <select id="cityFilter"><option value="all">Все города</option></select>
            <button id="loadBtn">Загрузить</button>
            <button id="feedbackBtn">📝 Фидбек для города</button>
        </div>
        <div id="status" style="margin-top: 8px; color: #666; font-size: 13px;"></div>
    </div>

    <div id="statsArea" style="display: none;">
        <div class="kpi-grid" id="kpi"></div>
        <div class="charts-row">
            <div class="card chart-box"><h3>Распределение баллов</h3><canvas id="scoreChart"></canvas></div>
            <div class="card chart-box"><h3>Топ городов</h3><canvas id="cityChart"></canvas></div>
        </div>
        <div class="row" style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div class="card" style="flex:1"><h3>🏆 Топ сотрудников (≥85%)</h3><div id="topList"></div></div>
            <div class="card" style="flex:1"><h3>🏙️ Рейтинг городов</h3><div id="cityRating"></div></div>
        </div>
        <div class="card">
            <h3>📋 Список сотрудников (<span id="empCount">0</span>)</h3>
            <div id="employeeList"></div>
        </div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <div id="modalAnswers"></div>
        <button onclick="closeModal()" style="margin-top: 16px; background: #6c757d;">Закрыть</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient(
        'https://qtostraaqrnjbxiydlip.supabase.co',
        'sb_publishable_0GzJSuoAi5zc7pHkicHMNg_cQ-rGAX7'
    );

    let allData = [];
    let filteredData = [];
    let scoreChart = null;
    let cityChart = null;

    function getRecommendation(text) {
        const q = text.toLowerCase();
        if (q.includes('скидка') && q.includes('бонусами')) return '💡 Сначала дайте ценность (скидку + бонусы), затем задайте открытые вопросы.';
        if (q.includes('с чем она планирует носить')) return '💡 Уточните контекст: куда и с чем будет носить — это поможет подобрать точнее.';
        if (q.includes('давайте примерим')) return '💡 Не соглашайтесь сразу. Пригласите примерить — клиент сам увидит.';
        if (q.includes('подобрать серьги')) return '💡 Сначала предложите дополнительное украшение, покажите образ целиком.';
        if (q.includes('сплит') && q.includes('45 000')) return '💡 Назовите цену и сразу предложите Сплит как комфортный вариант оплаты.';
        if (q.includes('с чем вы сравниваете')) return '💡 Не спешите снижать цену. Сначала выясните причину сомнения.';
        if (q.includes('сплит') && q.includes('11 250')) return '💡 Подтвердите ценность товара, затем предложите Сплит.';
        if (q.includes('футляр')) return '💡 Не спрашивайте «нужно?». Презентуйте аксессуар как полезную добавку.';
        return '💡 Изучите правильный ответ и повторите материал.';
    }

    async function loadResults() {
        document.getElementById('status').innerHTML = 'Загрузка...';
        document.getElementById('statsArea').style.display = 'none';
        
        const { data, error } = await supabaseClient
            .from('results_new')
            .select('*')
            .eq('test_slug', 'prodazhi_2025')
            .order('created_at', { ascending: false })
            .limit(500);
        
        if (error) {
            document.getElementById('status').innerHTML = 'Ошибка: ' + error.message;
            return;
        }
        
        if (!data || data.length === 0) {
            document.getElementById('status').innerHTML = 'Нет данных';
            return;
        }
        
        allData = data.map(r => ({
            id: r.id,
            user_name: r.user_name || r.user_id || 'Аноним',
            city: r.city || 'Не указан',
            score: r.score || 0,
            total: r.total || 11,
            percent: r.percent || 0,
            answers: r.answers || [],
            created_at: r.created_at
        }));
        
        // Обновляем список городов
        const cities = [...new Set(allData.map(r => r.city))];
        const citySelect = document.getElementById('cityFilter');
        citySelect.innerHTML = '<option value="all">Все города</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
        
        applyFilters();
        document.getElementById('statsArea').style.display = 'block';
        document.getElementById('status').innerHTML = `✅ Загружено: ${allData.length} записей`;
    }

    function applyFilters() {
        const city = document.getElementById('cityFilter').value;
        filteredData = city === 'all' ? [...allData] : allData.filter(r => r.city === city);
        renderDashboard();
    }

    function renderDashboard() {
        const total = filteredData.length;
        if (total === 0) {
            document.getElementById('kpi').innerHTML = '<div class="kpi-card">Нет данных</div>';
            return;
        }
        
        const avgPercent = Math.round(filteredData.reduce((s, r) => s + r.percent, 0) / total);
        const successCount = filteredData.filter(r => r.percent >= 85).length;
        const allErrors = filteredData.reduce((s, r) => s + (r.total - r.score), 0);
        
        document.getElementById('kpi').innerHTML = `
            <div class="kpi-card"><div class="kpi-value">${total}</div><div>Сотрудников</div></div>
            <div class="kpi-card"><div class="kpi-value">${avgPercent}%</div><div>Средний балл</div></div>
            <div class="kpi-card"><div class="kpi-value">${successCount}</div><div>Успешно (≥85%)</div></div>
            <div class="kpi-card"><div class="kpi-value">${allErrors}</div><div>Ошибок всего</div></div>
        `;
        
        // Топ сотрудников
        const top5 = [...filteredData].filter(r => r.percent >= 85).sort((a,b) => b.percent - a.percent).slice(0,5);
        document.getElementById('topList').innerHTML = top5.map((r,i) => `
            <div class="top-employee" onclick="showEmployee(${r.id})">
                <span><b>${i+1}</b> ${r.user_name} (${r.city})</span>
                <span class="badge">${r.percent}%</span>
            </div>
        `).join('') || '<div>Нет сотрудников с результатом ≥85%</div>';
        
        // Рейтинг городов
        const cityMap = new Map();
        filteredData.forEach(r => {
            if (!cityMap.has(r.city)) cityMap.set(r.city, { sum: 0, count: 0 });
            const c = cityMap.get(r.city);
            c.sum += r.percent;
            c.count++;
        });
        const cityRating = Array.from(cityMap.entries()).map(([city, data]) => ({
            city, avg: Math.round(data.sum / data.count), count: data.count
        })).sort((a,b) => b.avg - a.avg);
        
        document.getElementById('cityRating').innerHTML = cityRating.map(c => `
            <div class="city-row" onclick="document.getElementById('cityFilter').value='${c.city}'; applyFilters();">
                <span><b>${c.city}</b> (${c.count} чел.)</span>
                <span class="badge">${c.avg}%</span>
            </div>
        `).join('');
        
        // Список сотрудников
        document.getElementById('empCount').innerText = filteredData.length;
        document.getElementById('employeeList').innerHTML = filteredData.map(r => `
            <div class="employee-item" onclick="showEmployee(${r.id})">
                <span><b>${r.user_name}</b> (${r.city})</span>
                <span class="badge" style="background:${r.percent>=85?'#28a745':'#c41e3a'}">${r.percent}%</span>
            </div>
        `).join('');
        
        // График распределения
        const bins = [0,0,0,0,0];
        filteredData.forEach(r => {
            if (r.percent <= 20) bins[0]++;
            else if (r.percent <= 40) bins[1]++;
            else if (r.percent <= 60) bins[2]++;
            else if (r.percent <= 80) bins[3]++;
            else bins[4]++;
        });
        
        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(document.getElementById('scoreChart'), {
            type: 'bar',
            data: { labels: ['0-20%', '21-40%', '41-60%', '61-80%', '81-100%'], datasets: [{ data: bins, backgroundColor: '#c41e3a' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, animation: { duration: 0 } }
        });
        
        // График городов
        if (cityChart) cityChart.destroy();
        cityChart = new Chart(document.getElementById('cityChart'), {
            type: 'bar',
            data: { labels: cityRating.map(c => c.city), datasets: [{ data: cityRating.map(c => c.avg), backgroundColor: '#c41e3a' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, animation: { duration: 0 } }
        });
    }
    
    async function showEmployee(id) {
        const emp = filteredData.find(r => r.id === id);
        if (!emp) return;
        
        document.getElementById('modalTitle').innerHTML = `${emp.user_name} (${emp.city}) — ${emp.percent}%`;
        let html = `<p>✅ Правильных ответов: ${emp.score}/${emp.total}</p>`;
        
        if (emp.answers && emp.answers.length) {
            emp.answers.forEach((a, i) => {
                const isCorrect = a.correct === true;
                html += `<div class="answer-item ${isCorrect ? 'answer-correct' : 'answer-wrong'}">
                            <b>Вопрос ${i+1}:</b> ${a.questionText}<br>
                            <b>Ответ сотрудника:</b> ${a.selectedText}<br>
                            ${!isCorrect ? `<b>✅ Правильный ответ:</b> ${a.correctText}<br><div class="recommendation">${getRecommendation(a.correctText)}</div>` : ''}
                         </div>`;
            });
        } else {
            html += '<div>Нет детальных ответов</div>';
        }
        
        document.getElementById('modalAnswers').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function generateCityFeedback() {
        const city = document.getElementById('cityFilter').value;
        if (city === 'all') { alert('Выберите конкретный город'); return; }
        if (filteredData.length === 0) { alert('Нет данных по этому городу'); return; }
        
        const total = filteredData.length;
        const avgPercent = Math.round(filteredData.reduce((s,r) => s + r.percent, 0) / total);
        
        const questionErrors = new Map();
        filteredData.forEach(r => {
            if (r.answers && r.answers.length) {
                r.answers.forEach((a, idx) => {
                    if (!a.correct) {
                        if (!questionErrors.has(idx)) {
                            questionErrors.set(idx, { text: a.questionText, correctAnswer: a.correctText, count: 0 });
                        }
                        questionErrors.get(idx).count++;
                    }
                });
            }
        });
        
        if (questionErrors.size === 0) {
            alert(`В городе ${city} нет ошибок`);
            return;
        }
        
        let feedback = `📊 Анализ результатов: город ${city}\n👥 Сотрудников: ${total}\n📈 Средний балл: ${avgPercent}%\n\n⚠️ Частые ошибки:\n`;
        [...questionErrors.entries()].sort((a,b) => b[1].count - a[1].count).forEach(([idx, err], order) => {
            let text = err.text;
            if (text.length > 200) text = text.substring(0, 200) + '…';
            feedback += `${order+1}. ${text}\n   ❌ Ошиблись: ${err.count} из ${total}\n   ✅ Правильный ответ: ${err.correctAnswer}\n   📌 ${getRecommendation(err.correctAnswer)}\n\n`;
        });
        
        navigator.clipboard.writeText(feedback).then(() => alert(`Фидбек для города ${city} скопирован в буфер`));
    }
    
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    
    document.getElementById('loadBtn').onclick = loadResults;
    document.getElementById('cityFilter').onchange = applyFilters;
    document.getElementById('feedbackBtn').onclick = generateCityFeedback;
    window.closeModal = closeModal;
    
    loadResults();
</script>
</body>
</html>
