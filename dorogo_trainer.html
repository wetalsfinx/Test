       stern: { L: 'M-19 229 l12 5', R: 'M9 234 l12 -5', M: 'M-9 268 L13 268' } },
  c: { worried: { L: 'M-18 233 L-6 228', R: 'M8 228 L20 233', M: 'M-8 267 Q2 262 12 267' },
       frown:   { L: 'M-18 228 L-6 233', R: 'M8 233 L20 228', M: 'M-8 270 Q2 259 12 270' },
       neutral: { L: 'M-18 232 q6 -3 12 0', R: 'M8 232 q6 -3 12 0', M: 'M-8 265 L12 265' },
       happy:   { L: 'M-18 230 q6 -5 12 0', R: 'M8 230 q6 -5 12 0', M: 'M-10 261 Q2 276 14 261' } }
};
const CLIENT_X = 1010;

// ===================== СЦЕНАРИИ =====================
// Сегмент: d — длительность (сек); say — {who:'s'|'c', text}; ms/mc — настроение; cap — подпись (сохраняется до смены, null — убрать);
// card — заставка на весь экран; walk — клиент уходит; reset — вернуть сцену в начало; spark — искры радости
const T = {
  intro:   { d: 3.2, cap: { k: 'info', t: 'Ирина примерила серьги с бриллиантами — 38 900 ₽' }, ms: 'smile', mc: 'neutral' },
  dorogo:  { d: 3.4, say: { who: 'c', text: '«Красиво… но дороговато»' }, mc: 'worried', cap: null },
  justify: { d: 4.2, say: { who: 's', text: '«Так это же бриллианты, а не бижутерия! Цена оправдана»' }, ms: 'stern' },
  think:   { d: 3.0, say: { who: 'c', text: '«Хм… Я, пожалуй, подумаю»' }, mc: 'frown' },
  leaveBad:{ d: 2.8, walk: true, cap: { k: 'bad', t: '❌ Оправдывать цену = спорить с клиентом' } },
  cheaper: { d: 4.2, say: { who: 's', text: '«Давайте покажу серьги подешевле — вот эти за 15 000»' }, ms: 'smile' },
  notSame: { d: 3.6, say: { who: 'c', text: '«Ну… эти мне не так нравятся. Я, наверное, в другой раз»' }, mc: 'neutral' },
  leaveMid:{ d: 2.8, walk: true, cap: { k: 'bad', t: '❌ Мы решили за клиентку, что ей дорого' } },
  join:    { d: 4.2, say: { who: 's', text: '«Понимаю, сумма серьёзная. А с чем сравниваете?»' }, ms: 'smile', cap: { k: 'good', t: '✅ Присоединиться и уточнить' } },
  budget:  { d: 3.2, say: { who: 'c', text: '«Думала уложиться тысяч в 30»' }, mc: 'neutral', cap: null },
  asYouLike:{ d: 4.0, say: { who: 's', text: '«Ну, дешевле с бриллиантами не бывает. Как хотите»' }, ms: 'stern' },
  goAway:  { d: 2.6, say: { who: 'c', text: '«Тогда я пойду»' }, mc: 'frown' },
  leave2:  { d: 2.8, walk: true, cap: { k: 'bad', t: '❌ Клиентку оставили одну с сомнением' } },
  inBudget:{ d: 4.0, say: { who: 's', text: '«Тогда вот серьги за 29 000 — как раз в бюджете»' }, ms: 'smile' },
  takeThese:{ d: 3.4, say: { who: 'c', text: '«Хорошо… возьму эти»' }, mc: 'neutral', cap: { k: 'info', t: '🟡 Продажа есть, но не те серьги, что понравились' } },
  value:   { d: 6.0, say: { who: 's', text: '«Такие серьги будут с вами годами. А Сплит можно оформить на 4 платежа без переплат — около 9 700 ₽ в месяц»' }, ms: 'smile', cap: { k: 'good', t: '✅ Ценность + удобная оплата' } },
  tryAgain:{ d: 3.0, say: { who: 's', text: '«Давайте ещё раз примерим?»' } },
  buy:     { d: 3.4, say: { who: 'c', text: '«Давайте оформим!»' }, mc: 'happy', spark: true, cap: { k: 'good', t: '🎉 Ирина купила серьги, которые ей понравились' } }
};
const SUMMARY = { d: 7, card: { cls: 'gold', brand: '585GOLD', t: 'Формула ответа на «дорого»', formula: true } };

// Видео: линейный сценарий
const VIDEO = [
  { d: 3.2, card: { cls: 'red', brand: '585GOLD · ТРЕНАЖЁР', t: 'Клиент говорит «дорого»', s: 'Смотрим два ответа продавца' } },
  T.intro, T.dorogo,
  { d: 2.2, card: { cls: 'red', t: '❌ Как НЕ надо' } },
  T.justify, T.think, T.leaveBad,
  { d: 2.2, card: { cls: 'dark', t: '⏪ Перемотаем назад…' }, reset: true, cap: null, ms: 'smile', mc: 'neutral' },
  { d: 2.2, card: { cls: 'green', t: '✅ А теперь — как надо' } },
  T.dorogo, T.join, T.budget, T.value, T.tryAgain, T.buy,
  SUMMARY
];

// Интерактив: граф узлов
const NODES = {
  start: { segs: [T.intro, T.dorogo], ask: 'Ирина: «Красиво… но дороговато». Что ответит Ольга?',
    opts: [ ['«Так это же бриллианты, а не бижутерия! Цена оправдана»', 'A'], ['«Давайте покажу серьги подешевле — вот эти за 15 000»', 'B'], ['«Понимаю, сумма серьёзная. А с чем сравниваете?»', 'C'] ] },
  A: { segs: [T.justify, T.think, T.leaveBad], end: { id: 'A', k: 'lose', t: '❌ Ирина ушла', p: 'Оправдывая цену, продавец спорит с клиенткой: получается, что она «не понимает ценности». Человек защищается и уходит «подумать».' } },
  B: { segs: [T.cheaper, T.notSame, T.leaveMid], end: { id: 'B', k: 'mid', t: '🟡 Ирина ушла «в другой раз»', p: 'Продавец сам решил, что клиентке дорого, и обесценил серьги, которые ей понравились. Сначала нужно уточнить, что именно смущает.' } },
  C: { segs: [T.join, T.budget], ask: 'Ирина: «Думала уложиться тысяч в 30». Что дальше?',
    opts: [ ['«Ну, дешевле с бриллиантами не бывает. Как хотите»', 'C1'], ['«Тогда вот серьги за 29 000 — как раз в бюджете»', 'C2'], ['«Такие серьги будут с вами годами. А Сплит — 4 платежа без переплат, около 9 700 ₽ в месяц. Давайте ещё раз примерим?»', 'C3'] ] },
  C1: { segs: [T.asYouLike, T.goAway, T.leave2], end: { id: 'C1', k: 'lose', t: '❌ Ирина ушла', p: 'Начали хорошо, но на бюджете сдались. «Как хотите» звучит как равнодушие — клиентку оставили одну с сомнением.' } },
  C2: { segs: [T.inBudget, T.takeThese], end: { id: 'C2', k: 'mid', t: '🟡 Купила, но не то, что хотела', p: 'Продажа есть, но чек ниже, а Ирина уходит без серёг, которые ей понравились. Удобная оплата помогла бы сохранить её выбор.' } },
  C3: { segs: [T.value, T.tryAgain, T.buy], end: { id: 'C3', k: 'win', t: '🎉 Ирина купила серьги мечты!', p: 'Ольга присоединилась, уточнила бюджет, показала ценность и предложила удобную оплату. Клиентка не спорит с ценой — она решает, как ей удобнее платить.' } }
};
const ALL_ENDS = ['A', 'B', 'C1', 'C2', 'C3'];

// ===================== ДВИЖОК =====================
const $ = id => document.getElementById(id);
const setD = (id, d) => $(id).setAttribute('d', d);
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const total = segs => segs.reduce((a, s) => a + s.d, 0);
const BASE = { ms: 'smile', mc: 'neutral', cx: CLIENT_X, cap: null, spark: 0 };

function stateAt(segs, t, base) {
  const st = Object.assign({}, base), start0 = 0; let acc = 0;
  st.say = null; st.card = null; st.talk = false;
  for (const s of segs) {
    if (t < acc) break;
    const p = Math.min(1, (t - acc) / s.d), active = t < acc + s.d;
    if (s.reset) { st.cx = CLIENT_X; st.spark = 0; }
    if (s.ms) st.ms = s.ms; if (s.mc) st.mc = s.mc;
    if ('cap' in s) st.cap = s.cap;
    if (s.spark) st.spark = 1;
    if (s.walk) st.cx = (s.walkFrom ?? CLIENT_X) + (1500 - (s.walkFrom ?? CLIENT_X)) * ease(p);
    if (active) {
      st.local = t - acc; st.p = p;
      if (s.say) st.say = Object.assign({ p, local: t - acc, d: s.d }, s.say);
      if (s.card) st.card = Object.assign({ p, local: t - acc, d: s.d }, s.card);
    }
    acc += s.d;
  }
  st.t = t;
  return st;
}

function draw(st) {
  const t = st.t;
  // продавец
  const fs = FACE.s[st.ms] || FACE.s.smile, fc = FACE.c[st.mc] || FACE.c.neutral;
  setD('sBrowL', fs.L); setD('sBrowR', fs.R); setD('sMouth', fs.M);
  setD('cBrowL', fc.L); setD('cBrowR', fc.R); setD('cMouth', fc.M);
  const sTalk = st.say && st.say.who === 's' && st.say.p < .9 && Math.floor(st.say.local * 7) % 2 === 0;
  const cTalk = st.say && st.say.who === 'c' && st.say.p < .9 && Math.floor(st.say.local * 7) % 2 === 0;
  $('sMouthO').setAttribute('opacity', sTalk ? 1 : 0); $('sMouth').setAttribute('opacity', sTalk ? 0 : 1);
  $('cMouthO').setAttribute('opacity', cTalk ? 1 : 0); $('cMouth').setAttribute('opacity', cTalk ? 0 : 1);
  $('sInner').setAttribute('transform', `translate(0 ${(Math.sin(t * 2.2) * 1.6).toFixed(2)})`);
  const walking = st.cx !== CLIENT_X;
  const bob = walking ? Math.abs(Math.sin(t * 9)) * -6 : Math.sin(t * 2 + 1) * 1.4;
  $('client').setAttribute('transform', `translate(${st.cx.toFixed(1)} ${bob.toFixed(2)})`);
  $('spark').setAttribute('opacity', st.spark ? (0.55 + 0.45 * Math.sin(t * 6)).toFixed(2) : 0);
  // реплики
  ['s', 'c'].forEach(w => {
    const b = $(w === 's' ? 'bS' : 'bC');
    if (st.say && st.say.who === w) {
      const txt = st.say.text, n = Math.min(txt.length, Math.ceil(txt.length * st.say.p / 0.45));
      b.querySelector('.t').textContent = txt.slice(0, n);
      b.style.opacity = Math.min(1, st.say.local / 0.2, (st.say.d - st.say.local) / 0.2);
    } else b.style.opacity = 0;
  });
  // подпись
  const cap = $('cap');
  if (st.cap) { cap.className = 'caption ' + st.cap.k; cap.textContent = st.cap.t; cap.style.opacity = 1; } else cap.style.opacity = 0;
  // заставка
  const card = $('card');
  if (st.card) {
    card.className = 'card ' + st.card.cls;
    $('cardBrand').textContent = st.card.brand || ''; $('cardT').textContent = st.card.t; $('cardS').textContent = st.card.s || '';
    $('cardX').innerHTML = st.card.formula ? '<div class="formula"><div><b>1</b>Присоединиться</div><div><b>2</b>Уточнить</div><div><b>3</b>Показать ценность</div><div><b>4</b>Удобная оплата</div></div><div class="cs" style="margin-top:24px">Клиент не спорит с ценой — он выбирает, как удобнее платить</div>' : '';
    const fade = Math.min(1, st.card.local / 0.3, (st.card.d - st.card.local) / 0.3);
    card.style.opacity = st.card.formula ? Math.min(1, st.card.local / 0.4) : fade;
  } else card.style.opacity = 0;
  return st;
}

// масштабирование сцены
function fit() { const w = $('box').clientWidth; $('stage').style.transform = `scale(${w / 1280})`; }
window.addEventListener('resize', fit);

// ===================== РЕЖИМ ЗАПИСИ ВИДЕО =====================
const params = new URLSearchParams(location.search);
if (params.get('capture')) {
  document.body.classList.add('capture');
  window.VIDEO_TOTAL = total(VIDEO);
  window.renderFrame = t => draw(stateAt(VIDEO, t, BASE));
  fit(); renderFrame(0);
} else {
  // ===================== ИНТЕРАКТИВ =====================
  let base = Object.assign({}, BASE), raf = null, lastChoiceNode = null, found = [];
  try { found = JSON.parse(localStorage.getItem('dorogo585_found') || '[]'); } catch (e) {}
  const showFound = () => $('found').textContent = `Найдено концовок: ${found.length} из ${ALL_ENDS.length}`;
  showFound(); fit();

  function endState(segs, b) { const st = stateAt(segs, total(segs) - 0.001, b); st.say = null; st.card = null; return st; }
  function play(key) {
    const node = NODES[key], segs = node.segs, dur = total(segs), t0 = performance.now();
    cancelAnimationFrame(raf);
    $('panel').innerHTML = '<div class="sub" id="sub"></div><button class="skip" id="skipBtn">Пропустить ⏭</button>';
    let skip = false; $('skipBtn').onclick = () => skip = true;
    const tick = now => {
      let t = (now - t0) / 1000; if (skip) t = dur;
      const st = draw(stateAt(segs, Math.min(t, dur - 0.001), base));
      const sub = $('sub');
      if (sub) sub.innerHTML = st.say ? `<span class="w ${st.say.who}">${st.say.who === 's' ? 'Ольга' : 'Ирина'}</span>${st.say.text}` : (st.cap ? `<span class="w i">Подсказка</span>${st.cap.t}` : '');
      if (t < dur) { raf = requestAnimationFrame(tick); return; }
      base = endState(segs, base);
      if (node.ask) { lastChoiceNode = key; ask(node); } else finish(node.end);
    };
    raf = requestAnimationFrame(tick);
  }
  function ask(node) {
    $('panel').innerHTML = `<div class="q">🤔 ${node.ask}</div><div class="opts">${node.opts.map((o, i) => `<button class="opt" data-n="${o[1]}"><span class="l">${'АБВ'[i]}</span><span>${o[0]}</span></button>`).join('')}</div>`;
    $('panel').querySelectorAll('.opt').forEach(b => b.onclick = () => play(b.dataset.n));
  }
  function finish(end) {
    if (!found.includes(end.id)) { found.push(end.id); try { localStorage.setItem('dorogo585_found', JSON.stringify(found)); } catch (e) {} }
    showFound();
    if (end.k === 'win') { const st = draw(stateAt([SUMMARY], 0.8, base)); }
    $('panel').innerHTML = `<div class="end ${end.k}"><h3>${end.t}</h3><p>${end.p}</p></div>
      <div class="rule">💡 <b>Формула ответа на «дорого»:</b> присоединиться → уточнить → показать ценность → предложить удобную оплату.</div>
      <div class="btns"><button class="btn btn-red" id="againBtn">↩ Попробовать другой ответ</button><button class="btn btn-ghost" id="restartBtn">⏮ Сначала</button></div>`;
    $('againBtn').onclick = () => {
      const path = lastChoiceNode === 'C' ? NODES.start.segs.concat(NODES.C.segs) : NODES.start.segs;
      base = endState(path, Object.assign({}, BASE));
      draw(Object.assign({}, base, { say: null, card: null, t: 0 }));
      ask(NODES[lastChoiceNode]);
    };
    $('restartBtn').onclick = () => { base = Object.assign({}, BASE); play('start'); };
  }
  // стартовый экран
  draw(stateAt([{ d: 1, card: { cls: 'red', brand: '585GOLD · ТРЕНАЖЁР', t: 'Клиент говорит «дорого»', s: 'Вы — продавец Ольга. Выбирайте ответ и смотрите, чем всё закончится' } }], 0.5, BASE));
  $('panel').innerHTML = `<div class="start"><p>Сценка с двумя развилками и пятью разными концовками. Найдёте все?</p><button class="btn btn-red" id="goBtn">▶ Начать</button></div>`;
  $('goBtn').onclick = () => play('start');
}
</script>
</body>
</html>
